1$ with respect to $K$ and $L$**, using the power rule (treating $\\alpha$ as a constant exponent):\n$$\\frac{\\partial Q_1}{\\partial K} = A\\alpha K^{\\alpha-1}L^{1-\\alpha} \\qquad\\qquad \\frac{\\partial Q_1}{\\partial L} = A(1-\\alpha)K^\\alpha L^{-\\alpha}$$\n\n**Step 3 \u2014 find the partial derivatives of $Q_2$**, using the fact that $Q_2$ is just $\\dfrac{1}{\\alpha(1-\\alpha)}$ times $Q_1$, so its partial derivatives are the same constant multiple of $Q_1$'s partial derivatives:\n$$\\frac{\\partial Q_2}{\\partial K} = \\frac{1}{\\alpha(1-\\alpha)}\\times A\\alpha K^{\\alpha-1}L^{1-\\alpha} = \\frac{A}{1-\\alpha}K^{\\alpha-1}L^{1-\\alpha}$$\n$$\\frac{\\partial Q_2}{\\partial L} = \\frac{1}{\\alpha(1-\\alpha)}\\times A(1-\\alpha)K^\\alpha L^{-\\alpha} = \\frac{A}{\\alpha}K^\\alpha L^{-\\alpha}$$\n\n**Step 4 \u2014 compute the Jacobian determinant:**\n$$J = \\frac{\\partial Q_1}{\\partial K}\\cdot\\frac{\\partial Q_2}{\\partial L} - \\frac{\\partial Q_1}{\\partial L}\\cdot\\frac{\\partial Q_2}{\\partial K}$$\n\n**Step 5 \u2014 substitute and simplify the first product term:**\n$$\\frac{\\partial Q_1}{\\partial K}\\cdot\\frac{\\partial Q_2}{\\partial L} = A\\alpha K^{\\alpha-1}L^{1-\\alpha}\\times\\frac{A}{\\alpha}K^\\alpha L^{-\\alpha} = A^2K^{(\\alpha-1)+\\alpha}L^{(1-\\alpha)+(-\\alpha)} = A^2K^{2\\alpha-1}L^{1-2\\alpha}$$\n(The $\\alpha$ in the numerator and denominator cancel.)\n\n**Step 6 \u2014 simplify the second product term:**\n$$\\frac{\\partial Q_1}{\\partial L}\\cdot\\frac{\\partial Q_2}{\\partial K} = A(1-\\alpha)K^\\alpha L^{-\\alpha}\\times\\frac{A}{1-\\alpha}K^{\\alpha-1}L^{1-\\alpha} = A^2K^{\\alpha+(\\alpha-1)}L^{-\\alpha+(1-\\alpha)} = A^2K^{2\\alpha-1}L^{1-2\\alpha}$$\n(The $(1-\\alpha)$ terms cancel this time.)\n\n**Step 7 \u2014 subtract.** Both terms turned out to be **identical**:\n$$J = A^2K^{2\\alpha-1}L^{1-2\\alpha} - A^2K^{2\\alpha-1}L^{1-2\\alpha} = 0$$\n\n**Final answer**: since $J=0$ identically, **$Q_1$ and $Q_2$ are indeed functionally dependent** \u2014 confirming the production manager's assertion that the variable inputs of the two plants are \"not invertible.\" This makes sense given our observation in Step 1: since $Q_2$ is nothing more than a constant multiple of $Q_1$, the two functions carry no independent information from one another."}, {"cat": "Matrices & Determinants", "q": "What type of matrix has each of the following features? (a) $AA'=A'A=I$ (b) $AA^{-1}=A^{-1}A=I$ (c) $A\\cdot A=A$ (d) $A=-A'$.", "hint": "Match each property to a definition covered earlier: transpose-equals-inverse; the defining property of an inverse itself; self-multiplication reproducing the matrix; transpose-equals-negative.", "ans": "Each of these four properties defines a distinct, named type of matrix:\n\n**(a) $AA'=A'A=I$.** This says that multiplying the matrix by its own transpose (in either order) gives the identity matrix \u2014 this is exactly the defining property of an **orthogonal matrix**. Geometrically, orthogonal matrices represent rotations or reflections that preserve length and angle.\n\n**(b) $AA^{-1}=A^{-1}A=I$.** This is simply the defining property of a matrix **inverse** itself \u2014 $A^{-1}$ is, by definition, whatever matrix satisfies this relationship with $A$. Every **invertible (non-singular) matrix** satisfies this with its own inverse.\n\n**(c) $A\\cdot A=A$.** This says that multiplying the matrix by itself reproduces the exact same matrix \u2014 this is the defining property of an **idempotent matrix** (from the Latin roots meaning \"same power,\" since $A^2=A$, and by extension $A^n=A$ for any positive integer $n$).\n\n**(d) $A=-A'$.** This says the matrix equals the negative of its own transpose \u2014 this is the defining property of a **skew-symmetric matrix**. (A direct consequence: every diagonal entry of a skew-symmetric matrix must be zero, since $a_{ii}=-a_{ii}$ is only possible when $a_{ii}=0$.)"}, {"cat": "Matrices & Determinants", "q": "Define the trace (or spur) of a matrix.", "hint": "Think about which entries of the matrix are involved, and how they're combined.", "ans": "**Definition.** The **trace** (also called the **spur**) of a square matrix $A$, written $\\text{tr}(A)$, is the **sum of the entries lying on the main diagonal** \u2014 the entries running from the top-left corner to the bottom-right corner of the matrix. All the off-diagonal entries are completely ignored.\n\n**Example**: for $A=\\begin{bmatrix}3&5&2\\\\7&9&1\\\\4&6&8\\end{bmatrix}$, the diagonal entries are $3,9,8$, so $\\text{tr}(A)=3+9+8=20$ (the off-diagonal entries $5,2,7,1,4,6$ play no role at all).\n\n**A couple of useful properties worth remembering**: the trace is only defined for **square** matrices (since a rectangular matrix doesn't have a well-defined single \"main diagonal\" running corner to corner in the same sense). The trace also behaves linearly \u2014 $\\text{tr}(A+B)=\\text{tr}(A)+\\text{tr}(B)$ for any two square matrices of the same size, a property that can be proven directly from the definition by summing diagonal entries term by term."}, {"cat": "Optimization: Extrema & Lagrangian", "q": "What is the primary goal of any optimization problem?", "hint": "Think about what 'optimal' means \u2014 the best possible outcome given the circumstances.", "ans": "**Definition.** The primary goal of any optimization problem is to find the value (or combination of values) of the choice variable(s) that makes an objective function as **large as possible (a maximum)** or as **small as possible (a minimum)** \u2014 in other words, to find the *best* achievable outcome according to some specific criterion, whether that means maximizing profit or utility, or minimizing cost or loss.\n\nIn **unconstrained** optimization, this best outcome is sought with no restrictions on the choice variables. In **constrained** optimization, the best outcome must additionally satisfy one or more side conditions (constraints) that limit which combinations of the choice variables are actually feasible \u2014 e.g. maximizing output subject to a fixed budget, or minimizing cost subject to a required production target.\n\n**Final answer**: the primary goal of any optimization problem is to find the maximum or minimum value of an objective function \u2014 the best possible outcome, given whatever conditions or constraints apply."}, {"cat": "Optimization: Extrema & Lagrangian", "q": "What are the critical elements of a Lagrangean function?", "hint": "Think about what pieces you assemble when you write $\\mathcal{L}=\\ldots+\\lambda(\\ldots)$.", "ans": "A **Lagrangean function** is built by combining three essential elements:\n\n**1. The objective function.** This is the function you actually want to maximize or minimize \u2014 e.g. a utility function $U(x,y)$, a production function $Q(L,K)$, or a profit function. This piece appears first in the Lagrangean, unchanged.\n\n**2. The constraint (or constraints).** This is the side condition (or conditions) that restricts the choice variables \u2014 e.g. a budget constraint like $P_xX+P_yY=M$. Each constraint must first be rearranged so that everything is moved to one side, equal to zero (e.g. $M-P_xX-P_yY=0$), before it can be incorporated into the Lagrangean.\n\n**3. The Lagrange multiplier(s), $\\lambda$.** This is a new variable introduced for each constraint, multiplying the rearranged (equals-zero) form of that constraint. The multiplier acts as a bridge that lets the constrained problem be solved using ordinary calculus techniques (setting partial derivatives to zero), and afterward carries its own economic meaning as the **shadow price** of the constraint \u2014 how much the optimal value of the objective would change if the constraint were relaxed by one unit.\n\n**Putting the three elements together**, the general form is:\n$$\\mathcal{L} = (\\text{objective function}) + \\lambda\\times(\\text{constraint, rearranged to equal zero})$$\nwith one additional $+\\lambda_i(\\ldots)$ term added for each additional constraint, if there is more than one."}, {"cat": "Integration", "q": "Find $\\int \\dfrac{x+1}{x^2+5x+6}\\,dx$.", "hint": "Factor the denominator, then use partial fractions.", "ans": "**Step 1 \u2014 factor the denominator.** We need two numbers that multiply to $6$ and add to $5$: those are $2$ and $3$. So $x^2+5x+6=(x+2)(x+3)$.\n\n**Step 2 \u2014 set up the partial fraction decomposition:**\n$$\\frac{x+1}{(x+2)(x+3)} = \\frac{A}{x+2}+\\frac{B}{x+3}$$\n\n**Step 3 \u2014 clear denominators:**\n$$x+1 = A(x+3)+B(x+2)$$\n\n**Step 4 \u2014 use the cover-up method.**\n\nLet $x=-2$ (makes the $B(x+2)$ term vanish): $-2+1=A(-2+3) \\implies -1=A(1) \\implies A=-1$.\n\nLet $x=-3$ (makes the $A(x+3)$ term vanish): $-3+1=B(-3+2) \\implies -2=B(-1) \\implies B=2$.\n\n**Step 5 \u2014 write out and integrate:**\n$$\\int\\left(\\frac{-1}{x+2}+\\frac{2}{x+3}\\right)dx = -\\ln|x+2|+2\\ln|x+3|+C$$\n\n**Final answer**: $-\\ln|x+2|+2\\ln|x+3|+C$."}, {"cat": "Integration", "q": "Evaluate $\\int_a^b (2x+3)\\,dx$, leaving your answer in terms of the general limits $a$ and $b$.", "hint": "Find the antiderivative first, then apply the limits \u2014 the answer will be an expression in $a$ and $b$ rather than a single number.", "ans": "**Step 1 \u2014 find the antiderivative**, using the power rule term by term:\n$$\\int(2x+3)\\,dx = x^2+3x$$\n\n**Step 2 \u2014 apply the Fundamental Theorem of Calculus**, evaluating at the upper limit $b$ and subtracting the value at the lower limit $a$:\n$$\\int_a^b(2x+3)\\,dx = \\Big[x^2+3x\\Big]_a^b = (b^2+3b)-(a^2+3a)$$\n\n**Step 3 \u2014 simplify by grouping like terms** (the squared terms together, the linear terms together):\n$$= (b^2-a^2)+3(b-a)$$\n\n**Step 4 \u2014 factor for a tidier final form.** Recall $b^2-a^2=(b-a)(b+a)$ (difference of squares), so both terms now share the common factor $(b-a)$:\n$$= (b-a)(b+a)+3(b-a) = (b-a)(a+b+3)$$\n\n**Final answer**: $\\displaystyle\\int_a^b(2x+3)\\,dx = (b-a)(a+b+3)$ \u2014 or equivalently, left unfactored, $b^2-a^2+3b-3a$."}, {"cat": "Integration", "q": "Find $\\int \\dfrac{-\\tan x}{\\log(\\cos x)}\\,dx$.", "hint": "Substitute $u=\\log(\\cos x)$ \u2014 check what its derivative is first.", "ans": "**Step 1 \u2014 check the derivative of the denominator.** Let $u=\\log(\\cos x)$ (using $\\log$ to mean the natural logarithm, $\\ln$). By the chain rule, $\\dfrac{du}{dx} = \\dfrac{1}{\\cos x}\\times(-\\sin x) = \\dfrac{-\\sin x}{\\cos x} = -\\tan x$.\n\n**Step 2 \u2014 notice this matches the numerator exactly!** The numerator of the integral is $-\\tan x$, which is *precisely* $\\dfrac{du}{dx}$. This is the \"derivative of denominator sitting in the numerator\" pattern, which always integrates to a natural log of the denominator.\n\n**Step 3 \u2014 substitute.** With $u=\\log(\\cos x)$ and $du=-\\tan x\\,dx$:\n$$\\int\\frac{-\\tan x}{\\log(\\cos x)}dx = \\int\\frac{du}{u}$$\n\n**Step 4 \u2014 integrate:**\n$$= \\ln|u|+C$$\n\n**Step 5 \u2014 substitute back:**\n$$= \\ln\\big|\\log(\\cos x)\\big|+C$$\n\n**Final answer**: $\\ln\\big|\\log(\\cos x)\\big|+C$ \u2014 a \"log of a log,\" which arises naturally here because the original denominator was itself already a logarithm."}, {"cat": "Integration", "q": "For a function $f(x)$, what can be said about $\\displaystyle\\int_{-a}^{a}f(x)\\,dx$ when $f$ is even, and when $f$ is odd?", "hint": "Think about the symmetry of the region: integrating from $-a$ to $a$ covers a mirror-image interval around zero \u2014 consider how the even/odd symmetry of $f$ interacts with that.", "ans": "This is a general, very useful **property** of definite integrals over a symmetric interval $[-a,a]$, which depends entirely on whether the function being integrated is even or odd.\n\n**Case 1: $f(x)$ is even** (recall $f(-x)=f(x)$, meaning the graph is a mirror image across the $y$-axis). Since the graph looks identical on the left half $[-a,0]$ and the right half $[0,a]$ of the interval, the area contributed by each half is the same. So instead of computing the integral over the whole symmetric range, you can compute it over just half the range and double it:\n$$\\int_{-a}^{a}f(x)\\,dx = 2\\int_0^a f(x)\\,dx \\qquad (\\text{if } f \\text{ is even})$$\n\n**Case 2: $f(x)$ is odd** (recall $f(-x)=-f(x)$, meaning the graph has 180\u00b0 rotational symmetry about the origin). Here, whatever *positive* area exists above the $x$-axis on one side of zero is exactly mirrored by an equal *negative* area (below the axis) on the other side \u2014 since the function's sign flips symmetrically as well as its shape. These two contributions exactly cancel out:\n$$\\int_{-a}^{a}f(x)\\,dx = 0 \\qquad (\\text{if } f \\text{ is odd})$$\n\n**Final answer**: for an **even** function, $\\int_{-a}^{a}f(x)\\,dx = 2\\int_0^af(x)\\,dx$ (double the half-interval integral); for an **odd** function, $\\int_{-a}^{a}f(x)\\,dx = 0$ (the symmetric positive and negative areas cancel completely)."}, {"cat": "Integration", "q": "Find $\\int(4x^6-2x^2+7x-2)\\,dx$.", "hint": "Apply the power rule to each term separately.", "ans": "**Apply the power rule**, $\\int x^n\\,dx=\\dfrac{x^{n+1}}{n+1}+C$, to each term of the polynomial in turn, carrying through each constant coefficient unchanged.\n\nFor $4x^6$: increase the power to 7, divide by 7: $\\dfrac{4x^7}{7}$.\n\nFor $-2x^2$: increase the power to 3, divide by 3: $\\dfrac{-2x^3}{3}$.\n\nFor $7x$: increase the power to 2, divide by 2: $\\dfrac{7x^2}{2}$.\n\nFor the constant $-2$: this is $-2x^0$, and integrating a constant simply gives that constant times $x$: $-2x$.\n\n**Final answer**:\n$$\\int(4x^6-2x^2+7x-2)\\,dx = \\frac{4x^7}{7}-\\frac{2x^3}{3}+\\frac{7x^2}{2}-2x+C$$"}, {"cat": "Integration", "q": "Find $\\int(6e^{3x}-8e^{-2x})\\,dx$.", "hint": "Apply the exponential integration rule to each term: $\\int e^{kx}dx=\\frac1k e^{kx}$.", "ans": "**Step 1 \u2014 integrate each exponential term separately**, using $\\int e^{kx}dx=\\dfrac1k e^{kx}+C$ (divide by the coefficient of $x$ in the exponent).\n\nFor $6e^{3x}$: here $k=3$, so $\\int 6e^{3x}dx = 6\\times\\dfrac13e^{3x} = 2e^{3x}$.\n\nFor $-8e^{-2x}$: here $k=-2$, so $\\int(-8e^{-2x})dx = -8\\times\\dfrac{1}{-2}e^{-2x} = 4e^{-2x}$ (dividing by the negative $k$ flips the sign, turning $-8$ into $+4$).\n\n**Final answer**:\n$$\\int(6e^{3x}-8e^{-2x})\\,dx = 2e^{3x}+4e^{-2x}+C$$"}, {"cat": "Integration", "q": "Find $\\int \\dfrac{2x^3+3x}{x^4+3x^2}\\,dx$.", "hint": "Check whether the numerator is a multiple of the derivative of the denominator.", "ans": "**Step 1 \u2014 check the derivative of the denominator.** The denominator is $x^4+3x^2$. Its derivative is $4x^3+6x$.\n\n**Step 2 \u2014 compare this to the numerator.** The numerator is $2x^3+3x$. Notice that $4x^3+6x = 2(2x^3+3x)$ \u2014 so the denominator's derivative is exactly **twice** the numerator. This means the numerator is *half* of the denominator's derivative, which still fits the \"derivative of denominator over denominator\" pattern, just with an extra constant factor to track.\n\n**Step 3 \u2014 substitute.** Let $u=x^4+3x^2$, so $du=(4x^3+6x)dx = 2(2x^3+3x)dx$, which means $(2x^3+3x)dx = \\dfrac12du$.\n\n**Step 4 \u2014 rewrite the integral in terms of $u$:**\n$$\\int\\frac{2x^3+3x}{x^4+3x^2}dx = \\int\\frac{\\frac12du}{u} = \\frac12\\int\\frac{du}{u}$$\n\n**Step 5 \u2014 integrate:**\n$$= \\frac12\\ln|u|+C$$\n\n**Step 6 \u2014 substitute back:**\n$$= \\frac12\\ln|x^4+3x^2|+C$$\n\n**Final answer**: $\\dfrac12\\ln|x^4+3x^2|+C$. (This can optionally be simplified further: since $x^4+3x^2=x^2(x^2+3)$, using log properties gives $\\dfrac12\\ln|x^4+3x^2| = \\ln|x|+\\dfrac12\\ln(x^2+3)+C$ \u2014 an equivalent, alternative form of the same answer.)"}, {"cat": "Integration", "q": "State the following basic rules of integration: (a) the power rule, (b) whether a general 'product rule' exists for integration, (c) the exponential rule.", "hint": "Recall the power rule and exponential rule are direct reverses of their differentiation counterparts \u2014 but check carefully whether integration has a direct product-rule analogue the way differentiation does.", "ans": "**(a) The power rule.** For integrating a power of $x$ (excluding the special case $n=-1$):\n$$\\int x^n\\,dx = \\frac{x^{n+1}}{n+1}+C \\qquad (n\\neq-1)$$\nThis is the direct reverse of the differentiation power rule: increase the exponent by 1, then divide by the new exponent.\n\n**(b) Is there a 'product rule' for integration?** Unlike differentiation \u2014 which has a clean product rule, $\\frac{d}{dx}(uv)=uv'+vu'$ \u2014 integration does **not** have an equally simple direct product rule. You cannot integrate a product of two functions just by integrating each one separately and multiplying (or adding) the results; that approach is mathematically invalid. Instead, the technique that plays an *analogous* role for integrating products is **integration by parts**:\n$$\\int u\\,dv = uv - \\int v\\,du$$\nThis formula is actually derived by *rearranging* the product rule for differentiation, which is why it's the natural counterpart \u2014 but it requires more work than a simple direct substitution, since it still leaves another integral, $\\int v\\,du$, to be solved.\n\n**(c) The exponential rule.** For integrating $e$ raised to a linear expression:\n$$\\int e^{kx}\\,dx = \\frac{1}{k}e^{kx}+C \\qquad (k\\neq0)$$\nThis comes directly from reversing the chain rule: since differentiating $\\frac1ke^{kx}$ brings down a factor of $k$ that cancels the $\\frac1k$, you recover exactly $e^{kx}$, confirming the antiderivative."}, {"cat": "Functions & Basic Concepts", "q": "With relevant examples, explain the two primary taxonomies (classes) of functions.", "hint": "Think about which functions can be built from ordinary $+,-,\\times,\\div$ and roots, and which cannot.", "ans": "The two broadest, most fundamental classes into which all functions can be sorted are **algebraic** and **transcendental** functions.\n\n**Algebraic functions.** A function is algebraic if it can be built using only a finite number of additions, subtractions, multiplications, divisions, and roots applied to $x$. This class includes **polynomial functions** (e.g. $y=3x^2+2x-1$), **rational functions** (a ratio of two polynomials, e.g. $y=\\dfrac{x+1}{x-2}$), and functions involving roots (e.g. $y=\\sqrt{x}$).\n\n**Transcendental functions.** A function is transcendental if it *cannot* be constructed this way \u2014 it \"transcends\" ordinary algebra. This class includes **exponential functions** ($y=e^x$), **logarithmic functions** ($y=\\ln x$), and **trigonometric functions** ($y=\\sin x$).\n\n**Why this split matters**: nearly every other classification you'll encounter (linear vs non-linear, increasing vs decreasing, even vs odd, and so on) describes some further property *within* one of these two broad families \u2014 algebraic and transcendental together cover essentially every function used in this course."}, {"cat": "Functions & Basic Concepts", "q": "A student's total cost of studying at OAU per session is made up of a fixed annual tuition of \u20a628,500 and living expenses of \u20a650,000 per semester (2 semesters per session). Express the total session cost, $Y_0$, as a function, and evaluate it.", "hint": "Total cost = fixed tuition + (cost per semester \u00d7 number of semesters).", "ans": "**Step 1 \u2014 identify the fixed and variable components.** The tuition, \u20a628,500, is paid once per session regardless of anything else \u2014 this is the **fixed** (intercept) component. The living expenses, \u20a650,000, are incurred *per semester*, and there are 2 semesters in a session \u2014 this is the **variable** component, scaling with the number of semesters, $n$.\n\n**Step 2 \u2014 write the general linear function.** Letting $n$ represent the number of semesters:\n$$Y_0 = 28{,}500 + 50{,}000n$$\nThis is a straightforward linear function, with intercept $28{,}500$ and slope $50{,}000$ (the \"slope\" here represents the extra cost incurred for each additional semester).\n\n**Step 3 \u2014 evaluate for a full session ($n=2$):**\n$$Y_0 = 28{,}500 + 50{,}000(2) = 28{,}500+100{,}000 = 128{,}500$$\n\n**Final answer**: $Y_0=28{,}500+50{,}000n$, giving a total session cost of **\u20a6128,500** when $n=2$. This is a nice concrete real-world illustration of how a simple linear function models a genuine budgeting problem \u2014 the \"slope\" (\u20a650,000) tells you exactly how much an additional semester would add to the total."}, {"cat": "Functions & Basic Concepts", "q": "Given $y=2t^2+16t-4$, where $t=X^2+4$, find $y$ as an explicit function of $X$.", "hint": "Substitute the expression for $t$ into $y$, then expand and simplify.", "ans": "**The idea**: this is a composite function \u2014 $y$ depends on $t$, and $t$ in turn depends on $X$. To express $y$ purely in terms of $X$, substitute the formula for $t$ directly into the formula for $y$.\n\n**Step 1 \u2014 substitute $t=X^2+4$ into $y=2t^2+16t-4$:**\n$$y = 2(X^2+4)^2+16(X^2+4)-4$$\n\n**Step 2 \u2014 expand $(X^2+4)^2$** using the binomial expansion $(a+b)^2=a^2+2ab+b^2$ with $a=X^2,b=4$:\n$$(X^2+4)^2 = X^4+8X^2+16$$\n\n**Step 3 \u2014 substitute this expansion back in and distribute the $2$:**\n$$y = 2(X^4+8X^2+16)+16(X^2+4)-4 = 2X^4+16X^2+32+16X^2+64-4$$\n\n**Step 4 \u2014 collect like terms** (the $X^4$ term, the $X^2$ terms, and the constants separately):\n$$y = 2X^4 + (16X^2+16X^2) + (32+64-4) = 2X^4+32X^2+92$$\n\n**Final answer**: $y = 2X^4+32X^2+92$."}, {"cat": "Functions & Basic Concepts", "q": "The classes of increasing and decreasing functions, taken together, are otherwise called what?", "hint": "Recall the term for a function that moves consistently in one direction (either always up, or always down) across its domain.", "ans": "**Recall the definitions**: an **increasing function** always rises as $x$ increases; a **decreasing function** always falls as $x$ increases. Both share the common feature that they move consistently in *one* direction, never reversing course.\n\n**Final answer**: increasing and decreasing functions, taken together, are called **monotonic functions**. A function is monotonic if it is either increasing throughout its domain, or decreasing throughout its domain (but not a mixture of both) \u2014 it never \"turns around.\" "}, {"cat": "Functions & Basic Concepts", "q": "Which of the following is an even function? (i) $f(x)=\\dfrac{1}{x}$ (ii) $f(x)=4$ (iii) $f(x)=x^2-2x$.", "hint": "Test each by checking whether $f(-x)=f(x)$.", "ans": "**Test each function against the even-function condition, $f(-x)=f(x)$:**\n\n**(i) $f(x)=\\dfrac1x$.** $f(-x) = \\dfrac{1}{-x} = -\\dfrac1x = -f(x)$. Since $f(-x)=-f(x)$, this function is **odd**, not even.\n\n**(ii) $f(x)=4$.** This is a constant function \u2014 it doesn't actually depend on $x$ at all. $f(-x)=4=f(x)$ trivially, since substituting *anything* for $x$ still gives $4$. This function is **even**.\n\n**(iii) $f(x)=x^2-2x$.** $f(-x)=(-x)^2-2(-x)=x^2+2x$. Compare to $f(x)=x^2-2x$: these are **not equal** ($x^2+2x \\neq x^2-2x$ unless $x=0$), and $f(-x)$ is also not equal to $-f(x)=-x^2+2x$. So this function is **neither** even nor odd.\n\n**Final answer**: only **(ii) $f(x)=4$** is an even function. (This illustrates a useful general fact: **every constant function is automatically even**, since a constant value never changes no matter what you substitute for $x$.)"}, {"cat": "Functions & Basic Concepts", "q": "What is a multivariate function?", "hint": "Think about how many independent variables the function depends on.", "ans": "**Definition.** A **multivariate function** is a function that depends on **more than one** independent variable \u2014 as opposed to an ordinary (univariate) function like $y=f(x)$, which depends on just one. A multivariate function is written $z=f(x,y)$ for two variables, or more generally $y=f(x_1,x_2,\\ldots,x_n)$ for $n$ variables.\n\n**Example**: a Cobb-Douglas production function $Q=f(L,K)=AL^\\alpha K^\\beta$ is multivariate, since output $Q$ depends on *both* labour $L$ and capital $K$ simultaneously \u2014 you cannot fully describe $Q$ using just one of the two variables alone. Multivariate functions are exactly what require the tools of **partial differentiation** (covered elsewhere in this course), since an ordinary derivative $\\dfrac{dy}{dx}$ doesn't make sense when there's more than one input variable to consider."}, {"cat": "Functions & Basic Concepts", "q": "What is a sinusoidal function?", "hint": "Think about the family of functions built from sine and cosine.", "ans": "**Definition.** A **sinusoidal function** is a function based on the sine (or cosine) wave pattern \u2014 a smooth, repeating, periodic oscillation. The general form is:\n$$y = A\\sin(bx+c)+d \\qquad \\text{or equivalently} \\qquad y=A\\cos(bx+c)+d$$\nwhere $A$ controls the **amplitude** (how tall the wave's peaks and troughs are), $b$ controls the **period** (how quickly the wave repeats), $c$ shifts the wave left or right (**phase shift**), and $d$ shifts it up or down (**vertical shift**).\n\n**Key features**: sinusoidal functions are a specific sub-type of the broader trigonometric function family, characterized by their smooth, wave-like, perfectly periodic repetition \u2014 they oscillate back and forth between a maximum and minimum value forever, never settling down or growing without bound (unlike exponential functions). Example: $y=3\\sin(2x)$ is a sinusoidal function with amplitude 3, oscillating between $-3$ and $3$."}, {"cat": "Functions & Basic Concepts", "q": "Despite the increasing role of mathematics in the social sciences, mention any three shortcomings (limitations) of using mathematics in this context.", "hint": "Think about what gets lost or oversimplified when human behaviour is forced into precise equations.", "ans": "While mathematics offers precision and rigor (as covered in the earlier question on why mathematics is useful), it also carries real limitations when applied to the social sciences:\n\n1. **Oversimplification of complex human behaviour.** Mathematical models typically require simplifying assumptions (e.g. \"all consumers behave rationally\") that may not accurately reflect real-world psychology, culture, or social dynamics \u2014 the elegance of an equation can obscure the messiness of actual human decision-making.\n\n2. **Difficulty capturing qualitative factors.** Many important social phenomena \u2014 trust, tradition, political ideology, social norms \u2014 are inherently hard to quantify numerically, meaning purely mathematical approaches may exclude or poorly represent factors that are nonetheless economically or socially significant.\n\n3. **False sense of precision or objectivity.** Presenting a social phenomenon as a precise numerical formula can create an illusion of scientific certainty that isn't actually justified, especially when the underlying data or assumptions are themselves uncertain, incomplete, or contested \u2014 this can mislead policy decisions if the model's limitations aren't clearly communicated.\n\n(A further limitation sometimes cited: mathematical models can be difficult for non-specialist audiences \u2014 such as policymakers or the general public \u2014 to interpret or scrutinize, potentially reducing transparency and accountability in decision-making.)"}, {"cat": "Differentiation", "q": "Find $\\dfrac{dy}{dx}$ for: (i) $y=x^2e^{4x}$ (ii) $y=(2x+5)^4$ (iii) $y=\\log(x^3)$.", "hint": "(i) Product rule. (ii) Chain rule. (iii) Simplify the log first using log properties.", "ans": "**(i) $y=x^2e^{4x}$ \u2014 product rule.** Let $u=x^2$ ($u'=2x$) and $v=e^{4x}$ ($v'=4e^{4x}$, by the chain rule, since the derivative of the exponent $4x$ is $4$). Product rule, $y'=uv'+vu'$:\n$$y' = x^2(4e^{4x})+e^{4x}(2x) = 4x^2e^{4x}+2xe^{4x} = 2xe^{4x}(2x+1)$$\n\n**(ii) $y=(2x+5)^4$ \u2014 chain rule.** Let $u=2x+5$ ($u'=2$). Using the power/chain rule (bring down the exponent 4, reduce the power by 1, multiply by $u'$):\n$$y' = 4(2x+5)^3\\times2 = 8(2x+5)^3$$\n\n**(iii) $y=\\log(x^3)$ \u2014 simplify first.** Recall the log property $\\log(x^n)=n\\log x$, so $y=3\\log x$. Now differentiate directly using $\\dfrac{d}{dx}(\\log x)=\\dfrac1x$:\n$$y' = 3\\times\\frac1x = \\frac3x$$\n(This matches what you'd get applying the chain rule directly without simplifying: $y'=\\dfrac{3x^2}{x^3}=\\dfrac3x$ \u2014 the same answer either way, but simplifying the log first makes the work much quicker.)"}, {"cat": "Differentiation", "q": "Find $\\dfrac{dy}{dx}$ for: (i) $y=\\log(x^2+3x)$ (ii) $y=e^{\\sin x}$ (iii) $y=(x^2-2x)e^x$.", "hint": "(i) Chain rule for log. (ii) Chain rule for exponential. (iii) Product rule.", "ans": "**(i) $y=\\log(x^2+3x)$.** Using $\\dfrac{d}{dx}\\log(u)=\\dfrac{u'}{u}$, with $u=x^2+3x$ so $u'=2x+3$:\n$$y' = \\frac{2x+3}{x^2+3x}$$\n\n**(ii) $y=e^{\\sin x}$.** Using the chain rule for $e^u$, $y'=e^u\\cdot u'$, with $u=\\sin x$ so $u'=\\cos x$:\n$$y' = \\cos x\\cdot e^{\\sin x}$$\n\n**(iii) $y=(x^2-2x)e^x$ \u2014 product rule.** Let $u=x^2-2x$ ($u'=2x-2$) and $v=e^x$ ($v'=e^x$). Product rule, $y'=uv'+vu'$:\n$$y' = (x^2-2x)e^x + e^x(2x-2) = e^x\\left[(x^2-2x)+(2x-2)\\right] = e^x(x^2-2)$$\n(Notice the $-2x$ and $+2x$ terms cancel neatly inside the brackets, leaving a clean simplified answer.)"}, {"cat": "Differentiation", "q": "If $y=\\log(e^x+e^{-x})$, find $\\dfrac{dy}{dx}$.", "hint": "Use $\\frac{d}{dx}\\log(u)=\\frac{u'}{u}$ with $u=e^x+e^{-x}$.", "ans": "**Step 1 \u2014 identify the inner function**: $u=e^x+e^{-x}$.\n\n**Step 2 \u2014 differentiate $u$.** Recall $\\dfrac{d}{dx}(e^x)=e^x$ and $\\dfrac{d}{dx}(e^{-x})=-e^{-x}$ (chain rule, since the derivative of the exponent $-x$ is $-1$):\n$$u' = e^x-e^{-x}$$\n\n**Step 3 \u2014 apply the log-derivative rule**, $\\dfrac{u'}{u}$:\n$$\\frac{dy}{dx} = \\frac{e^x-e^{-x}}{e^x+e^{-x}}$$\n\n**Final answer**: $\\dfrac{dy}{dx} = \\dfrac{e^x-e^{-x}}{e^x+e^{-x}}$. (Notice this has the opposite sign pattern from the earlier problem $y=\\log(e^x-e^{-x})$, whose derivative was $\\dfrac{e^x+e^{-x}}{e^x-e^{-x}}$ \u2014 swapping which combination sits on top and which sits on the bottom. This expression is also recognisable as the hyperbolic tangent function, $\\tanh(x)$.)"}, {"cat": "Differentiation", "q": "Find the derivative of $y=\\log(x^4-2x+7)$.", "hint": "Use $\\frac{d}{dx}\\log(u)=\\frac{u'}{u}$.", "ans": "**Step 1 \u2014 identify the inner function**: $u=x^4-2x+7$.\n\n**Step 2 \u2014 differentiate $u$** using the power rule term by term:\n$$u' = 4x^3-2$$\n\n**Step 3 \u2014 apply the log-derivative rule**, $\\dfrac{u'}{u}$:\n$$\\frac{dy}{dx} = \\frac{4x^3-2}{x^4-2x+7}$$\n\n**Final answer**: $\\dfrac{dy}{dx} = \\dfrac{4x^3-2}{x^4-2x+7}$."}, {"cat": "Differentiation", "q": "If $y=5x^2-2x+4$, find $\\dfrac{d^2y}{dx^2}$.", "hint": "Differentiate twice using the power rule.", "ans": "**Step 1 \u2014 find the first derivative**, using the power rule term by term:\n$$y' = 10x-2$$\n\n**Step 2 \u2014 find the second derivative** by differentiating $y'$ again:\n$$y'' = 10$$\n\n**Final answer**: $\\dfrac{d^2y}{dx^2}=10$. (Since the original function is a quadratic, its second derivative is always a constant \u2014 the coefficient of $x^2$ doubled, $2\\times5=10$ \u2014 reflecting the fact that a parabola has constant curvature everywhere.)"}, {"cat": "Differentiation", "q": "Find the derivatives with respect to the relevant variable: (i) $y=x^3+4x^4+3x^2$ (ii) $z=e^{2x}-e^{-3x}$ (iii) $y=e^{\\cos x-\\sin x}$ (iv) $v=\\log(at^2-bt+c)$.", "hint": "(i) Power rule. (ii)-(iii) Chain rule for exponentials. (iv) Chain rule for log.", "ans": "**(i) $y=x^3+4x^4+3x^2$.** Apply the power rule term by term:\n$$y' = 3x^2+16x^3+6x$$\n\n**(ii) $z=e^{2x}-e^{-3x}$.** Using the chain rule for each exponential term (derivative of $e^{kx}$ is $ke^{kx}$):\n$$z' = 2e^{2x}-(-3e^{-3x}) = 2e^{2x}+3e^{-3x}$$\n\n**(iii) $y=e^{\\cos x-\\sin x}$.** Using the chain rule, $y'=e^u\\cdot u'$, with $u=\\cos x-\\sin x$ so $u'=-\\sin x-\\cos x$:\n$$y' = e^{\\cos x-\\sin x}\\times(-\\sin x-\\cos x) = -e^{\\cos x-\\sin x}(\\sin x+\\cos x)$$\n(Notice this is different from the earlier problem $y=e^{\\sin x-\\cos x}$, which had *positive* $\\sin x+\\cos x$ in the derivative \u2014 here the sign flips because the roles of $\\sin x$ and $\\cos x$ inside the exponent have been swapped.)\n\n**(iv) $v=\\log(at^2-bt+c)$.** Using $\\dfrac{d}{dt}\\log(u)=\\dfrac{u'}{u}$, with $u=at^2-bt+c$ so $u'=2at-b$ (differentiating with respect to $t$, treating $a,b,c$ as constants):\n$$\\frac{dv}{dt} = \\frac{2at-b}{at^2-bt+c}$$"}, {"cat": "Differentiation", "q": "If $y=e^x+e^{-x}$, show that $y=y''$. Is it also true that $y'=y''$?", "hint": "Find $y'$ and $y''$ separately, then compare both pairs carefully \u2014 don't assume the second claim follows automatically from the first.", "ans": "**Step 1 \u2014 find the first derivative.** Recall $\\dfrac{d}{dx}(e^x)=e^x$ and $\\dfrac{d}{dx}(e^{-x})=-e^{-x}$:\n$$y' = e^x-e^{-x}$$\n\n**Step 2 \u2014 find the second derivative**, differentiating $y'$ again:\n$$y'' = e^x-(-e^{-x}) = e^x+e^{-x}$$\n\n**Step 3 \u2014 check whether $y=y''$.** We were given $y=e^x+e^{-x}$, and we've just found $y''=e^x+e^{-x}$ \u2014 these are identical. **So $y=y''$ is confirmed true.**\n\n**Step 4 \u2014 now carefully check the second claim, $y'=y''$, rather than assuming it follows.** We have $y'=e^x-e^{-x}$ and $y''=e^x+e^{-x}$. These are **not** the same expression \u2014 they differ in the sign of the $e^{-x}$ term. For $y'$ to equal $y''$, we would need $e^x-e^{-x}=e^x+e^{-x}$, which simplifies to $-e^{-x}=e^{-x}$, i.e. $2e^{-x}=0$ \u2014 but $e^{-x}$ is never zero for any real $x$ (it only approaches zero as $x\\to\\infty$, never actually reaching it). **So $y'=y''$ is generally FALSE.**\n\n**Final answer**: $y=y''$ is true, but $y'=y''$ is **not** true in general \u2014 a useful reminder not to assume a second similar-looking claim follows just because a related one happened to check out; each equation needs to be verified independently."}, {"cat": "Differentiation", "q": "If $y=e^{ax}$ (where $a$ is a constant), find $\\dfrac{d^2y}{dx^2}$.", "hint": "Apply the exponential chain rule twice \u2014 each differentiation brings down another factor of $a$.", "ans": "**Recall the rule**: for $y=e^{kx}$, each differentiation brings down one more factor of $k$: $\\dfrac{d}{dx}(e^{kx})=k\\,e^{kx}$.\n\n**Step 1 \u2014 find the first derivative**, with $k=a$:\n$$y' = ae^{ax}$$\n\n**Step 2 \u2014 find the second derivative**, differentiating $ae^{ax}$ again (another factor of $a$ comes down):\n$$y'' = a\\times a\\,e^{ax} = a^2e^{ax}$$\n\n**Final answer**: $\\dfrac{d^2y}{dx^2} = a^2e^{ax}$. (This is the general, parametrized version of the earlier specific-number problems \u2014 for $y=e^{5x}$, $y''=25e^{5x}=5^2e^{5x}$, and for $y=e^{3x}$, the fourth derivative was $81e^{3x}=3^4e^{3x}$ \u2014 both consistent with this general pattern, $y^{(n)}=a^ne^{ax}$.)"}, {"cat": "Partial Derivatives & Homogeneity", "q": "Verify that $Z=2X^2+7X^2Y+4Y^2-6$ satisfies Young's theorem.", "hint": "Find $Z_{XY}$ and $Z_{YX}$ separately and confirm they match.", "ans": "**Step 1 \u2014 find $Z_X$** (differentiate w.r.t. $X$, treating $Y$ as constant): the derivative of $2X^2$ is $4X$; the derivative of $7X^2Y$ w.r.t. $X$ is $14XY$ (treating $7Y$ as the constant multiplier); the derivative of $4Y^2-6$ w.r.t. $X$ is $0$ (no $X$ present).\n$$Z_X = 4X+14XY$$\n\n**Step 2 \u2014 find $Z_{XY}$** by differentiating $Z_X$ with respect to $Y$: the derivative of $4X$ w.r.t. $Y$ is $0$; the derivative of $14XY$ w.r.t. $Y$ is $14X$ (treating $14X$ as the constant multiplier):\n$$Z_{XY} = 14X$$\n\n**Step 3 \u2014 find $Z_Y$** (differentiate the original function w.r.t. $Y$, treating $X$ as constant): the derivative of $2X^2$ w.r.t. $Y$ is $0$; the derivative of $7X^2Y$ w.r.t. $Y$ is $7X^2$; the derivative of $4Y^2$ is $8Y$; the derivative of $-6$ is $0$.\n$$Z_Y = 7X^2+8Y$$\n\n**Step 4 \u2014 find $Z_{YX}$** by differentiating $Z_Y$ with respect to $X$: the derivative of $7X^2$ w.r.t. $X$ is $14X$; the derivative of $8Y$ w.r.t. $X$ is $0$:\n$$Z_{YX} = 14X$$\n\n**Comparison**: $Z_{XY}=14X=Z_{YX}$. **Young's theorem is confirmed** for this function."}, {"cat": "Partial Derivatives & Homogeneity", "q": "If $Z=X^4-2X^3Y+X^2Y^2$, find $Z_{XX}$, $Z_{XY}$, and $Z_{YY}$.", "hint": "Find the first partials, then differentiate each again.", "ans": "**Step 1 \u2014 find the first-order partial derivatives.**\n\n$Z_X$ (differentiate w.r.t. $X$, treating $Y$ as constant): the derivative of $X^4$ is $4X^3$; of $-2X^3Y$ is $-6X^2Y$; of $X^2Y^2$ is $2XY^2$.\n$$Z_X = 4X^3-6X^2Y+2XY^2$$\n\n$Z_Y$ (differentiate w.r.t. $Y$, treating $X$ as constant): the derivative of $X^4$ is $0$; of $-2X^3Y$ is $-2X^3$; of $X^2Y^2$ is $2X^2Y$.\n$$Z_Y = -2X^3+2X^2Y$$\n\n**Step 2 \u2014 find $Z_{XX}$** by differentiating $Z_X$ again with respect to $X$:\n$$Z_{XX} = 12X^2-12XY+2Y^2$$\n\n**Step 3 \u2014 find $Z_{XY}$** by differentiating $Z_X$ with respect to $Y$ instead:\n$$Z_{XY} = -6X^2+4XY$$\n\n**Step 4 \u2014 find $Z_{YY}$** by differentiating $Z_Y$ again with respect to $Y$:\n$$Z_{YY} = 2X^2$$\n\n**Final answer**: $Z_{XX}=12X^2-12XY+2Y^2$, $Z_{XY}=-6X^2+4XY$, $Z_{YY}=2X^2$. (As a check, differentiating $Z_Y=-2X^3+2X^2Y$ with respect to $X$ gives $Z_{YX}=-6X^2+4XY$, matching $Z_{XY}$ exactly, as Young's theorem guarantees.)"}, {"cat": "Partial Derivatives & Homogeneity", "q": "Using Euler's theorem, determine the degree of homogeneity of $Z=x^2+6xy+y^2$.", "hint": "Check the total power of $x,y$ combined in each term.", "ans": "**Step 1 \u2014 check the total power of each term.** $x^2$ has total power $2$; $6xy$ has total power $1+1=2$; $y^2$ has total power $2$. Every term has the same total power, $2$.\n\n**Step 2 \u2014 confirm via the scaling test.** Replace $x\\to\\lambda x$, $y\\to\\lambda y$:\n$$Z(\\lambda x,\\lambda y) = (\\lambda x)^2+6(\\lambda x)(\\lambda y)+(\\lambda y)^2 = \\lambda^2x^2+6\\lambda^2xy+\\lambda^2y^2 = \\lambda^2(x^2+6xy+y^2) = \\lambda^2Z(x,y)$$\n\n**Step 3 \u2014 confirm via Euler's theorem as a cross-check.** $Z_x=2x+6y$, $Z_y=6x+2y$. Then:\n$$xZ_x+yZ_y = x(2x+6y)+y(6x+2y) = 2x^2+6xy+6xy+2y^2 = 2x^2+12xy+2y^2 = 2(x^2+6xy+y^2) = 2Z$$\n\n**Final answer**: the function is **homogeneous of degree 2**, confirmed by both the direct scaling test and Euler's theorem."}, {"cat": "Partial Derivatives & Homogeneity", "q": "What is a harmonic function?", "hint": "Recall the equation that defines this property, named after a famous French mathematician.", "ans": "**Definition.** A function $f(x,y)$ is called **harmonic** if it satisfies the **Laplace equation**:\n$$\\frac{\\partial^2f}{\\partial x^2}+\\frac{\\partial^2f}{\\partial y^2} = 0 \\qquad\\text{i.e.}\\qquad f_{xx}+f_{yy}=0$$\nIn words: the sum of the function's two \"pure\" second-order partial derivatives (differentiating twice with respect to $x$ alone, and twice with respect to $y$ alone) must equal exactly zero.\n\n**Why this matters**: harmonic functions arise throughout physics (describing steady-state heat distribution, electric potential, and fluid flow) and appear in economic contexts wherever a quantity is in a kind of spatial or structural \"equilibrium.\" A function either satisfies this condition or it doesn't \u2014 there's no partial credit \u2014 which makes checking $f_{xx}+f_{yy}=0$ a clean, definitive test. Example: $f(x,y)=x^2-y^2$ is harmonic, since $f_{xx}=2$ and $f_{yy}=-2$, summing to zero; but $f(x,y)=x^2+y^2$ is *not* harmonic, since $f_{xx}+f_{yy}=2+2=4\\neq0$."}, {"cat": "Partial Derivatives & Homogeneity", "q": "Verify whether $z=\\sin x\\cos y$ satisfies the Laplace equation (i.e. is harmonic).", "hint": "Find $z_{xx}$ and $z_{yy}$ and check whether they sum to zero.", "ans": "**Step 1 \u2014 find the first partial derivatives.**\n$$z_x = \\cos x\\cos y \\qquad\\qquad z_y = -\\sin x\\sin y$$\n\n**Step 2 \u2014 find the pure second-order partials.**\n$$z_{xx} = -\\sin x\\cos y \\qquad\\qquad z_{yy} = -\\sin x\\cos y$$\n\n**Step 3 \u2014 check the Laplace condition:**\n$$z_{xx}+z_{yy} = -\\sin x\\cos y + (-\\sin x\\cos y) = -2\\sin x\\cos y$$\n\n**Step 4 \u2014 interpret the result.** This expression is **not** identically zero for all $x,y$ \u2014 it only vanishes at special points (like $x=0$ or $y=\\pi/2$), not as a general rule. **Since the harmonic condition must hold for every $x,y$ to qualify, the function is NOT harmonic.**\n\n(This is a useful contrast to a similar-looking earlier example, $z=\\sin x\\sin y$, which is *also* not harmonic for the same reason \u2014 swapping one $\\sin$ for a $\\cos$ doesn't change the underlying conclusion, since neither combination of sine and cosine products in this simple form ever satisfies the Laplace equation.)"}, {"cat": "Partial Derivatives & Homogeneity", "q": "State the Jacobian theorem (the test for functional dependence).", "hint": "Recall what quantity you compute, and what result signals dependence versus independence.", "ans": "**The Jacobian theorem (test for functional dependence).** Given two functions $y_1=f(x_1,x_2)$ and $y_2=g(x_1,x_2)$ of the same two variables, form the **Jacobian determinant**:\n$$J = \\begin{vmatrix}\\dfrac{\\partial y_1}{\\partial x_1} & \\dfrac{\\partial y_1}{\\partial x_2}\\\\[6pt] \\dfrac{\\partial y_2}{\\partial x_1} & \\dfrac{\\partial y_2}{\\partial x_2}\\end{vmatrix} = \\frac{\\partial y_1}{\\partial x_1}\\cdot\\frac{\\partial y_2}{\\partial x_2} - \\frac{\\partial y_1}{\\partial x_2}\\cdot\\frac{\\partial y_2}{\\partial x_1}$$\n\n**The theorem states**: if $J=0$ identically (for all values of $x_1,x_2$, not just isolated points), then $y_1$ and $y_2$ are **functionally dependent** \u2014 one can be expressed entirely as a function of the other, meaning they don't vary independently and carry no genuinely separate information. If $J\\neq0$ (at least generically, away from isolated special points), the functions are **functionally independent**.\n\nThis generalizes naturally to more variables: for $n$ functions of $n$ variables, the Jacobian is the determinant of the full $n\\times n$ matrix of all first-order partial derivatives, and the same zero/non-zero rule applies."}, {"cat": "Partial Derivatives & Homogeneity", "q": "Given $Z=x^3+2x^2y+y^3$, compute $Z_{xx}$, $Z_{xy}$, $Z_{yx}$, and $Z_{yy}$.", "hint": "Find the first partials, then differentiate each again \u2014 remember this function has $y^3$, not $3y^2$.", "ans": "**Step 1 \u2014 find the first-order partial derivatives.**\n\n$Z_x$ (treating $y$ as constant): the derivative of $x^3$ is $3x^2$; of $2x^2y$ is $4xy$; of $y^3$ is $0$ (no $x$).\n$$Z_x = 3x^2+4xy$$\n\n$Z_y$ (treating $x$ as constant): the derivative of $x^3$ is $0$; of $2x^2y$ is $2x^2$; of $y^3$ is $3y^2$.\n$$Z_y = 2x^2+3y^2$$\n\n**Step 2 \u2014 find $Z_{xx}$** by differentiating $Z_x$ again with respect to $x$:\n$$Z_{xx} = 6x+4y$$\n\n**Step 3 \u2014 find $Z_{xy}$** by differentiating $Z_x$ with respect to $y$ instead:\n$$Z_{xy} = 4x$$\n\n**Step 4 \u2014 find $Z_{yx}$** by differentiating $Z_y$ with respect to $x$:\n$$Z_{yx} = 4x$$\n\n**Step 5 \u2014 find $Z_{yy}$** by differentiating $Z_y$ again with respect to $y$:\n$$Z_{yy} = 6y$$\n\n**Final answer**: $Z_{xx}=6x+4y$, $Z_{xy}=4x$, $Z_{yx}=4x$, $Z_{yy}=6y$. As expected, $Z_{xy}=Z_{yx}=4x$, consistent with Young's theorem."}, {"cat": "Partial Derivatives & Homogeneity", "q": "Given $F(x,y)=x^2+2xy-3y^2$, show that $F_{xy}=F_{yx}$.", "hint": "Find $F_x$, differentiate w.r.t. $y$; find $F_y$, differentiate w.r.t. $x$; compare.", "ans": "**Step 1 \u2014 find $F_x$** (differentiate w.r.t. $x$, treating $y$ as constant): the derivative of $x^2$ is $2x$; of $2xy$ is $2y$; of $-3y^2$ is $0$.\n$$F_x = 2x+2y$$\n\n**Step 2 \u2014 find $F_{xy}$** by differentiating $F_x$ with respect to $y$: the derivative of $2x$ w.r.t. $y$ is $0$; of $2y$ is $2$.\n$$F_{xy} = 2$$\n\n**Step 3 \u2014 find $F_y$** (differentiate w.r.t. $y$, treating $x$ as constant): the derivative of $x^2$ is $0$; of $2xy$ is $2x$; of $-3y^2$ is $-6y$.\n$$F_y = 2x-6y$$\n\n**Step 4 \u2014 find $F_{yx}$** by differentiating $F_y$ with respect to $x$: the derivative of $2x$ w.r.t. $x$ is $2$; of $-6y$ is $0$.\n$$F_{yx} = 2$$\n\n**Comparison**: $F_{xy}=2=F_{yx}$. **Confirmed** \u2014 this holds as expected by Young's theorem. (This is the same function used earlier to find its degree of homogeneity via Euler's theorem \u2014 here we've additionally verified it satisfies Young's theorem as well, two separate and independent properties that this particular function happens to exhibit.)"}, {"cat": "Partial Derivatives & Homogeneity", "q": "Seyi claims that $Z_1=3x-y$ and $Z_2=9x^2-6xy+y^2$ are unrelated. Is Seyi correct?", "hint": "Try expressing $Z_2$ as a perfect square of $Z_1$ first \u2014 recall the pattern $(a-b)^2=a^2-2ab+b^2$.", "ans": "**Step 1 \u2014 check whether $Z_2$ is a perfect square of $Z_1$.** Recall the identity $(a-b)^2=a^2-2ab+b^2$. With $a=3x,b=y$:\n$$(3x-y)^2 = 9x^2-6xy+y^2$$\n\n**Step 2 \u2014 compare this to $Z_2$.** This expansion is **exactly** $Z_2=9x^2-6xy+y^2$! Since $Z_1=3x-y$, this means:\n$$Z_2 = Z_1^2$$\n\n$Z_2$ is entirely expressible as a function of $Z_1$ alone \u2014 they are **not** independent.\n\n**Step 3 \u2014 confirm formally using the Jacobian.** $\\dfrac{\\partial Z_1}{\\partial x}=3$, $\\dfrac{\\partial Z_1}{\\partial y}=-1$. $\\dfrac{\\partial Z_2}{\\partial x}=18x-6y$, $\\dfrac{\\partial Z_2}{\\partial y}=-6x+2y$.\n$$J = \\begin{vmatrix}3 & -1\\\\18x-6y & -6x+2y\\end{vmatrix} = 3(-6x+2y) - (-1)(18x-6y) = -18x+6y+18x-6y = 0$$\n\n**Final answer**: since $J=0$ identically, **$Z_1$ and $Z_2$ are functionally dependent \u2014 Seyi's assertion that they are unrelated is INCORRECT.** (This is a useful contrast to a similar-looking earlier question involving Toyin's claim about $Z_1=3x-y$ and $Z_2=9x^2+6xy+y^2$ \u2014 there, the *plus* sign in front of $6xy$ meant $Z_2=(3x+y)^2\\neq Z_1^2$, so Toyin was correct that they were unrelated. Here, the *minus* sign makes all the difference: $Z_2=(3x-y)^2=Z_1^2$ exactly, so Seyi's claim of \"unrelated\" is wrong. A single sign flip completely changes the conclusion \u2014 always check the details carefully rather than assuming a familiar-looking problem behaves the same way.)"}, {"cat": "Partial Derivatives & Homogeneity", "q": "Using Euler's theorem, determine the degree of homogeneity of $f(x,y)=2x^2+xy-y^2$.", "hint": "Check the total power of $x,y$ in each term.", "ans": "**Step 1 \u2014 check the total power of each term.** $2x^2$ has total power $2$; $xy$ has total power $1+1=2$; $-y^2$ has total power $2$. Every term shares the same total power.\n\n**Step 2 \u2014 confirm via the scaling test.** Replace $x\\to\\lambda x,y\\to\\lambda y$:\n$$f(\\lambda x,\\lambda y) = 2(\\lambda x)^2+(\\lambda x)(\\lambda y)-(\\lambda y)^2 = \\lambda^2(2x^2+xy-y^2) = \\lambda^2f(x,y)$$\n\n**Step 3 \u2014 confirm via Euler's theorem.** $f_x=4x+y$, $f_y=x-2y$.\n$$xf_x+yf_y = x(4x+y)+y(x-2y) = 4x^2+xy+xy-2y^2 = 4x^2+2xy-2y^2 = 2(2x^2+xy-y^2) = 2f$$\n\n**Final answer**: the function is **homogeneous of degree 2**."}, {"cat": "Partial Derivatives & Homogeneity", "q": "For the general quadratic form $Z=ax^2+bxy+cy^2+dx+ey+f$ (where $a,b,c,d,e,f$ are constants), find the sum of the two direct (non-mixed) second-order partial derivatives, $Z_{xx}+Z_{yy}$.", "hint": "Find $Z_x$ and $Z_y$ first, then differentiate each again with respect to the same variable.", "ans": "**Step 1 \u2014 find the first-order partial derivatives.**\n\n$Z_x$ (treating $y$ as constant): the derivative of $ax^2$ is $2ax$; of $bxy$ is $by$; of $cy^2$ is $0$; of $dx$ is $d$; of $ey$ is $0$; of $f$ is $0$.\n$$Z_x = 2ax+by+d$$\n\n$Z_y$ (treating $x$ as constant): the derivative of $ax^2$ is $0$; of $bxy$ is $bx$; of $cy^2$ is $2cy$; of $dx$ is $0$; of $ey$ is $e$; of $f$ is $0$.\n$$Z_y = bx+2cy+e$$\n\n**Step 2 \u2014 find $Z_{xx}$** by differentiating $Z_x$ again with respect to $x$ (only the $2ax$ term contributes, since $by$ and $d$ have no $x$):\n$$Z_{xx} = 2a$$\n\n**Step 3 \u2014 find $Z_{yy}$** by differentiating $Z_y$ again with respect to $y$ (only the $2cy$ term contributes):\n$$Z_{yy} = 2c$$\n\n**Step 4 \u2014 add them together:**\n$$Z_{xx}+Z_{yy} = 2a+2c = 2(a+c)$$\n\n**Final answer**: $Z_{xx}+Z_{yy}=2(a+c)$. Interestingly, this result depends only on the coefficients $a$ and $c$ (the coefficients of the pure $x^2$ and $y^2$ terms) \u2014 the mixed term coefficient $b$ and all the linear/constant terms ($d,e,f$) drop out completely, since they either vanish after two differentiations or never contribute to the *pure* second-order partials in the first place. (This general formula also gives a quick way to check the Laplace/harmonic condition for any quadratic form: it's harmonic exactly when $a+c=0$, i.e. $a=-c$.)"}, {"cat": "Partial Derivatives & Homogeneity", "q": "If $Z=e^{(\\log x)(\\log y)}$, verify that $\\dfrac{\\partial^2Z}{\\partial x\\partial y}=\\dfrac{\\partial^2Z}{\\partial y\\partial x}$.", "hint": "This one doesn't simplify as neatly as $e^{\\log x+\\log y}=xy$ \u2014 the exponent is a product of logs, not a sum, so you'll need the product rule inside the chain rule. Work through both mixed partials carefully and compare.", "ans": "**Note on difficulty**: unlike the earlier, similar-looking problem $z=e^{\\log x+\\log y}$ (which collapses neatly to $z=xy$, since the exponent is a *sum* of logs), here the exponent $(\\log x)(\\log y)$ is a *product* of two logs \u2014 this does **not** simplify the same way, so we must work through the full chain rule carefully.\n\n**Step 1 \u2014 find $Z_x$.** Let $w=(\\log x)(\\log y)$, so $Z=e^w$. By the chain rule, $Z_x = e^w\\cdot w_x$. To find $w_x$, treat $\\log y$ as a constant multiplying $\\log x$: $w_x = \\dfrac{\\log y}{x}$ (using $\\dfrac{d}{dx}\\log x=\\dfrac1x$).\n$$Z_x = e^w\\cdot\\frac{\\log y}{x}$$\n\n**Step 2 \u2014 find $Z_{xy}$** by differentiating $Z_x$ with respect to $y$. This is a product of two $y$-dependent pieces, $e^w$ and $\\dfrac{\\log y}{x}$, so we need the product rule.\n\nFirst, $\\dfrac{\\partial}{\\partial y}(e^w) = e^w\\cdot w_y$, where $w_y=\\dfrac{\\log x}{y}$ (by symmetry with $w_x$). Second, $\\dfrac{\\partial}{\\partial y}\\left(\\dfrac{\\log y}{x}\\right) = \\dfrac{1}{xy}$.\n\nApplying the product rule to $Z_x = e^w\\cdot\\dfrac{\\log y}{x}$:\n$$Z_{xy} = e^w\\cdot\\frac{\\log x}{y}\\cdot\\frac{\\log y}{x} + e^w\\cdot\\frac{1}{xy} = \\frac{e^w}{xy}\\Big[(\\log x)(\\log y)+1\\Big]$$\n\n**Step 3 \u2014 find $Z_{yx}$ by the same process, starting from $Z_y$.** By the same logic as Step 1 (with the roles of $x$ and $y$ swapped): $Z_y = e^w\\cdot\\dfrac{\\log x}{y}$. Differentiating with respect to $x$ (again needing the product rule, symmetric to Step 2):\n$$Z_{yx} = e^w\\cdot\\frac{\\log y}{x}\\cdot\\frac{\\log x}{y} + e^w\\cdot\\frac{1}{xy} = \\frac{e^w}{xy}\\Big[(\\log x)(\\log y)+1\\Big]$$\n\n**Comparison**: $Z_{xy}$ and $Z_{yx}$ are **identical** expressions. **Young's theorem is confirmed**, even for this considerably more complicated function \u2014 a good demonstration that the theorem holds generally, not just for the \"nice\" simplifiable examples."}, {"cat": "Applied Economics", "q": "If the value of $Y$ varies in a definite (predictable) way according to the value assigned to $X$, what is $Y$ said to be, in relation to $X$?", "hint": "Think about which variable is 'driven by' the other.", "ans": "**Definition.** If $Y$'s value is determined by (varies according to) the value of $X$, then $Y$ is called the **dependent variable**, and $X$ is called the **independent variable**. This is exactly the relationship expressed by function notation $Y=f(X)$: you freely choose or observe a value of $X$ (the independent variable), and the function's rule then *determines* the corresponding value of $Y$ (the dependent variable) \u2014 $Y$'s value \"depends on\" whatever $X$ happens to be.\n\n**Example**: in a demand function $Q_d=f(P)$, quantity demanded $Q_d$ is the dependent variable, and price $P$ is the independent variable \u2014 the quantity demanded is determined by (responds to) the price, not the other way around, in this particular formulation."}, {"cat": "Applied Economics", "q": "Given the revenue function $R(x)=25x+\\dfrac{x^2}{10}$, find the marginal revenue when $x=5$.", "hint": "$MR=R'(x)$ \u2014 differentiate, then substitute $x=5$.", "ans": "**Step 1 \u2014 differentiate $R(x)=25x+\\dfrac{x^2}{10}$** using the power rule term by term (the derivative of $25x$ is $25$; the derivative of $\\dfrac{x^2}{10} = \\dfrac{1}{10}x^2$ is $\\dfrac{1}{10}\\times2x=\\dfrac{x}{5}$):\n$$R'(x) = 25+\\frac{x}{5}$$\n\n**Step 2 \u2014 evaluate at $x=5$:**\n$$R'(5) = 25+\\frac{5}{5} = 25+1 = 26$$\n\n**Final answer**: the marginal revenue at $x=5$ is **26**."}, {"cat": "Applied Economics", "q": "Two positive numbers have a sum of 20. Find the two numbers such that their product is as large as possible, and state the maximum product.", "hint": "Let the numbers be $x$ and $20-x$; maximize $P=x(20-x)$ using the usual first- and second-derivative tests.", "ans": "**Step 1 \u2014 set up the problem.** Let the two numbers be $x$ and $y$, with the constraint $x+y=20$. We want to maximize their product, $P=xy$. Using the constraint to eliminate $y$: $y=20-x$, so:\n$$P(x) = x(20-x) = 20x-x^2$$\n\n**Step 2 \u2014 find the first derivative** and set it to zero to find the critical point:\n$$P'(x) = 20-2x$$\n$$20-2x=0 \\implies x=10$$\n\n**Step 3 \u2014 find the second derivative** to confirm this is a maximum:\n$$P''(x) = -2$$\nSince $P''(x)=-2<0$ (negative and constant), the function is concave down everywhere, confirming $x=10$ gives a **maximum**.\n\n**Step 4 \u2014 find the corresponding value of $y$**: $y=20-10=10$.\n\n**Step 5 \u2014 find the maximum product**: $P=xy=10\\times10=100$.\n\n**Final answer**: the two numbers are **10 and 10** (i.e. the sum should be split exactly evenly), giving a maximum product of **100**. This illustrates a general pattern worth remembering: for a fixed sum, the product of two positive numbers is always maximized when the numbers are equal."}, {"cat": "Differential Equations", "q": "Determine the order and degree of $\\left(\\dfrac{d^2y}{dx^2}\\right)^2=\\left(\\dfrac{dy}{dx}\\right)^3+2\\left(\\dfrac{dy}{dx}\\right)+1$.", "hint": "Identify the highest-order derivative present, then the power it's raised to \u2014 don't be distracted by the power on the lower-order term.", "ans": "**Step 1 \u2014 identify all derivatives present.** The equation contains $\\dfrac{d^2y}{dx^2}$ (a second-order derivative, raised to the power 2) and $\\dfrac{dy}{dx}$ (a first-order derivative, appearing raised to the power 3 in one term, and to the power 1 in another).\n\n**Step 2 \u2014 determine the order.** The **highest**-order derivative present is $\\dfrac{d^2y}{dx^2}$, a second derivative. So **order = 2**.\n\n**Step 3 \u2014 determine the degree.** Degree is defined by the power of the *highest-order* derivative specifically \u2014 not by any power that might appear on a *lower*-order term. Here, $\\dfrac{d^2y}{dx^2}$ is raised to the power **2**. The fact that $\\left(\\dfrac{dy}{dx}\\right)^3$ has an even *higher* power (3) doesn't matter for the degree, since $\\dfrac{dy}{dx}$ is only a first-order derivative, not the highest-order one present. So **degree = 2**.\n\n**Final answer**: order = 2, degree = 2. (This is a good example for reinforcing the distinction: always look for the *highest-order* derivative first, and only then check *its* power \u2014 ignore the powers of any lower-order derivatives, no matter how large those powers might be.)"}, {"cat": "Matrices & Determinants", "q": "If $A=\\begin{bmatrix}a-1&b\\\\a+b&3c-b\\end{bmatrix}$ and $B=\\begin{bmatrix}1&3a\\\\2c&d+1\\end{bmatrix}$, and $A=B$, find the values of $a,b,c,d$.", "hint": "Matrix equality means every corresponding entry must be equal \u2014 this gives four simultaneous equations to solve one at a time.", "ans": "**Recall the rule for matrix equality**: two matrices are equal only if they have the same dimensions *and* every corresponding entry matches exactly. Comparing entry by entry gives four equations.\n\n**Step 1 \u2014 compare the (1,1) entries**: $a-1=1 \\implies a=2$.\n\n**Step 2 \u2014 compare the (1,2) entries**: $b=3a$. Substituting $a=2$: $b=3(2)=6$.\n\n**Step 3 \u2014 compare the (2,1) entries**: $a+b=2c$. Substituting $a=2,b=6$: $2+6=2c \\implies 8=2c \\implies c=4$.\n\n**Step 4 \u2014 compare the (2,2) entries**: $3c-b=d+1$. Substituting $c=4,b=6$: $3(4)-6=d+1 \\implies 12-6=d+1 \\implies 6=d+1 \\implies d=5$.\n\n**Final answer**: $a=2$, $b=6$, $c=4$, $d=5$. (Check: $A=\\begin{bmatrix}1&6\\\\8&6\\end{bmatrix}$ and $B=\\begin{bmatrix}1&6\\\\8&6\\end{bmatrix}$ \u2014 they match exactly.)"}, {"cat": "Matrices & Determinants", "q": "For a general $2\\times2$ matrix $A=\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}$ with $ad-bc\\neq0$, prove that $AI=A$, $IA=A$, and $AA^{-1}=A^{-1}A=I$.", "hint": "For $AI=A$ and $IA=A$, just multiply out directly. For the inverse identities, substitute the general inverse formula and multiply symbolically.", "ans": "**Part 1 \u2014 prove $AI=A$ and $IA=A$.** Let $I=\\begin{bmatrix}1&0\\\\0&1\\end{bmatrix}$. Multiplying:\n$$AI = \\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}\\begin{bmatrix}1&0\\\\0&1\\end{bmatrix} = \\begin{bmatrix}a(1)+b(0)&a(0)+b(1)\\\\c(1)+d(0)&c(0)+d(1)\\end{bmatrix} = \\begin{bmatrix}a&b\\\\c&d\\end{bmatrix} = A$$\nBy the same entry-by-entry multiplication, $IA=A$ too. **This confirms the identity matrix leaves any matrix unchanged, in either multiplication order** \u2014 exactly the role the number $1$ plays in ordinary arithmetic.\n\n**Part 2 \u2014 prove $AA^{-1}=A^{-1}A=I$, using the general inverse formula** $A^{-1}=\\dfrac{1}{ad-bc}\\begin{bmatrix}d&-b\\\\-c&a\\end{bmatrix}$.\n\nCompute $AA^{-1}$:\n$$AA^{-1} = \\frac{1}{ad-bc}\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}\\begin{bmatrix}d&-b\\\\-c&a\\end{bmatrix}$$\nMultiplying out each entry: Row 1, Col 1: $ad-bc$. Row 1, Col 2: $-ab+ba=0$. Row 2, Col 1: $cd-dc=0$. Row 2, Col 2: $-cb+da=ad-bc$.\n$$AA^{-1} = \\frac{1}{ad-bc}\\begin{bmatrix}ad-bc&0\\\\0&ad-bc\\end{bmatrix} = \\begin{bmatrix}1&0\\\\0&1\\end{bmatrix} = I$$\n(Dividing every entry by $ad-bc$ cancels it from the diagonal entries and leaves the zero off-diagonal entries unchanged.)\n\nCompute $A^{-1}A$ the same way:\n$$A^{-1}A = \\frac{1}{ad-bc}\\begin{bmatrix}d&-b\\\\-c&a\\end{bmatrix}\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}$$\nRow 1, Col 1: $da-bc$. Row 1, Col 2: $db-bd=0$. Row 2, Col 1: $-ca+ac=0$. Row 2, Col 2: $-cb+ad=ad-bc$.\n$$A^{-1}A = \\frac{1}{ad-bc}\\begin{bmatrix}ad-bc&0\\\\0&ad-bc\\end{bmatrix} = I$$\n\n**Final answer**: $AI=IA=A$ and $AA^{-1}=A^{-1}A=I$ are all proven true in general, for *any* $2\\times2$ matrix with a non-zero determinant \u2014 this generalizes the specific numerical examples verified elsewhere to a proof that holds for every valid matrix of this size."}, {"cat": "Matrices & Determinants", "q": "A square matrix whose determinant is equal to zero is referred to as what?", "hint": "Recall the term used throughout this course whenever a determinant works out to zero.", "ans": "**Definition.** A square matrix whose determinant equals zero is called a **singular matrix**. A singular matrix has no inverse (since the formula $A^{-1}=\\dfrac{1}{|A|}\\text{adj}(A)$ would require dividing by zero), and its rows (equivalently, its columns) are **linearly dependent** \u2014 meaning at least one row can be written as a combination of the others, so the matrix doesn't carry \"full\" independent information.\n\n**Contrast**: a square matrix whose determinant is *not* zero is called **non-singular** (or invertible), and it does have a well-defined inverse.\n\n**Final answer**: a matrix with determinant $0$ is called a **singular matrix**."}, {"cat": "Matrices & Determinants", "q": "If matrix $A$ has dimensions $m\\times n$ and matrix $B$ has dimensions $n\\times p$, what is the dimension of the product $AB$?", "hint": "The 'inner' dimensions must match for the multiplication to be valid; the 'outer' dimensions give the result's shape.", "ans": "**Recall the conformability rule.** Two matrices $A_{m\\times n}$ and $B_{n\\times p}$ can be multiplied because the number of columns of $A$ (which is $n$) matches the number of rows of $B$ (also $n$) \u2014 these are called the \"inner\" dimensions, and they must agree for the multiplication to be defined at all.\n\n**The resulting dimension** is found by taking the two \"outer\" dimensions: the number of rows of $A$ (which is $m$), and the number of columns of $B$ (which is $p$).\n\n**Final answer**: the product $AB$ has dimensions $m\\times p$. (For example, if $A$ is $2\\times4$ and $B$ is $4\\times3$ \u2014 matching the inner dimension $4$ \u2014 the product $AB$ is $2\\times3$, taking the outer dimensions $2$ and $3$.)"}, {"cat": "Matrices & Determinants", "q": "Given $A=\\begin{bmatrix}1&-2\\\\3&5\\\\0&4\\end{bmatrix}$, $B=\\begin{bmatrix}0&-1\\\\2&7\\\\1&6\\end{bmatrix}$, and $k=2$, verify that $k(A+B)=kA+kB$.", "hint": "Compute both sides independently and compare.", "ans": "**Step 1 \u2014 compute the left-hand side, $k(A+B)$.** First find $A+B$ by adding corresponding entries:\n$$A+B = \\begin{bmatrix}1+0&-2+(-1)\\\\3+2&5+7\\\\0+1&4+6\\end{bmatrix} = \\begin{bmatrix}1&-3\\\\5&12\\\\1&10\\end{bmatrix}$$\nNow multiply every entry by $k=2$:\n$$k(A+B) = 2\\begin{bmatrix}1&-3\\\\5&12\\\\1&10\\end{bmatrix} = \\begin{bmatrix}2&-6\\\\10&24\\\\2&20\\end{bmatrix}$$\n\n**Step 2 \u2014 compute the right-hand side, $kA+kB$.** First find $kA$:\n$$kA = 2\\begin{bmatrix}1&-2\\\\3&5\\\\0&4\\end{bmatrix} = \\begin{bmatrix}2&-4\\\\6&10\\\\0&8\\end{bmatrix}$$\nThen find $kB$:\n$$kB = 2\\begin{bmatrix}0&-1\\\\2&7\\\\1&6\\end{bmatrix} = \\begin{bmatrix}0&-2\\\\4&14\\\\2&12\\end{bmatrix}$$\nNow add $kA+kB$ entry by entry:\n$$kA+kB = \\begin{bmatrix}2+0&-4+(-2)\\\\6+4&10+14\\\\0+2&8+12\\end{bmatrix} = \\begin{bmatrix}2&-6\\\\10&24\\\\2&20\\end{bmatrix}$$\n\n**Comparison**: both sides give $\\begin{bmatrix}2&-6\\\\10&24\\\\2&20\\end{bmatrix}$ \u2014 **they match exactly, verifying the distributive law $k(A+B)=kA+kB$.**"}, {"cat": "Matrices & Determinants", "q": "Differentiate clearly between diagonal, scalar, and identity matrices, with an example of each.", "hint": "Each is a special case nested inside the previous one \u2014 think about how the restrictions get progressively tighter.", "ans": "These three matrix types form a nested hierarchy, with each one being a more restrictive special case of the one before it.\n\n**Diagonal matrix.** A square matrix where every entry *off* the main diagonal is zero. The diagonal entries themselves can be **any** values at all \u2014 they don't need to be equal to each other, and some could even be zero. Example: $\\begin{bmatrix}5&0\\\\0&3\\end{bmatrix}$.\n\n**Scalar matrix.** A diagonal matrix with the *additional* restriction that all the diagonal entries must be **equal to the same value**. Example: $\\begin{bmatrix}4&0\\\\0&4\\end{bmatrix}$ (this behaves exactly like the number $4$ multiplied by the identity matrix, $4I$).\n\n**Identity matrix.** A scalar matrix with the *further* restriction that the common diagonal value must specifically be **1**. Example: $\\begin{bmatrix}1&0\\\\0&1\\end{bmatrix}$.\n\n**The nested relationship, summarised**: every identity matrix is a scalar matrix (with the specific value 1), and every scalar matrix is a diagonal matrix (with equal diagonal entries) \u2014 but the reverse isn't true. A diagonal matrix need not be scalar (its diagonal entries can differ), and a scalar matrix need not be the identity (its common value need not be 1)."}, {"cat": "Matrices & Determinants", "q": "Define the trace of a matrix, and if $A$ and $B$ are square matrices of the same order, show that $\\text{tr}(A-B)=\\text{tr}\\,A-\\text{tr}\\,B$.", "hint": "The trace is the sum of diagonal entries; write out $(A-B)$'s diagonal entries individually and split the sum.", "ans": "**Definition**: the **trace** of a square matrix $A$, written $\\text{tr}(A)$, is the sum of the entries lying on its main diagonal.\n\n**Proof that $\\text{tr}(A-B)=\\text{tr}(A)-\\text{tr}(B)$.** Let $A=[a_{ij}]$ and $B=[b_{ij}]$, both $n\\times n$ matrices.\n\n**Step 1 \u2014 recall how matrix subtraction works entry-by-entry.** The entry in row $i$, column $j$ of $(A-B)$ is $a_{ij}-b_{ij}$. In particular, the $i$-th *diagonal* entry of $(A-B)$ is $a_{ii}-b_{ii}$.\n\n**Step 2 \u2014 write out the trace of $(A-B)$**, summing these diagonal entries:\n$$\\text{tr}(A-B) = \\sum_{i=1}^{n}\\big(a_{ii}-b_{ii}\\big)$$\n\n**Step 3 \u2014 split the sum**, since a sum of differences can always be separated into a difference of sums:\n$$\\sum_{i=1}^{n}(a_{ii}-b_{ii}) = \\sum_{i=1}^{n}a_{ii} - \\sum_{i=1}^{n}b_{ii}$$\n\n**Step 4 \u2014 recognise each piece.** $\\displaystyle\\sum_{i=1}^n a_{ii}=\\text{tr}(A)$, and $\\displaystyle\\sum_{i=1}^n b_{ii}=\\text{tr}(B)$.\n\n**Conclusion**: $\\text{tr}(A-B) = \\text{tr}(A)-\\text{tr}(B)$. **Proven.** (This mirrors the earlier proof that $\\text{tr}(A+B)=\\text{tr}(A)+\\text{tr}(B)$ \u2014 the trace behaves as a fully linear operation, distributing cleanly over both addition and subtraction.)"}, {"cat": "Matrices & Determinants", "q": "Outline three techniques for evaluating the determinant of a square matrix.", "hint": "Think about the direct formula for the smallest case, and two methods that generalize to larger matrices.", "ans": "Three standard techniques exist for computing a determinant, roughly in increasing order of generality (or decreasing order of directness):\n\n**1. The direct diagonal-product formula** (for $2\\times2$ matrices specifically). For $A=\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}$, $|A|=ad-bc$ \u2014 multiply along the main diagonal, subtract the product of the other diagonal. This is the fastest method, but it **only works for $2\\times2$ matrices**.\n\n**2. Cofactor (Laplace) expansion.** Pick any row or column, and for each entry in it, multiply that entry by the determinant of the smaller matrix left after deleting its row and column (its \"minor\"), applying an alternating $+,-,+,-\\ldots$ sign pattern. This method works for a square matrix of **any** size, though it becomes more laborious as the matrix grows (a $4\\times4$ determinant requires computing four $3\\times3$ determinants, each of which requires three $2\\times2$ determinants, and so on).\n\n**3. Row reduction (elimination method).** Use elementary row operations to transform the matrix into upper-triangular form (all entries below the main diagonal equal to zero), keeping track of how each operation affects the determinant's value (row swaps flip the sign; multiplying a row by a constant scales the determinant by that constant). Once in triangular form, the determinant is simply the product of the diagonal entries. This method is generally the most efficient for large matrices, though it requires more careful bookkeeping than direct cofactor expansion for small ones.\n\n(Method 1 is the least general \u2014 restricted to $2\\times2$ \u2014 while methods 2 and 3 both generalize to matrices of any size, with method 3 typically being more efficient for larger matrices.)"}, {"cat": "Matrices & Determinants", "q": "Determine the values of $x$ and $y$ if $(x,\\,x+y)=(y-2,\\,6)$.", "hint": "Two ordered pairs are equal only if their corresponding components match \u2014 this gives two simultaneous equations.", "ans": "**Recall the rule for equality of ordered pairs**: $(p,q)=(r,s)$ only if $p=r$ **and** $q=s$ \u2014 both components must match independently.\n\n**Step 1 \u2014 set the first components equal:**\n$$x = y-2 \\quad\\text{...(1)}$$\n\n**Step 2 \u2014 set the second components equal:**\n$$x+y = 6 \\quad\\text{...(2)}$$\n\n**Step 3 \u2014 substitute (1) into (2)**, replacing $x$ with $y-2$:\n$$(y-2)+y = 6 \\implies 2y-2=6 \\implies 2y=8 \\implies y=4$$\n\n**Step 4 \u2014 back-substitute to find $x$**, using equation (1): $x=4-2=2$.\n\n**Final answer**: $x=2$, $y=4$. (Check: first components, $x=2$ and $y-2=4-2=2$ \u2713. Second components, $x+y=2+4=6$ \u2713.)"}, {"cat": "Matrices & Determinants", "q": "Solve the system $X_1+X_2-X_3=2$, $2X_1-X_2+X_3=3$, $3X_1+X_2+2X_3=2$ by explicitly finding the inverse of the coefficient matrix, then computing $X=A^{-1}B$.", "hint": "Find $|A|$, compute all 9 cofactors to build the adjugate matrix, then divide by the determinant to get $A^{-1}$.", "ans": "**Step 1 \u2014 write the coefficient matrix and constants vector:**\n$$A = \\begin{bmatrix}1&1&-1\\\\2&-1&1\\\\3&1&2\\end{bmatrix} \\qquad B=\\begin{bmatrix}2\\\\3\\\\2\\end{bmatrix}$$\n\n**Step 2 \u2014 find $|A|$**, expanding along the first row (this was computed in an earlier, related problem using Cramer's rule on this same system):\n$$|A| = 1(-2-1) - 1(4-3) - 1(2-(-3)) = -3-1-5 = -9$$\n\n**Step 3 \u2014 compute all nine cofactors.** Recall $C_{ij}=(-1)^{i+j}\\times(\\text{minor obtained by deleting row }i\\text{, column }j)$.\n\n$C_{11}=+\\begin{vmatrix}-1&1\\\\1&2\\end{vmatrix}=-2-1=-3$. $\\quad C_{12}=-\\begin{vmatrix}2&1\\\\3&2\\end{vmatrix}=-(4-3)=-1$. $\\quad C_{13}=+\\begin{vmatrix}2&-1\\\\3&1\\end{vmatrix}=2+3=5$.\n\n$C_{21}=-\\begin{vmatrix}1&-1\\\\1&2\\end{vmatrix}=-(2+1)=-3$. $\\quad C_{22}=+\\begin{vmatrix}1&-1\\\\3&2\\end{vmatrix}=2+3=5$. $\\quad C_{23}=-\\begin{vmatrix}1&1\\\\3&1\\end{vmatrix}=-(1-3)=2$.\n\n$C_{31}=+\\begin{vmatrix}1&-1\\\\-1&1\\end{vmatrix}=1-1=0$. $\\quad C_{32}=-\\begin{vmatrix}1&-1\\\\2&1\\end{vmatrix}=-(1+2)=-3$. $\\quad C_{33}=+\\begin{vmatrix}1&1\\\\2&-1\\end{vmatrix}=-1-2=-3$.\n\n**Step 4 \u2014 build the adjugate matrix** (the transpose of the cofactor matrix \u2014 swap rows and columns of the cofactor grid):\n$$\\text{Cofactor matrix} = \\begin{bmatrix}-3&-1&5\\\\-3&5&2\\\\0&-3&-3\\end{bmatrix} \\quad\\implies\\quad \\text{adj}(A) = \\begin{bmatrix}-3&-3&0\\\\-1&5&-3\\\\5&2&-3\\end{bmatrix}$$\n\n**Step 5 \u2014 find $A^{-1}=\\dfrac{1}{|A|}\\text{adj}(A)$:**\n$$A^{-1} = \\frac{1}{-9}\\begin{bmatrix}-3&-3&0\\\\-1&5&-3\\\\5&2&-3\\end{bmatrix} = \\begin{bmatrix}\\frac13&\\frac13&0\\\\[4pt]\\frac19&-\\frac59&\\frac13\\\\[4pt]-\\frac59&-\\frac29&\\frac13\\end{bmatrix}$$\n\n**Step 6 \u2014 compute $X=A^{-1}B$:**\n$$X_1 = \\frac13(2)+\\frac13(3)+0(2) = \\frac23+1 = \\frac53$$\n$$X_2 = \\frac19(2)-\\frac59(3)+\\frac13(2) = \\frac29-\\frac{15}9+\\frac69 = -\\frac79$$\n$$X_3 = -\\frac59(2)-\\frac29(3)+\\frac13(2) = -\\frac{10}9-\\frac69+\\frac69 = -\\frac{10}9$$\n\n**Final answer**: $X_1=\\dfrac53$, $X_2=-\\dfrac79$, $X_3=-\\dfrac{10}9$ \u2014 exactly matching the result obtained via Cramer's rule on this same system, confirming both methods agree (as they always must, since both correctly solve the same linear system)."}, {"cat": "Matrices & Determinants", "q": "Given $A=\\begin{bmatrix}3&2\\\\1&-4\\end{bmatrix}$, $B=\\begin{bmatrix}1&3\\\\2&0\\end{bmatrix}$, and $C=\\begin{bmatrix}1&0\\\\0&1\\end{bmatrix}$, prove that $A(B+C)=AB+AC$.", "hint": "Compute both sides independently \u2014 note $C$ is the identity matrix, so $AC=A$.", "ans": "**Step 1 \u2014 compute the left-hand side, $A(B+C)$.** First find $B+C$:\n$$B+C = \\begin{bmatrix}1+1&3+0\\\\2+0&0+1\\end{bmatrix} = \\begin{bmatrix}2&3\\\\2&1\\end{bmatrix}$$\nNow multiply $A(B+C)$:\n$$A(B+C) = \\begin{bmatrix}3&2\\\\1&-4\\end{bmatrix}\\begin{bmatrix}2&3\\\\2&1\\end{bmatrix} = \\begin{bmatrix}3(2)+2(2)&3(3)+2(1)\\\\1(2)+(-4)(2)&1(3)+(-4)(1)\\end{bmatrix} = \\begin{bmatrix}10&11\\\\-6&-1\\end{bmatrix}$$\n\n**Step 2 \u2014 compute $AB$ separately:**\n$$AB = \\begin{bmatrix}3&2\\\\1&-4\\end{bmatrix}\\begin{bmatrix}1&3\\\\2&0\\end{bmatrix} = \\begin{bmatrix}3(1)+2(2)&3(3)+2(0)\\\\1(1)+(-4)(2)&1(3)+(-4)(0)\\end{bmatrix} = \\begin{bmatrix}7&9\\\\-7&3\\end{bmatrix}$$\n\n**Step 3 \u2014 compute $AC$.** Since $C$ is the **identity matrix**, multiplying by it leaves $A$ completely unchanged:\n$$AC = A = \\begin{bmatrix}3&2\\\\1&-4\\end{bmatrix}$$\n\n**Step 4 \u2014 add $AB+AC$:**\n$$AB+AC = \\begin{bmatrix}7+3&9+2\\\\-7+1&3-4\\end{bmatrix} = \\begin{bmatrix}10&11\\\\-6&-1\\end{bmatrix}$$\n\n**Comparison**: $A(B+C)=\\begin{bmatrix}10&11\\\\-6&-1\\end{bmatrix}$ and $AB+AC=\\begin{bmatrix}10&11\\\\-6&-1\\end{bmatrix}$ \u2014 **they match exactly, verifying the distributive law.** (Using the identity matrix as one of the matrices here provides a nice sanity check along the way, since $AC$ could be found instantly without any multiplication at all.)"}, {"cat": "Matrices & Determinants", "q": "State the condition required for (a) two matrices to be added, and (b) two matrices to be multiplied.", "hint": "Addition and multiplication have different compatibility requirements \u2014 don't mix them up.", "ans": "These are two genuinely different rules, easy to confuse but important to keep separate.\n\n**(a) Condition for matrix addition.** Two matrices can be added only if they have **exactly the same dimensions** (the same number of rows AND the same number of columns) \u2014 a $2\\times3$ matrix can only be added to another $2\\times3$ matrix, for instance. Addition simply combines corresponding entries, so every entry needs a \"partner\" in the same position in the other matrix.\n\n**(b) Condition for matrix multiplication (conformability).** Two matrices $A_{m\\times n}$ and $B_{p\\times q}$ can be multiplied, $AB$, only if the number of **columns** of $A$ equals the number of **rows** of $B$ (i.e. $n=p$) \u2014 the \"inner\" dimensions must match, though the \"outer\" dimensions ($m$ and $q$) can be anything. Unlike addition, the two matrices being multiplied do *not* need to be the same size or shape as each other.\n\n**Key distinction**: addition requires identical dimensions on *both* matrices; multiplication only requires the inner dimensions to match, which is a much less restrictive condition \u2014 many pairs of differently-shaped matrices can still be validly multiplied, even though they could never be added."}, {"cat": "Matrices & Determinants", "q": "Given $A=\\begin{bmatrix}(3+x)^2&6\\\\9y^3&7\\\\6&49\\end{bmatrix}$ and $B=\\begin{bmatrix}144&6\\\\72&7\\\\6&7z\\end{bmatrix}$, and $A=B$, find the values of $x$, $y$, and $z$.", "hint": "Matrix equality means matching corresponding entries \u2014 this gives one quadratic equation, one cubic equation, and one linear equation to solve.", "ans": "**Recall the rule**: matrix equality requires every corresponding entry to match. Comparing entry by entry gives three independent equations (the entries $6$ and $6$ already match automatically, so they give no new information).\n\n**Step 1 \u2014 compare the (1,1) entries**: $(3+x)^2 = 144$. Taking the square root of both sides (remembering both signs):\n$$3+x = \\pm12$$\nThis gives two cases: $3+x=12 \\implies x=9$, or $3+x=-12 \\implies x=-15$. **Both are valid solutions** to this equation.\n\n**Step 2 \u2014 compare the (2,1) entries**: $9y^3=72$. Solve for $y^3$:\n$$y^3 = \\frac{72}{9}=8 \\implies y = \\sqrt[3]{8} = 2$$\n(This cubic equation technically has two other complex-number roots as well, but since we want a real value of $y$, the answer is simply $y=2$.)\n\n**Step 3 \u2014 compare the (3,2) entries**: $49=7z$, so:\n$$z = \\frac{49}{7} = 7$$\n\n**Final answer**: $x=9$ or $x=-15$ (two valid solutions); $y=2$; $z=7$."}, {"cat": "Matrices & Determinants", "q": "According to convention in this course, who is credited with developing matrix theory, and in what year?", "hint": "This is a historical/biographical fact often cited in introductory treatments of matrices.", "ans": "**The conventional answer.** Matrix algebra as a formal mathematical system is generally credited to the English mathematician **Arthur Cayley**, who published his foundational work on matrices, *\"A Memoir on the Theory of Matrices,\"* in **1858**.\n\n**A brief historical note for context**: rectangular arrays of numbers had actually been used informally for solving systems of equations for centuries before Cayley (for instance, in ancient Chinese mathematics), but Cayley was the first to treat matrices as objects in their own right \u2014 with their own defined operations of addition, multiplication, and inversion \u2014 establishing matrix algebra as a coherent branch of mathematics rather than just a bookkeeping tool for equations.\n\n**Final answer**: matrix theory is conventionally credited to **Arthur Cayley**, in the year **1858**."}, {"cat": "Matrices & Determinants", "q": "Given $A=\\begin{bmatrix}2&0&0&0\\\\4&4&0&0\\\\8&8&8&0\\\\16&16&16&16\\end{bmatrix}$: (a) find the spur (trace) of $A$, (b) find $|A|$, (c) what type of matrix is $A$?", "hint": "Every entry above the main diagonal is zero, telling you what kind of matrix this is and giving you a shortcut for the determinant.", "ans": "**(a) Find the spur (trace) of $A$**, by summing the diagonal entries:\n$$\\text{tr}(A) = 2+4+8+16 = 30$$\n\n**(b) Find $|A|$.** Notice that every entry *above* the main diagonal is zero \u2014 this is a **lower triangular matrix**. For any triangular matrix, the determinant is simply the **product of the diagonal entries** (this follows from repeated cofactor expansion along the first row, which always has only one non-zero entry at each step):\n$$|A| = 2\\times4\\times8\\times16 = 1024$$\n\n**(c) Identify the type of matrix.** Since every entry above the main diagonal is zero (while entries on and below the diagonal can be non-zero), $A$ is a **lower triangular matrix**.\n\n**Final answer**: $\\text{tr}(A)=30$; $|A|=1024$; $A$ is a **lower triangular matrix**."}, {"cat": "Matrices & Determinants", "q": "Given $A=\\begin{bmatrix}1&3&2\\\\2&4&9\\\\7&6&1\\end{bmatrix}$ and $E=\\begin{bmatrix}0&1&0\\\\1&0&0\\\\0&0&1\\end{bmatrix}$, show that $|EA|=|E||A|$.", "hint": "$E$ is a row-swap matrix (it swaps rows 1 and 2 of whatever it multiplies) with determinant $-1$. Compute both sides independently.", "ans": "**Step 1 \u2014 find $|E|$.** $E$ is the identity matrix with its first two rows swapped. Any single row swap of the identity flips the sign of the determinant from $+1$ to $-1$, so $|E|=-1$.\n\n**Step 2 \u2014 find $|A|$**, expanding along the first row:\n$$|A| = 1\\begin{vmatrix}4&9\\\\6&1\\end{vmatrix} - 3\\begin{vmatrix}2&9\\\\7&1\\end{vmatrix} + 2\\begin{vmatrix}2&4\\\\7&6\\end{vmatrix}$$\n$$= 1(4-54) - 3(2-63) + 2(12-28) = 1(-50)-3(-61)+2(-16) = -50+183-32 = 101$$\n\n**Step 3 \u2014 compute $|E||A|$:**\n$$|E||A| = (-1)(101) = -101$$\n\n**Step 4 \u2014 compute $EA$ directly.** Since $E$ swaps rows 1 and 2 of any matrix it multiplies:\n$$EA = \\begin{bmatrix}2&4&9\\\\1&3&2\\\\7&6&1\\end{bmatrix}$$\n\n**Step 5 \u2014 compute $|EA|$**, expanding along the first row:\n$$|EA| = 2\\begin{vmatrix}3&2\\\\6&1\\end{vmatrix} - 4\\begin{vmatrix}1&2\\\\7&1\\end{vmatrix} + 9\\begin{vmatrix}1&3\\\\7&6\\end{vmatrix}$$\n$$= 2(3-12) - 4(1-14) + 9(6-21) = 2(-9)-4(-13)+9(-15) = -18+52-135 = -101$$\n\n**Comparison**: $|EA|=-101$ and $|E||A|=-101$ \u2014 **they match exactly, verifying $|EA|=|E||A|$.**"}, {"cat": "Matrices & Determinants", "q": "Given $A=\\begin{bmatrix}1&5x-11\\\\2&x^2-1\\end{bmatrix}$, if $|A|=0$, find the value(s) of $x$.", "hint": "Expand the 2\u00d72 determinant, set it to zero, and solve the resulting quadratic.", "ans": "**Step 1 \u2014 apply the 2\u00d72 determinant formula**, $ad-bc$, with $a=1,b=5x-11,c=2,d=x^2-1$:\n$$|A| = (1)(x^2-1) - (5x-11)(2) = x^2-1-10x+22$$\n\n**Step 2 \u2014 simplify**:\n$$|A| = x^2-10x+21$$\n\n**Step 3 \u2014 set the determinant equal to zero and solve:**\n$$x^2-10x+21=0$$\n\n**Step 4 \u2014 factor the quadratic.** We need two numbers that multiply to $21$ and add to $-10$: those are $-3$ and $-7$.\n$$(x-3)(x-7)=0$$\n\n**Step 5 \u2014 solve f
