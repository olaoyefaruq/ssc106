dered Hessian is arranged as:\n$$H = \\begin{bmatrix}0 & g_1 & g_2 \\\\ g_1 & \\mathcal{L}_{11} & \\mathcal{L}_{12} \\\\ g_2 & \\mathcal{L}_{12} & \\mathcal{L}_{22}\\end{bmatrix} = \\begin{bmatrix}0&1&4\\\\1&0&1\\\\4&1&0\\end{bmatrix}$$\n\n**Step 5 \u2014 compute the determinant** $|H|$ by expanding along the first row:\n$$|H| = 0\\cdot\\begin{vmatrix}0&1\\\\1&0\\end{vmatrix} - 1\\cdot\\begin{vmatrix}1&1\\\\4&0\\end{vmatrix} + 4\\cdot\\begin{vmatrix}1&0\\\\4&1\\end{vmatrix}$$\n$$= 0 - 1(0-4) + 4(1-0) = 0+4+4 = 8$$\n\n**Step 6 \u2014 apply the decision rule.** For a problem with 2 choice variables and 1 constraint, the rule is: if $|H|>0$, the critical point is a **constrained maximum**; if $|H|<0$, it's a **constrained minimum**. Since $|H|=8>0$, the point $(X_1,X_2)=(8,2)$ is a **constrained maximum**.\n\n**Final answer**: $X_1=8$, $X_2=2$, $\\lambda=2$, $|H|=8>0$, confirming a **maximum**, with maximum value $f=X_1X_2=8\\times2=16$."}, {"cat": "Optimization: Extrema & Lagrangian", "q": "Maximize $Q=LK+30$ subject to $12L+6K=48$ using the Lagrangian method; find the value of the multiplier and interpret it economically.", "hint": "Set up $\\mathcal{L}=LK+30+\\lambda(48-12L-6K)$ and take FOCs.", "ans": "**Step 1 \u2014 set up the Lagrangian.** As before, add $\\lambda$ times the constraint (written so it equals zero):\n$$\\mathcal{L} = LK+30+\\lambda(48-12L-6K)$$\n\n**Step 2 \u2014 take the FOCs** by differentiating w.r.t. $L$, $K$, and $\\lambda$, each set to zero:\n$$\\mathcal{L}_L = K-12\\lambda = 0 \\quad\\Rightarrow\\quad K=12\\lambda \\quad\\text{...(i)}$$\n$$\\mathcal{L}_K = L-6\\lambda = 0 \\quad\\Rightarrow\\quad L=6\\lambda \\quad\\text{...(ii)}$$\n$$\\mathcal{L}_\\lambda = 48-12L-6K = 0 \\quad\\text{...(iii)}$$\n\n**Step 3 \u2014 substitute (i) and (ii) into (iii)** to reduce everything to one equation in $\\lambda$ alone:\n$$48 - 12(6\\lambda) - 6(12\\lambda) = 0 \\implies 48-72\\lambda-72\\lambda=0 \\implies 48-144\\lambda=0$$\n\n**Step 4 \u2014 solve for $\\lambda$**:\n$$144\\lambda = 48 \\implies \\lambda = \\frac{48}{144} = \\frac{1}{3}$$\n\n**Step 5 \u2014 back-substitute to find $L$ and $K$.** From (ii): $L=6\\times\\frac13=2$. From (i): $K=12\\times\\frac13=4$.\n\n**Step 6 \u2014 find the maximum output** by plugging $L=2,K=4$ into the *original* objective function:\n$$Q = LK+30 = (2)(4)+30 = 8+30 = 38$$\n\n**Step 7 \u2014 interpret the multiplier $\\lambda$ economically.** The Lagrange multiplier has a well-known interpretation: it represents the **shadow price** of the constraint \u2014 approximately how much the optimal (maximum) value of the objective would increase if the constraint were relaxed by one unit. Here, $\\lambda=\\frac13$ means: if the resource limit in the constraint $12L+6K=48$ were loosened by 1 unit (e.g. the right-hand side became 49 instead of 48), the maximum achievable output $Q$ would rise by approximately $\\frac13$ of a unit. This is directly useful for decision-making: it quantifies how valuable it would be to relax that particular constraint."}, {"cat": "Optimization: Extrema & Lagrangian", "q": "Distinguish clearly between constrained and unconstrained optimization.", "hint": "Does the choice variable face any restriction/side condition or not?", "ans": "**Unconstrained optimization** is the \"plain\" version of optimization: you're maximizing or minimizing a function $y=f(x)$ (or $f(x_1,x_2,\\ldots)$ for several variables) with **no restrictions whatsoever** on the values the choice variable(s) can take \u2014 they can be anything in their natural domain. You solve it using the ordinary first-order condition, $f'(x)=0$, and the second-derivative test, exactly as covered in the earlier extrema questions.\n\n**Constrained optimization** involves maximizing or minimizing an objective function while the choice variables must simultaneously **satisfy one or more side conditions (constraints)** \u2014 equations (or sometimes inequalities) that limit the feasible combinations of the variables. A classic economic example: maximizing output $Q=f(L,K)$ subject to a fixed budget constraint like $wL+rK=C$ (you can't spend more than your budget allows). This type of problem is typically solved using either the **substitution method** (solve the constraint for one variable and plug it into the objective, reducing it to an unconstrained problem) or the **Lagrangian multiplier method** (introduce a new variable $\\lambda$ and build an augmented function, as shown in the examples above).\n\n**In one sentence**: unconstrained optimization asks \"what's the best choice with total freedom?\", while constrained optimization asks \"what's the best choice given that I'm restricted to a particular feasible set?\" "}, {"cat": "Optimization: Extrema & Lagrangian", "q": "State the necessary and sufficient conditions for relative optima of $y=f(x)$.", "hint": "First-order = necessary; second-order = sufficient.", "ans": "**Why we separate 'necessary' from 'sufficient' conditions.** A *necessary* condition is something that *must* be true at an extremum, but satisfying it alone doesn't guarantee you actually have one. A *sufficient* condition, if satisfied, *guarantees* you have an extremum (and tells you which type).\n\n**Necessary condition \u2014 the First-Order Condition (FOC).** At any relative maximum or minimum, the tangent to the curve must be perfectly horizontal \u2014 the instantaneous rate of change is zero:\n$$f'(x_0) = 0$$\nThis condition alone is necessary but not sufficient: it also holds at points that are neither a max nor a min (e.g. a point where the curve momentarily flattens but continues in the same direction, like $y=x^3$ at $x=0$).\n\n**Sufficient condition \u2014 the Second-Order Condition (SOC).** To confirm and classify an actual extremum, examine the second derivative at the critical point:\n- If $f''(x_0)<0$: **relative maximum** (curve is concave down there).\n- If $f''(x_0)>0$: **relative minimum** (curve is concave up there).\n- If $f''(x_0)=0$: the second-derivative test is **inconclusive** \u2014 you must investigate further, e.g. by checking the sign of $f'(x)$ just before and after $x_0$, or examining higher-order derivatives.\n\n**Together**, the FOC narrows down the candidate points, and the SOC confirms and classifies which (if any) are genuine extrema."}, {"cat": "Optimization: Extrema & Lagrangian", "q": "Use the Lagrangean method to find the stationary value of $Z=xy+2x$ subject to $4x+2y=60$.", "hint": "Form $\\mathcal{L}=xy+2x+\\lambda(60-4x-2y)$ and solve the FOCs simultaneously.", "ans": "**Step 1 \u2014 set up the Lagrangian**, combining the objective function with $\\lambda$ times the constraint (rearranged to equal zero):\n$$\\mathcal{L} = xy+2x+\\lambda(60-4x-2y)$$\n\n**Step 2 \u2014 find the FOCs** by taking partial derivatives w.r.t. $x$, $y$, and $\\lambda$, setting each to zero.\n\nWith respect to $x$ (remember $xy$ differentiated w.r.t. $x$ treats $y$ as constant, giving $y$; and $2x$ gives $2$; and $-4\\lambda x$ gives $-4\\lambda$):\n$$\\mathcal{L}_x = y+2-4\\lambda = 0 \\quad\\text{...(i)}$$\n\nWith respect to $y$ (here $xy$ differentiated w.r.t. $y$ gives $x$; $2x$ has no $y$ so contributes 0; and $-2\\lambda y$ gives $-2\\lambda$):\n$$\\mathcal{L}_y = x-2\\lambda = 0 \\quad\\Rightarrow\\quad x=2\\lambda \\quad\\text{...(ii)}$$\n\nWith respect to $\\lambda$ (this simply returns the constraint):\n$$\\mathcal{L}_\\lambda = 60-4x-2y=0 \\quad\\text{...(iii)}$$\n\n**Step 3 \u2014 solve the system.** From (i): rearranging, $y=4\\lambda-2$. From (ii): $x=2\\lambda$.\n\n**Step 4 \u2014 substitute both $x$ and $y$ (in terms of $\\lambda$) into the constraint (iii)** to solve for $\\lambda$ alone:\n$$60 - 4(2\\lambda) - 2(4\\lambda-2) = 0$$\n$$60 - 8\\lambda - 8\\lambda + 4 = 0$$\n$$64 - 16\\lambda = 0 \\implies \\lambda = 4$$\n\n**Step 5 \u2014 back-substitute to find $x$ and $y$.** From (ii): $x=2(4)=8$. From the rearranged (i): $y=4(4)-2=14$.\n\n**Step 6 \u2014 find the stationary value of $Z$** by substituting $x=8, y=14$ into the *original* objective function:\n$$Z = xy+2x = (8)(14)+2(8) = 112+16 = 128$$\n\n**Final answer**: the stationary point is at $(x,y)=(8,14)$, with stationary value $Z=128$."}, {"cat": "Optimization: Extrema & Lagrangian", "q": "Given $TR(q)=24q-3q^2$ and $TC(q)=100+4q+2q^2$: find the profit-maximizing output level, and verify it is actually a maximum.", "hint": "Profit $\\pi=TR-TC$. Maximize: set $\\pi'=0$, confirm with $\\pi''<0$.", "ans": "**The economic setup**: profit ($\\pi$) is defined as total revenue minus total cost: $\\pi(q) = TR(q) - TC(q)$. To find the profit-*maximizing* level of output, we treat $\\pi(q)$ as an ordinary function of $q$ and apply the standard unconstrained-optimization method: first-order condition to find the candidate, second-order condition to confirm it's a maximum.\n\n**Step 1 \u2014 construct the profit function.**\n$$\\pi(q) = TR(q)-TC(q) = (24q-3q^2) - (100+4q+2q^2)$$\n\nCarefully distribute the minus sign across every term in $TC(q)$:\n$$\\pi(q) = 24q-3q^2-100-4q-2q^2$$\n\n**Step 2 \u2014 collect like terms** (combine the $q$ terms together, and the $q^2$ terms together):\n$$\\pi(q) = (24q-4q) + (-3q^2-2q^2) - 100 = 20q - 5q^2 - 100$$\n\nWritten in standard order: $\\pi(q) = -5q^2+20q-100$.\n\n**Step 3 \u2014 find the first derivative** (this is the marginal profit, $\\frac{d\\pi}{dq}$):\n$$\\pi'(q) = -10q+20$$\n\n**Step 4 \u2014 set $\\pi'(q)=0$ and solve** for the candidate profit-maximizing output:\n$$-10q+20=0 \\implies 10q=20 \\implies q=2$$\n\n**Step 5 \u2014 find the second derivative** to check it's genuinely a maximum, not a minimum:\n$$\\pi''(q) = -10$$\n\n**Step 6 \u2014 apply the second-derivative test.** Since $\\pi''=-10$ is negative (and constant, so this holds everywhere), the profit function is concave down at $q=2$, confirming it is indeed a **maximum**.\n\n**Step 7 \u2014 calculate the maximum profit** by substituting $q=2$ into the profit function:\n$$\\pi(2) = -5(2)^2+20(2)-100 = -5(4)+40-100 = -20+40-100 = -80$$\n\n**Interpretation**: the profit-maximizing output is $q=2$, but at that output the firm still makes a **loss of 80** (since the fixed costs of 100 outweigh what the firm can earn even at the best output level). This is a common and important lesson: \"maximizing profit\" doesn't always mean earning a *positive* profit \u2014 sometimes it just means *minimizing the loss*."}, {"cat": "Optimization: Extrema & Lagrangian", "q": "Using the Lagrangean multiplier method, find the input combination and maximum output for $z=x^2+3xy-5y^2$ subject to $2x+3y=6$, and establish whether it is a maximum or minimum.", "hint": "Set up the Lagrangian, get FOCs, solve, then check the bordered Hessian or reasoning about the constraint.", "ans": "**Step 1 \u2014 set up the Lagrangian**:\n$$\\mathcal{L} = x^2+3xy-5y^2 + \\lambda(6-2x-3y)$$\n\n**Step 2 \u2014 find the FOCs.**\n$$\\mathcal{L}_x = 2x+3y-2\\lambda = 0 \\quad\\text{...(i)}$$\n$$\\mathcal{L}_y = 3x-10y-3\\lambda = 0 \\quad\\text{...(ii)}$$\n$$\\mathcal{L}_\\lambda = 6-2x-3y = 0 \\quad\\text{...(iii), the constraint itself}$$\n\n**Step 3 \u2014 use the constraint to simplify (i).** Notice that equation (i) contains exactly $2x+3y$, and the constraint (iii) tells us directly that $2x+3y=6$. Substitute this straight into (i):\n$$6 - 2\\lambda = 0 \\implies \\lambda = 3$$\n\n**Step 4 \u2014 substitute $\\lambda=3$ into equation (ii)** to relate $x$ and $y$:\n$$3x-10y-3(3)=0 \\implies 3x-10y-9=0 \\implies 3x-10y=9 \\quad\\text{...(iv)}$$\n\n**Step 5 \u2014 use the constraint (iii) to express $x$ in terms of $y$**: from $2x+3y=6$, we get $x=\\dfrac{6-3y}{2}$.\n\n**Step 6 \u2014 substitute this into (iv)** and solve for $y$:\n$$3\\left(\\frac{6-3y}{2}\\right) - 10y = 9$$\n\nMultiply out the fraction: $\\dfrac{18-9y}{2}-10y=9$. Multiply every term by 2 to clear the denominator:\n$$18-9y-20y = 18$$\n$$18-29y=18 \\implies -29y=0 \\implies y=0$$\n\n**Step 7 \u2014 back-substitute to find $x$**: $x=\\dfrac{6-3(0)}{2}=\\dfrac{6}{2}=3$.\n\n**Result so far**: $(x,y)=(3,0)$, $\\lambda=3$.\n\n**Step 8 \u2014 build the Bordered Hessian to classify the point.** We need: $g_x=2$, $g_y=3$ (partials of the constraint $g=2x+3y$); and the second partials of $\\mathcal{L}$: $\\mathcal{L}_{xx}=2$, $\\mathcal{L}_{xy}=3$, $\\mathcal{L}_{yy}=-10$.\n$$H = \\begin{bmatrix}0&2&3\\\\2&2&3\\\\3&3&-10\\end{bmatrix}$$\n\n**Step 9 \u2014 compute the determinant**, expanding along the first row:\n$$|H| = 0\\begin{vmatrix}2&3\\\\3&-10\\end{vmatrix} - 2\\begin{vmatrix}2&3\\\\3&-10\\end{vmatrix} + 3\\begin{vmatrix}2&2\\\\3&3\\end{vmatrix}$$\n$$= 0 - 2\\big[2(-10)-3(3)\\big] + 3\\big[2(3)-2(3)\\big] = -2(-20-9)+3(6-6) = -2(-29)+3(0) = 58$$\n\n**Step 10 \u2014 apply the decision rule.** For 2 choice variables and 1 constraint, $|H|>0$ indicates a **constrained maximum**. Since $|H|=58>0$, the point $(3,0)$ is a **constrained maximum**.\n\n**Step 11 \u2014 compute the maximum value**: $z=x^2+3xy-5y^2 = 9+0-0=9$."}, {"cat": "Matrices & Determinants", "q": "With appropriate examples, distinguish between symmetric and skew-symmetric matrices.", "hint": "Compare a matrix to its transpose: does it equal it, or equal its negative?", "ans": "**First recall what a transpose is.** The **transpose** of a matrix $A$, written $A^T$ (or $A'$), is formed by flipping the matrix over its main diagonal \u2014 every row becomes a column, and every column becomes a row. So the element that was in row $i$, column $j$ moves to row $j$, column $i$.\n\n**Symmetric matrix.** A square matrix $A$ is **symmetric** if it is completely unchanged by transposing: $A^T=A$. In practical terms, this means the entries mirror each other across the main diagonal \u2014 the entry in position $(i,j)$ always equals the entry in position $(j,i)$. Example:\n$$A = \\begin{bmatrix}1&2\\\\2&3\\end{bmatrix}$$\nHere the off-diagonal entries (both equal to 2) mirror each other, so $A^T=A$.\n\n**Skew-symmetric matrix.** A square matrix $A$ is **skew-symmetric** if transposing it gives you the *negative* of the original: $A^T=-A$. This means the entry in position $(i,j)$ must be the exact negative of the entry in position $(j,i)$. Example:\n$$A = \\begin{bmatrix}0&2\\\\-2&0\\end{bmatrix}$$\nHere $A^T = \\begin{bmatrix}0&-2\\\\2&0\\end{bmatrix} = -A$.\n\n**An important consequence worth noting**: in a skew-symmetric matrix, every diagonal entry *must* be zero. Why? Because the condition $a_{ij}=-a_{ji}$ applied to a diagonal entry (where $i=j$) gives $a_{ii}=-a_{ii}$, which is only possible if $a_{ii}=0$."}, {"cat": "Matrices & Determinants", "q": "Given $\\begin{bmatrix}x+1&1\\\\-1&x-1\\end{bmatrix}=4$, find the value of $x$.", "hint": "Expand the 2\u00d72 determinant, set it equal to 4, and solve the resulting equation.", "ans": "**Recall the formula for a 2\u00d72 determinant.** For any $2\\times 2$ matrix $\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}$, the determinant is calculated as $ad-bc$ \u2014 multiply along the main diagonal (top-left to bottom-right), then subtract the product of the other diagonal (top-right to bottom-left).\n\n**Step 1 \u2014 identify $a,b,c,d$ in our matrix**: $a=x+1$, $b=1$, $c=-1$, $d=x-1$.\n\n**Step 2 \u2014 apply the determinant formula**:\n$$\\det = (x+1)(x-1) - (1)(-1)$$\n\n**Step 3 \u2014 expand $(x+1)(x-1)$** using the \"difference of squares\" pattern: $(x+1)(x-1)=x^2-1$ (recall $(a+b)(a-b)=a^2-b^2$, here with $a=x,b=1$).\n\n**Step 4 \u2014 handle the second term.** $(1)(-1)=-1$, so subtracting it means $-(-1)=+1$.\n\n**Step 5 \u2014 combine**: $\\det = x^2-1+1 = x^2$.\n\n**Step 6 \u2014 set the determinant equal to the given value, 4, and solve for $x$**:\n$$x^2 = 4$$\n\nTaking the square root of both sides (remembering both a positive and negative root are valid solutions):\n$$x = \\pm2$$\n\n**Final answer**: $x=2$ or $x=-2$."}, {"cat": "Matrices & Determinants", "q": "Given $A=\\begin{bmatrix}0&3x+2\\\\x^2&0\\end{bmatrix}$, if $|A|=0$, find $x$.", "hint": "Expand the determinant and solve.", "ans": "**Step 1 \u2014 apply the 2\u00d72 determinant formula**, $ad-bc$, with $a=0$, $b=3x+2$, $c=x^2$, $d=0$:\n$$|A| = (0)(0) - (3x+2)(x^2) = 0 - x^2(3x+2) = -x^2(3x+2)$$\n\n**Step 2 \u2014 set the determinant equal to zero** (as given) and solve:\n$$-x^2(3x+2) = 0$$\n\n**Step 3 \u2014 use the zero-product rule.** A product of factors equals zero only if at least one of the factors itself is zero. We have two factors here: $-x^2$ and $(3x+2)$ (the overall minus sign doesn't affect where the expression is zero).\n\nSetting the first factor to zero: $x^2=0 \\implies x=0$.\n\nSetting the second factor to zero: $3x+2=0 \\implies 3x=-2 \\implies x=-\\dfrac{2}{3}$.\n\n**Final answer**: $x=0$ or $x=-\\dfrac{2}{3}$."}, {"cat": "Matrices & Determinants", "q": "If $A=\\begin{bmatrix}4&1\\\\2&3\\end{bmatrix}$, show that $AA^{-1}=A^{-1}A=I$.", "hint": "Find $A^{-1}=\\frac{1}{|A|}\\text{adj}(A)$, then multiply both ways.", "ans": "**The formula for a 2\u00d72 inverse.** For $A=\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}$, the inverse is given by:\n$$A^{-1} = \\frac{1}{ad-bc}\\begin{bmatrix}d&-b\\\\-c&a\\end{bmatrix}$$\nIn words: swap the two diagonal elements ($a$ and $d$ trade places), flip the sign of the two off-diagonal elements, and divide everything by the determinant $ad-bc$.\n\n**Step 1 \u2014 compute the determinant of $A$.** With $a=4,b=1,c=2,d=3$: $|A| = ad-bc = (4)(3)-(1)(2) = 12-2=10$.\n\n**Step 2 \u2014 apply the inverse formula**, swapping $4$ and $3$, flipping signs on $1$ and $2$, dividing by 10:\n$$A^{-1} = \\frac{1}{10}\\begin{bmatrix}3&-1\\\\-2&4\\end{bmatrix}$$\n\n**Step 3 \u2014 verify $AA^{-1}=I$** by multiplying $A$ and $A^{-1}$ directly (using standard row-by-column matrix multiplication):\n$$AA^{-1} = \\frac{1}{10}\\begin{bmatrix}4&1\\\\2&3\\end{bmatrix}\\begin{bmatrix}3&-1\\\\-2&4\\end{bmatrix}$$\n\nCompute each entry of the product matrix individually (row of the first matrix \"dotted\" with column of the second):\n- Row 1, Col 1: $(4)(3)+(1)(-2) = 12-2=10$.\n- Row 1, Col 2: $(4)(-1)+(1)(4) = -4+4=0$.\n- Row 2, Col 1: $(2)(3)+(3)(-2) = 6-6=0$.\n- Row 2, Col 2: $(2)(-1)+(3)(4) = -2+12=10$.\n\nSo the raw product (before dividing by 10) is $\\begin{bmatrix}10&0\\\\0&10\\end{bmatrix}$. Dividing every entry by 10:\n$$AA^{-1} = \\begin{bmatrix}1&0\\\\0&1\\end{bmatrix} = I$$\n\n**Step 4 \u2014 verify $A^{-1}A=I$** the same way (multiplying in the opposite order):\n$$A^{-1}A = \\frac{1}{10}\\begin{bmatrix}3&-1\\\\-2&4\\end{bmatrix}\\begin{bmatrix}4&1\\\\2&3\\end{bmatrix}$$\n- Row 1, Col 1: $(3)(4)+(-1)(2)=12-2=10$.\n- Row 1, Col 2: $(3)(1)+(-1)(3)=3-3=0$.\n- Row 2, Col 1: $(-2)(4)+(4)(2)=-8+8=0$.\n- Row 2, Col 2: $(-2)(1)+(4)(3)=-2+12=10$.\n\nAgain dividing by 10 gives $\\begin{bmatrix}1&0\\\\0&1\\end{bmatrix}=I$.\n\n**Conclusion**: both $AA^{-1}=I$ and $A^{-1}A=I$ are confirmed \u2014 this is exactly what defines $A^{-1}$ as the true inverse of $A$."}, {"cat": "Matrices & Determinants", "q": "Given $A=\\begin{bmatrix}1&2&4\\\\2&3&0\\end{bmatrix}$, $B=\\begin{bmatrix}5&7\\\\2&1\\\\1&3\\end{bmatrix}$, $C=\\begin{bmatrix}1&4\\\\2&5\\\\3&6\\end{bmatrix}$, show that $A(B+C)=AB+AC$.", "hint": "Compute $B+C$ first, multiply by $A$; separately compute $AB$ and $AC$ and add; compare.", "ans": "This question verifies the **distributive law of matrix multiplication over addition** \u2014 a property that carries over from ordinary arithmetic. We'll compute both sides of the equation independently and check they match.\n\n**Step 1 \u2014 compute $B+C$.** Matrix addition simply adds corresponding entries (both matrices must be the same size, which they are here \u2014 both $3\\times2$):\n$$B+C = \\begin{bmatrix}5+1&7+4\\\\2+2&1+5\\\\1+3&3+6\\end{bmatrix} = \\begin{bmatrix}6&11\\\\4&6\\\\4&9\\end{bmatrix}$$\n\n**Step 2 \u2014 compute $A(B+C)$.** $A$ is $2\\times3$ and $(B+C)$ is $3\\times2$, so the product is $2\\times2$. Each entry of the result is found by \"dotting\" a row of $A$ with a column of $(B+C)$:\n$$A(B+C) = \\begin{bmatrix}1&2&4\\\\2&3&0\\end{bmatrix}\\begin{bmatrix}6&11\\\\4&6\\\\4&9\\end{bmatrix}$$\n- Row 1, Col 1: $1(6)+2(4)+4(4) = 6+8+16=30$.\n- Row 1, Col 2: $1(11)+2(6)+4(9) = 11+12+36=59$.\n- Row 2, Col 1: $2(6)+3(4)+0(4) = 12+12+0=24$.\n- Row 2, Col 2: $2(11)+3(6)+0(9) = 22+18+0=40$.\n$$A(B+C) = \\begin{bmatrix}30&59\\\\24&40\\end{bmatrix}$$\n\n**Step 3 \u2014 compute $AB$ separately.**\n$$AB = \\begin{bmatrix}1&2&4\\\\2&3&0\\end{bmatrix}\\begin{bmatrix}5&7\\\\2&1\\\\1&3\\end{bmatrix}$$\n- Row 1, Col 1: $1(5)+2(2)+4(1)=5+4+4=13$.\n- Row 1, Col 2: $1(7)+2(1)+4(3)=7+2+12=21$.\n- Row 2, Col 1: $2(5)+3(2)+0(1)=10+6+0=16$.\n- Row 2, Col 2: $2(7)+3(1)+0(3)=14+3+0=17$.\n$$AB = \\begin{bmatrix}13&21\\\\16&17\\end{bmatrix}$$\n\n**Step 4 \u2014 compute $AC$ separately.**\n$$AC = \\begin{bmatrix}1&2&4\\\\2&3&0\\end{bmatrix}\\begin{bmatrix}1&4\\\\2&5\\\\3&6\\end{bmatrix}$$\n- Row 1, Col 1: $1(1)+2(2)+4(3)=1+4+12=17$.\n- Row 1, Col 2: $1(4)+2(5)+4(6)=4+10+24=38$.\n- Row 2, Col 1: $2(1)+3(2)+0(3)=2+6+0=8$.\n- Row 2, Col 2: $2(4)+3(5)+0(6)=8+15+0=23$.\n$$AC = \\begin{bmatrix}17&38\\\\8&23\\end{bmatrix}$$\n\n**Step 5 \u2014 add $AB+AC$** entry by entry:\n$$AB+AC = \\begin{bmatrix}13+17&21+38\\\\16+8&17+23\\end{bmatrix} = \\begin{bmatrix}30&59\\\\24&40\\end{bmatrix}$$\n\n**Comparison**: $A(B+C) = \\begin{bmatrix}30&59\\\\24&40\\end{bmatrix}$ and $AB+AC=\\begin{bmatrix}30&59\\\\24&40\\end{bmatrix}$ \u2014 **they match exactly, verifying the distributive law.**"}, {"cat": "Matrices & Determinants", "q": "Given the system $-2x-y=-4$ and $6x+2y=14$: find $A^{-1}$ and, if it exists, obtain $x$ and $y$.", "hint": "Write in matrix form $AX=B$, invert $A$, and compute $X=A^{-1}B$.", "ans": "**Why matrix inversion solves systems of equations.** Any linear system can be written compactly as $AX=B$, where $A$ is the matrix of coefficients, $X$ is the column of unknowns, and $B$ is the column of constants on the right-hand side. If $A^{-1}$ exists, we can solve for $X$ directly by multiplying both sides on the left by $A^{-1}$: $A^{-1}AX = A^{-1}B$, and since $A^{-1}A=I$ (the identity, which leaves $X$ unchanged), we get $X=A^{-1}B$.\n\n**Step 1 \u2014 write the system in matrix form.** From $-2x-y=-4$ and $6x+2y=14$, extract the coefficients:\n$$A = \\begin{bmatrix}-2&-1\\\\6&2\\end{bmatrix}, \\qquad X=\\begin{bmatrix}x\\\\y\\end{bmatrix}, \\qquad B=\\begin{bmatrix}-4\\\\14\\end{bmatrix}$$\n\n**Step 2 \u2014 check whether $A^{-1}$ exists, by computing the determinant.** Using $ad-bc$ with $a=-2,b=-1,c=6,d=2$:\n$$|A| = (-2)(2) - (-1)(6) = -4-(-6) = -4+6 = 2$$\nSince $|A|=2\\neq0$, **the inverse exists** (a zero determinant would mean no unique solution \u2014 the system would be either inconsistent or have infinitely many solutions).\n\n**Step 3 \u2014 find $A^{-1}$** using the 2\u00d72 inverse formula (swap the diagonal, flip signs on the off-diagonal, divide by the determinant):\n$$A^{-1} = \\frac{1}{2}\\begin{bmatrix}2&1\\\\-6&-2\\end{bmatrix} = \\begin{bmatrix}1&0.5\\\\-3&-1\\end{bmatrix}$$\n\n**Step 4 \u2014 compute $X=A^{-1}B$**:\n$$X = \\begin{bmatrix}1&0.5\\\\-3&-1\\end{bmatrix}\\begin{bmatrix}-4\\\\14\\end{bmatrix}$$\n- First entry ($x$): $(1)(-4)+(0.5)(14) = -4+7=3$.\n- Second entry ($y$): $(-3)(-4)+(-1)(14) = 12-14=-2$.\n\nSo $x=3$, $y=-2$.\n\n**Step 5 \u2014 always check your answer** by substituting back into the *original* equations. Equation 1: $-2(3)-(-2) = -6+2=-4$ \u2713 (matches the right-hand side). Equation 2: $6(3)+2(-2)=18-4=14$ \u2713. Both check out.\n\n**Final answer**: $A^{-1}=\\begin{bmatrix}1&0.5\\\\-3&-1\\end{bmatrix}$, and the solution is $x=3$, $y=-2$."}, {"cat": "Matrices & Determinants", "q": "Given $A=\\begin{bmatrix}7&2&6\\\\5&4&8\\\\3&1&9\\end{bmatrix}$ and $C=\\begin{bmatrix}11\\\\4\\\\13\\end{bmatrix}$: (i) determine whether $AC$ is conformable, (ii) obtain $AC$.", "hint": "For $AC$ to exist, the number of columns of $A$ must equal the number of rows of $C$.", "ans": "**The conformability rule for matrix multiplication.** Two matrices can be multiplied, $M\\times N$, only if the number of *columns* of $M$ equals the number of *rows* of $N$. If this holds, the resulting product has dimensions: (rows of $M$) \u00d7 (columns of $N$).\n\n**Step 1 \u2014 identify the dimensions.** $A$ is a $3\\times3$ matrix (3 rows, 3 columns). $C$ is a $3\\times1$ matrix (3 rows, 1 column \u2014 this is called a \"column vector\").\n\n**Step 2 \u2014 check conformability.** Columns of $A$ = 3. Rows of $C$ = 3. These match! **So $AC$ is conformable**, and the resulting matrix will have dimensions (rows of $A$) \u00d7 (columns of $C$) = $3\\times1$.\n\n**Step 3 \u2014 compute $AC$.** Each entry of the resulting $3\\times1$ matrix is found by \"dotting\" each *row* of $A$ with the single column of $C$ (multiply corresponding entries and sum):\n\nRow 1 of $A$ with column of $C$: $7(11)+2(4)+6(13) = 77+8+78 = 163$.\n\nRow 2 of $A$ with column of $C$: $5(11)+4(4)+8(13) = 55+16+104 = 175$.\n\nRow 3 of $A$ with column of $C$: $3(11)+1(4)+9(13) = 33+4+117 = 154$.\n\n**Final answer**:\n$$AC = \\begin{bmatrix}163\\\\175\\\\154\\end{bmatrix}$$"}, {"cat": "Matrices & Determinants", "q": "Differentiate between identity matrix and diagonal matrix, with examples.", "hint": "An identity matrix is a special case of a diagonal matrix.", "ans": "**Diagonal matrix.** A square matrix is called **diagonal** if every entry *off* the main diagonal (i.e. every entry where the row number doesn't equal the column number) is zero. The entries *on* the main diagonal can be any numbers at all \u2014 they don't have to be equal to each other, and they can even be zero. Example:\n$$D = \\begin{bmatrix}5&0\\\\0&3\\end{bmatrix}$$\nHere the diagonal entries are 5 and 3 (different from each other), and everything off the diagonal is 0.\n\n**Identity matrix.** An **identity matrix**, usually written $I$, is a *special case* of a diagonal matrix where every single diagonal entry equals exactly 1 (in addition to all off-diagonal entries still being zero). Example:\n$$I = \\begin{bmatrix}1&0\\\\0&1\\end{bmatrix}$$\n\n**The relationship between them**: every identity matrix qualifies as a diagonal matrix (since it satisfies \"all off-diagonal entries are zero\"), but not every diagonal matrix qualifies as an identity matrix (since a diagonal matrix's diagonal entries don't all have to be 1 \u2014 like the $D$ example above). The identity matrix plays the same role in matrix multiplication that the number 1 plays in ordinary multiplication: multiplying any matrix $A$ by $I$ (in either order, if conformable) leaves $A$ completely unchanged: $AI=IA=A$."}, {"cat": "Matrices & Determinants", "q": "The two-sector model $Y=C+I_0$ and $C=aY+b$: express in matrix form $AX=B$, find $|A|$, and solve for equilibrium $Y$ and $C$ using Cramer's rule.", "hint": "Rearrange both equations so all variables are on the left: $Y-C=I_0$ and $-aY+C=b$.", "ans": "**Step 1 \u2014 rearrange both equations so that the unknowns ($Y$ and $C$) are all on the left-hand side**, matching a standard linear-system layout. Starting equations: $Y=C+I_0$ and $C=aY+b$.\n\nFrom $Y=C+I_0$: move $C$ to the left: $Y-C=I_0$.\n\nFrom $C=aY+b$: move $aY$ to the left: $-aY+C=b$.\n\n**Step 2 \u2014 write the system in matrix form $AX=B$**, reading the coefficients of $Y$ and $C$ from each equation (in that consistent order):\n$$\\begin{bmatrix}1&-1\\\\-a&1\\end{bmatrix}\\begin{bmatrix}Y\\\\C\\end{bmatrix} = \\begin{bmatrix}I_0\\\\b\\end{bmatrix}$$\n\n**Step 3 \u2014 find the determinant** $|A|$ using $ad-bc$ with $a=1,b=-1,c=-a,d=1$ (careful \u2014 here the letter $a$ appears both as a matrix entry label and as the economic parameter; keep them straight):\n$$|A| = (1)(1) - (-1)(-a) = 1-a$$\n\n**Step 4 \u2014 apply Cramer's rule.** Recall that Cramer's rule solves for each unknown by replacing the *corresponding column* of $A$ with the constants vector $B$, taking that new determinant, and dividing by $|A|$.\n\n**Solving for $Y$**: replace the first column (the $Y$-column) with $B=\\begin{bmatrix}I_0\\\\b\\end{bmatrix}$:\n$$Y = \\frac{\\begin{vmatrix}I_0&-1\\\\b&1\\end{vmatrix}}{|A|} = \\frac{I_0(1)-(-1)(b)}{1-a} = \\frac{I_0+b}{1-a}$$\n\n**Solving for $C$**: replace the second column (the $C$-column) with $B$:\n$$C = \\frac{\\begin{vmatrix}1&I_0\\\\-a&b\\end{vmatrix}}{|A|} = \\frac{(1)(b)-I_0(-a)}{1-a} = \\frac{b+aI_0}{1-a}$$\n\n**Final answer**: equilibrium income $Y^*=\\dfrac{I_0+b}{1-a}$, and equilibrium consumption $C^*=\\dfrac{b+aI_0}{1-a}$. These are exactly the standard Keynesian-cross equilibrium expressions, where $\\dfrac{1}{1-a}$ is recognisable as the familiar **income multiplier**."}, {"cat": "Matrices & Determinants", "q": "Use Cramer's rule to solve: $6x_1+2x_2=1$, $8x_1+x_2=3$.", "hint": "Find $|A|$, then replace each column with the constants vector in turn to find $|A_1|$ and $|A_2|$.", "ans": "**Cramer's rule, explained.** For a system $AX=B$, Cramer's rule finds each unknown $x_i$ by taking the ratio $\\dfrac{|A_i|}{|A|}$, where $|A|$ is the determinant of the original coefficient matrix, and $|A_i|$ is the determinant you get by replacing the $i$-th column of $A$ with the constants column $B$ (leaving every other column unchanged).\n\n**Step 1 \u2014 write the coefficient matrix and find $|A|$.**\n$$A = \\begin{bmatrix}6&2\\\\8&1\\end{bmatrix}$$\n$$|A| = (6)(1)-(2)(8) = 6-16=-10$$\n\n**Step 2 \u2014 find $|A_1|$**, by replacing the *first* column (the $x_1$ coefficients) with the constants column $\\begin{bmatrix}1\\\\3\\end{bmatrix}$, keeping the second column as it was:\n$$A_1 = \\begin{bmatrix}1&2\\\\3&1\\end{bmatrix} \\qquad |A_1| = (1)(1)-(2)(3) = 1-6=-5$$\n\n**Step 3 \u2014 find $|A_2|$**, by replacing the *second* column (the $x_2$ coefficients) with the constants column:\n$$A_2 = \\begin{bmatrix}6&1\\\\8&3\\end{bmatrix} \\qquad |A_2| = (6)(3)-(1)(8) = 18-8=10$$\n\n**Step 4 \u2014 apply Cramer's rule for each variable**:\n$$x_1 = \\frac{|A_1|}{|A|} = \\frac{-5}{-10} = 0.5$$\n$$x_2 = \\frac{|A_2|}{|A|} = \\frac{10}{-10} = -1$$\n\n**Final answer**: $x_1=0.5$, $x_2=-1$."}, {"cat": "Matrices & Determinants", "q": "If $A=\\begin{bmatrix}1&4&2\\\\2&8&16\\\\7&6&1\\end{bmatrix}$ and $B=\\begin{bmatrix}0&1&0\\\\1&0&0\\\\0&0&1\\end{bmatrix}$, show that $|BA|=|B||A|$.", "hint": "You could multiply $BA$ first and take its determinant, or compute $|A|$ and $|B|$ separately and multiply \u2014 both should match. Note $B$ is just a row-swap matrix.", "ans": "**Key property being tested here**: for square matrices of the same size, the determinant of a product always equals the product of the individual determinants \u2014 $|BA|=|B||A|$. Let's verify this by computing both sides completely independently and checking they agree.\n\n**Step 1 \u2014 find $|B|$.** Notice that $B$ has a special structure: it's the identity matrix with its first two rows swapped. A **row-swap** of an identity matrix always has determinant $-1$ (each row/column swap flips the sign of the determinant, and the plain identity has determinant $+1$). So $|B|=-1$.\n\n**Step 2 \u2014 find $|A|$** by expanding along the first row, using cofactor expansion. Recall for a $3\\times3$ matrix expansion along row 1: $|A| = a_{11}M_{11} - a_{12}M_{12} + a_{13}M_{13}$, where each $M$ is the determinant of the $2\\times2$ matrix left after deleting that entry's row and column.\n$$|A| = 1\\begin{vmatrix}8&16\\\\6&1\\end{vmatrix} - 4\\begin{vmatrix}2&16\\\\7&1\\end{vmatrix} + 2\\begin{vmatrix}2&8\\\\7&6\\end{vmatrix}$$\nCompute each $2\\times2$ determinant: $\\begin{vmatrix}8&16\\\\6&1\\end{vmatrix}=8(1)-16(6)=8-96=-88$. $\\begin{vmatrix}2&16\\\\7&1\\end{vmatrix}=2(1)-16(7)=2-112=-110$. $\\begin{vmatrix}2&8\\\\7&6\\end{vmatrix}=2(6)-8(7)=12-56=-44$.\n\nSubstitute back: $|A| = 1(-88) - 4(-110) + 2(-44) = -88+440-88 = 264$.\n\n**Step 3 \u2014 multiply $|B|\\times|A|$**: $(-1)\\times264 = -264$.\n\n**Step 4 \u2014 now compute $BA$ directly, then take its determinant, as an independent check.** Since $B$ swaps rows 1 and 2 of any matrix it multiplies (this is what row-swap matrices do), $BA$ is simply $A$ with its first two rows swapped:\n$$BA = \\begin{bmatrix}2&8&16\\\\1&4&2\\\\7&6&1\\end{bmatrix}$$\n\n**Step 5 \u2014 compute $|BA|$** by expansion along the first row:\n$$|BA| = 2\\begin{vmatrix}4&2\\\\6&1\\end{vmatrix} - 8\\begin{vmatrix}1&2\\\\7&1\\end{vmatrix} + 16\\begin{vmatrix}1&4\\\\7&6\\end{vmatrix}$$\n$\\begin{vmatrix}4&2\\\\6&1\\end{vmatrix}=4-12=-8$. $\\begin{vmatrix}1&2\\\\7&1\\end{vmatrix}=1-14=-13$. $\\begin{vmatrix}1&4\\\\7&6\\end{vmatrix}=6-28=-22$.\n\n$$|BA| = 2(-8)-8(-13)+16(-22) = -16+104-352 = -264$$\n\n**Comparison**: $|B||A|=-264$ and $|BA|=-264$. **They match exactly \u2014 $|BA|=|B||A|$ is verified.**"}, {"cat": "Matrices & Determinants", "q": "List and give appropriate examples of matrices classified under: (i) relationship between rows and columns, (ii) structure of elements, (iii) derived relationship with itself.", "hint": "Think row/column shape, where the zeros/values sit, and self-multiplication or transpose properties.", "ans": "Matrices can be grouped into families based on three different kinds of criteria \u2014 how many rows vs columns they have, where their zero/non-zero entries sit, and how the matrix relates to a transformed version of itself.\n\n**(i) Classified by the relationship between rows and columns (overall shape):**\n- **Square matrix**: same number of rows as columns, e.g. a $3\\times3$ matrix.\n- **Rectangular matrix**: different number of rows and columns, e.g. a $2\\times4$ matrix.\n- **Row vector**: only one row, e.g. $\\begin{bmatrix}1&2&3\\end{bmatrix}$ (a $1\\times n$ matrix).\n- **Column vector**: only one column, e.g. $\\begin{bmatrix}1\\\\2\\\\3\\end{bmatrix}$ (an $n\\times1$ matrix).\n\n**(ii) Classified by the structure/positioning of elements (where the zeros and non-zeros sit):**\n- **Diagonal matrix**: all off-diagonal entries are zero, e.g. $\\begin{bmatrix}5&0\\\\0&3\\end{bmatrix}$.\n- **Triangular matrix**: all entries either above (lower triangular) or below (upper triangular) the main diagonal are zero, e.g. $\\begin{bmatrix}2&0\\\\5&3\\end{bmatrix}$ (lower triangular).\n- **Null (zero) matrix**: every single entry is zero, e.g. $\\begin{bmatrix}0&0\\\\0&0\\end{bmatrix}$.\n- **Scalar matrix**: a diagonal matrix where all diagonal entries are equal to the *same* number, e.g. $\\begin{bmatrix}4&0\\\\0&4\\end{bmatrix}$.\n\n**(iii) Classified by a derived relationship the matrix has with a transformed version of itself (usually its own transpose or its own product with itself):**\n- **Symmetric matrix**: equals its own transpose, $A^T=A$, e.g. $\\begin{bmatrix}1&2\\\\2&3\\end{bmatrix}$.\n- **Skew-symmetric matrix**: equals the negative of its own transpose, $A^T=-A$, e.g. $\\begin{bmatrix}0&2\\\\-2&0\\end{bmatrix}$.\n- **Idempotent matrix**: multiplying it by itself reproduces itself, $A\\cdot A=A$.\n- **Orthogonal matrix**: its transpose equals its inverse, $AA^T=A^TA=I$."}, {"cat": "Matrices & Determinants", "q": "If $A$ and $B$ are square matrices of the same order, show that $\\text{tr}(A+B)=\\text{tr}\\,A+\\text{tr}\\,B$.", "hint": "The trace is the sum of diagonal entries \u2014 write it out element by element.", "ans": "**What the trace is.** The **trace** of a square matrix, written $\\text{tr}(A)$, is simply the sum of the entries lying on the main diagonal (top-left to bottom-right). For example, if $A=\\begin{bmatrix}3&5\\\\7&9\\end{bmatrix}$, then $\\text{tr}(A)=3+9=12$ \u2014 we ignore all the off-diagonal entries.\n\n**The general proof, using index notation.** Let $A=[a_{ij}]$ mean \"the matrix $A$ whose entry in row $i$, column $j$ is called $a_{ij}$\" \u2014 this is just a compact way to refer to an arbitrary entry without writing out the whole matrix. Similarly let $B=[b_{ij}]$. Both matrices are $n\\times n$ (same order, as given).\n\n**Step 1 \u2014 recall how matrix addition works entry-by-entry.** When you add two matrices, you simply add the corresponding entries: the entry in row $i$, column $j$ of $(A+B)$ is $a_{ij}+b_{ij}$. In particular, this holds for the diagonal entries too (where $i=j$): the $i$-th diagonal entry of $(A+B)$ is $a_{ii}+b_{ii}$.\n\n**Step 2 \u2014 write out the definition of the trace of $(A+B)$**, summing all the diagonal entries we just identified:\n$$\\text{tr}(A+B) = \\sum_{i=1}^{n}\\big(a_{ii}+b_{ii}\\big)$$\n\n**Step 3 \u2014 split the sum.** A basic property of summation is that you can split a sum of two-term expressions into two separate sums:\n$$\\sum_{i=1}^{n}(a_{ii}+b_{ii}) = \\sum_{i=1}^{n}a_{ii} + \\sum_{i=1}^{n}b_{ii}$$\n\n**Step 4 \u2014 recognise each piece.** $\\displaystyle\\sum_{i=1}^n a_{ii}$ is, by definition, exactly $\\text{tr}(A)$ (the sum of $A$'s diagonal entries). Similarly $\\displaystyle\\sum_{i=1}^n b_{ii} = \\text{tr}(B)$.\n\n**Conclusion**: $\\text{tr}(A+B) = \\text{tr}(A)+\\text{tr}(B)$. **Proven.** This shows the trace behaves as a *linear* operation \u2014 it distributes cleanly over matrix addition, exactly the way ordinary addition of numbers does."}, {"cat": "Matrices & Determinants", "q": "What is an orthogonal matrix? Show that $A=\\begin{bmatrix}\\frac{1}{\\sqrt2}&\\frac{1}{\\sqrt2}\\\\-\\frac{1}{\\sqrt2}&\\frac{1}{\\sqrt2}\\end{bmatrix}$ is orthogonal.", "hint": "A matrix is orthogonal if $AA^T=I$. Multiply $A$ by its transpose and check you get the identity.", "ans": "**Definition.** A square matrix $A$ is called **orthogonal** if its transpose is equal to its inverse \u2014 equivalently, if multiplying $A$ by its own transpose (in either order) gives back the identity matrix: $AA^T=A^TA=I$. Geometrically, orthogonal matrices represent pure rotations or reflections \u2014 they preserve lengths and angles when applied to vectors.\n\n**Step 1 \u2014 find the transpose $A^T$.** Recall the transpose swaps rows and columns. Original: $A=\\begin{bmatrix}\\frac{1}{\\sqrt2}&\\frac{1}{\\sqrt2}\\\\-\\frac{1}{\\sqrt2}&\\frac{1}{\\sqrt2}\\end{bmatrix}$. The first row $\\left(\\frac{1}{\\sqrt2}, \\frac{1}{\\sqrt2}\\right)$ becomes the first column, and the second row $\\left(-\\frac{1}{\\sqrt2}, \\frac{1}{\\sqrt2}\\right)$ becomes the second column:\n$$A^T = \\begin{bmatrix}\\frac{1}{\\sqrt2}&-\\frac{1}{\\sqrt2}\\\\\\frac{1}{\\sqrt2}&\\frac{1}{\\sqrt2}\\end{bmatrix}$$\n\n**Step 2 \u2014 multiply $A\\times A^T$** using standard row-by-column multiplication:\n$$AA^T = \\begin{bmatrix}\\frac{1}{\\sqrt2}&\\frac{1}{\\sqrt2}\\\\-\\frac{1}{\\sqrt2}&\\frac{1}{\\sqrt2}\\end{bmatrix}\\begin{bmatrix}\\frac{1}{\\sqrt2}&-\\frac{1}{\\sqrt2}\\\\\\frac{1}{\\sqrt2}&\\frac{1}{\\sqrt2}\\end{bmatrix}$$\n\n**Entry (1,1)**: $\\left(\\frac{1}{\\sqrt2}\\right)\\left(\\frac{1}{\\sqrt2}\\right) + \\left(\\frac{1}{\\sqrt2}\\right)\\left(\\frac{1}{\\sqrt2}\\right) = \\frac12+\\frac12=1$.\n\n**Entry (1,2)**: $\\left(\\frac{1}{\\sqrt2}\\right)\\left(-\\frac{1}{\\sqrt2}\\right) + \\left(\\frac{1}{\\sqrt2}\\right)\\left(\\frac{1}{\\sqrt2}\\right) = -\\frac12+\\frac12=0$.\n\n**Entry (2,1)**: $\\left(-\\frac{1}{\\sqrt2}\\right)\\left(\\frac{1}{\\sqrt2}\\right) + \\left(\\frac{1}{\\sqrt2}\\right)\\left(\\frac{1}{\\sqrt2}\\right) = -\\frac12+\\frac12=0$.\n\n**Entry (2,2)**: $\\left(-\\frac{1}{\\sqrt2}\\right)\\left(-\\frac{1}{\\sqrt2}\\right) + \\left(\\frac{1}{\\sqrt2}\\right)\\left(\\frac{1}{\\sqrt2}\\right) = \\frac12+\\frac12=1$.\n\n**Result**:\n$$AA^T = \\begin{bmatrix}1&0\\\\0&1\\end{bmatrix} = I$$\n\nSince we obtained the identity matrix, **$A$ is confirmed to be orthogonal.** (Note: each row of $A$, when you square and sum its entries, gives exactly 1 \u2014 that's the \"unit length\" condition; and the rows are perpendicular to each other \u2014 that's the geometric meaning behind the zero off-diagonal entries.)"}, {"cat": "Matrices & Determinants", "q": "If $A$ and $B$ are idempotent, prove that: (1) $A+B$ is idempotent iff $AB=BA=O$; (2) $A-B$ is idempotent iff $AB=BA=B$.", "hint": "Idempotent means $A^2=A$, $B^2=B$. Expand $(A\\pm B)^2$ and set it equal to $A\\pm B$ to see what cross-term condition is required.", "ans": "**What idempotent means.** A matrix $A$ is **idempotent** if multiplying it by itself reproduces the exact same matrix: $A^2=A\\cdot A=A$. This is given for both $A$ and $B$ here.\n\n**Part (1): $(A+B)$ is idempotent $\\iff$ $AB=BA=O$ (the zero matrix).**\n\n**Step 1 \u2014 expand $(A+B)^2$** by multiplying it out, exactly as you would with ordinary algebra \u2014 but being careful that matrix multiplication is *not* commutative in general, so $AB$ and $BA$ must be kept as separate terms (you cannot combine them into \"$2AB$\" automatically):\n$$(A+B)^2 = (A+B)(A+B) = A^2+AB+BA+B^2$$\n\n**Step 2 \u2014 substitute the idempotent property** $A^2=A$ and $B^2=B$:\n$$(A+B)^2 = A+AB+BA+B$$\n\n**Step 3 \u2014 for $(A+B)$ to itself be idempotent, we need** $(A+B)^2=(A+B)$, i.e.:\n$$A+AB+BA+B = A+B$$\nSubtracting $A+B$ from both sides: $AB+BA=O$ (the zero matrix). **This is the necessary and sufficient condition for $(A+B)$ to be idempotent.**\n\n**Step 4 \u2014 now add the extra given condition that $AB=BA$** (the two products commute). Substituting $BA$ with $AB$ in $AB+BA=O$: $AB+AB=O \\implies 2AB=O \\implies AB=O$. And since $AB=BA$, this also means $BA=O$.\n\n**Conclusion for Part (1)**: $(A+B)$ is idempotent if and only if $AB=BA=O$. **Proven.**\n\n**Part (2): $(A-B)$ is idempotent $\\iff$ $AB=BA=B$.**\n\n**Step 1 \u2014 expand $(A-B)^2$**, again keeping the cross-terms separate since order matters:\n$$(A-B)^2 = (A-B)(A-B) = A^2-AB-BA+B^2$$\n\n**Step 2 \u2014 substitute** $A^2=A$, $B^2=B$:\n$$(A-B)^2 = A-AB-BA+B$$\n\n**Step 3 \u2014 for $(A-B)$ to be idempotent, we need** $(A-B)^2=(A-B)$:\n$$A-AB-BA+B = A-B$$\nSubtract $A$ from both sides, and rearrange: $-AB-BA+B=-B \\implies -AB-BA=-2B \\implies AB+BA=2B$.\n\n**Step 4 \u2014 assuming $AB=BA$** (they commute): substitute $BA=AB$: $AB+AB=2B \\implies 2AB=2B \\implies AB=B$. And since $AB=BA$, this also gives $BA=B$.\n\n**Conclusion for Part (2)**: $(A-B)$ is idempotent if and only if $AB=BA=B$. **Proven.**"}, {"cat": "Matrices & Determinants", "q": "Obtain $A'$ and $AA'$ for $A=\\begin{bmatrix}1&2&3\\\\4&5&6\\\\7&8&9\\end{bmatrix}$. What is the nature of $AA'$?", "hint": "Transpose first (rows become columns), then multiply $A\\times A'$.", "ans": "**Step 1 \u2014 find the transpose $A'$.** The transpose is formed by turning every row of $A$ into a column. Row 1 $(1,2,3)$ becomes column 1; row 2 $(4,5,6)$ becomes column 2; row 3 $(7,8,9)$ becomes column 3:\n$$A' = \\begin{bmatrix}1&4&7\\\\2&5&8\\\\3&6&9\\end{bmatrix}$$\n\n**Step 2 \u2014 multiply $A\\times A'$**, computing each of the 9 entries in the resulting $3\\times3$ matrix as (a row of $A$) dotted with (a column of $A'$):\n\nEntry (1,1): row 1 of $A$ $(1,2,3)$ \u00b7 col 1 of $A'$ $(1,2,3)$ $= 1(1)+2(2)+3(3)=1+4+9=14$.\n\nEntry (1,2): row 1 of $A$ $(1,2,3)$ \u00b7 col 2 of $A'$ $(4,5,6)$ $= 1(4)+2(5)+3(6)=4+10+18=32$.\n\nEntry (1,3): row 1 of $A$ $(1,2,3)$ \u00b7 col 3 of $A'$ $(7,8,9)$ $= 1(7)+2(8)+3(9)=7+16+27=50$.\n\nEntry (2,1): row 2 of $A$ $(4,5,6)$ \u00b7 col 1 of $A'$ $(1,2,3)$ $= 4(1)+5(2)+6(3)=4+10+18=32$.\n\nEntry (2,2): row 2 $(4,5,6)$ \u00b7 col 2 $(4,5,6)$ $= 16+25+36=77$.\n\nEntry (2,3): row 2 $(4,5,6)$ \u00b7 col 3 $(7,8,9)$ $= 28+40+54=122$.\n\nEntry (3,1): row 3 $(7,8,9)$ \u00b7 col 1 $(1,2,3)$ $= 7+16+27=50$.\n\nEntry (3,2): row 3 $(7,8,9)$ \u00b7 col 2 $(4,5,6)$ $= 28+40+54=122$.\n\nEntry (3,3): row 3 $(7,8,9)$ \u00b7 col 3 $(7,8,9)$ $= 49+64+81=194$.\n\n$$AA' = \\begin{bmatrix}14&32&50\\\\32&77&122\\\\50&122&194\\end{bmatrix}$$\n\n**Step 3 \u2014 identify the nature of $AA'$.** Look carefully at the matrix \u2014 notice entry (1,2)=32 equals entry (2,1)=32; entry (1,3)=50 equals entry (3,1)=50; entry (2,3)=122 equals entry (3,2)=122. Every pair of entries mirrored across the main diagonal is equal. **This means $AA'$ is a symmetric matrix.**\n\nThis is not a coincidence specific to this example \u2014 it is a **general rule**: for *any* matrix $A$ (of any shape), the product $AA'$ is always symmetric. This follows from the transpose rule $(AA')^T = (A')^T A^T = AA'$ (using the property that transposing a product reverses the order, and the transpose of a transpose gives back the original matrix), which shows $AA'$ always equals its own transpose."}, {"cat": "Matrices & Determinants", "q": "Obtain the determinant $|A|$ using the Laplace (cofactor) method for $A=\\begin{bmatrix}1&2&3\\\\4&5&6\\\\7&8&9\\end{bmatrix}$. What type of matrix is $A$?", "hint": "Expand along the first row using cofactors, being careful with alternating signs.", "ans": "**The Laplace (cofactor) expansion method, explained.** For a $3\\times3$ matrix, you can compute the determinant by picking any row (or column) and, for each entry in it, multiplying that entry by the determinant of the smaller $2\\times2$ matrix left after deleting that entry's row and column (called the \"minor\"), then applying an alternating $+,-,+$ sign pattern as you move across the row.\n\n**Step 1 \u2014 set up the expansion along the first row**, $(1,2,3)$:\n$$|A| = 1\\cdot\\begin{vmatrix}5&6\\\\8&9\\end{vmatrix} \\;-\\; 2\\cdot\\begin{vmatrix}4&6\\\\7&9\\end{vmatrix} \\;+\\; 3\\cdot\\begin{vmatrix}4&5\\\\7&8\\end{vmatrix}$$\n(Notice the signs alternate $+,-,+$ as we move from the first to the second to the third entry \u2014 this comes from the standard cofactor sign pattern.)\n\n**Step 2 \u2014 compute each $2\\times2$ minor determinant**, using $ad-bc$:\n\nFirst minor (formed by deleting row 1, column 1): $\\begin{vmatrix}5&6\\\\8&9\\end{vmatrix} = 5(9)-6(8) = 45-48=-3$.\n\nSecond minor (deleting row 1, column 2): $\\begin{vmatrix}4&6\\\\7&9\\end{vmatrix} = 4(9)-6(7) = 36-42=-6$.\n\nThird minor (deleting row 1, column 3): $\\begin{vmatrix}4&5\\\\7&8\\end{vmatrix} = 4(8)-5(7) = 32-35=-3$.\n\n**Step 3 \u2014 substitute back into the expansion**:\n$$|A| = 1(-3) - 2(-6) + 3(-3) = -3+12-9$$\n\n**Step 4 \u2014 do the final arithmetic**: $-3+12=9$, then $9-9=0$. So $|A|=0$.\n\n**Step 5 \u2014 interpret what $|A|=0$ tells us.** A matrix whose determinant equals zero is called a **singular matrix** \u2014 it means the rows (or equivalently columns) are **linearly dependent** (one row can be built as a combination of the others, so the matrix doesn't have a genuine inverse). Looking closely at $A$: notice row 3 $(7,8,9)$ equals $2\\times$row 2 $(4,5,6)$ minus row 1 $(1,2,3)$: $2(4,5,6)-(1,2,3)=(8,10,12)-(1,2,3)=(7,8,9)$ \u2713 \u2014 this confirms the rows genuinely are dependent, consistent with the determinant being zero. This particular pattern arises because each row is an arithmetic progression (1,2,3 then 4,5,6 then 7,8,9), which always produces a singular matrix.\n\n**Final answer**: $|A|=0$, and **$A$ is a singular matrix.**"}, {"cat": "Matrices & Determinants", "q": "If matrix $A$ is $2\\times4$ and $B$ is $4\\times3$, what is the dimension of $AB$?", "hint": "The result takes the outer dimensions, when the inner dimensions match.", "ans": "**The general rule for the dimension of a matrix product.** If matrix $M$ has dimensions $m\\times n$ (meaning $m$ rows and $n$ columns) and matrix $N$ has dimensions $n\\times p$ (meaning $n$ rows and $p$ columns \u2014 note the *inner* numbers must match, both equal to $n$), then the product $MN$ exists and has dimensions $m\\times p$ \u2014 you simply take the \"outer\" numbers from each original matrix.\n\n**Step 1 \u2014 write down the given dimensions.** $A$ is $2\\times4$: here $m=2$ (rows of $A$), and the \"inner\" number is $4$ (columns of $A$). $B$ is $4\\times3$: here the \"inner\" number is $4$ (rows of $B$), and $p=3$ (columns of $B$).\n\n**Step 2 \u2014 check conformability.** The inner numbers must match for multiplication to be defined: columns of $A$ (which is 4) must equal rows of $B$ (which is also 4). **They match \u2014 the multiplication is valid.**\n\n**Step 3 \u2014 determine the resulting dimension**, by taking the outer numbers: rows of $A$ (= 2) becomes the number of rows in the product, and columns of $B$ (= 3) becomes the number of columns in the product.\n\n**Final answer**: $AB$ is a $2\\times3$ matrix."}, {"cat": "Integration", "q": "Distinguish between indefinite and definite integrals.", "hint": "One has limits (bounds), the other doesn't.", "ans": "**What integration is, briefly.** Integration is essentially the *reverse process* of differentiation \u2014 instead of finding a rate of change from a function, we're finding a function whose rate of change matches something we already know. This \"reverse\" function is called an **antiderivative**.\n\n**Indefinite integral.** Written $\\int f(x)\\,dx = F(x)+C$, this represents the *entire family* of antiderivatives of $f(x)$ \u2014 not just one specific function, but every function whose derivative is $f(x)$. Since differentiating any constant gives zero, if $F(x)$ is one antiderivative, then $F(x)+C$ is also an antiderivative for *any* constant $C$ (called the **constant of integration**). Because there are no bounds specified, an indefinite integral gives a general expression, not a specific number. Example: $\\int 2x\\,dx = x^2+C$.\n\n**Definite integral.** Written $\\int_a^b f(x)\\,dx$, this has a **lower limit** $a$ and an **upper limit** $b$ attached, and it evaluates to a single specific **numerical value**: $\\int_a^b f(x)\\,dx = F(b)-F(a)$ (find the antiderivative, then subtract its value at the lower limit from its value at the upper limit \u2014 this is called the **Fundamental Theorem of Calculus**). No constant $C$ is needed here, since it would cancel out anyway when you subtract $F(a)$ from $F(b)$. Geometrically, a definite integral represents the (signed) area between the curve $y=f(x)$ and the $x$-axis, between $x=a$ and $x=b$.\n\n**In short**: indefinite = general formula (family of functions, has $+C$); definite = specific number (has limits, no $+C$)."}, {"cat": "Integration", "q": "Using the substitution method, find $\\int_0^3 8x(2x^2+3)\\,dx$.", "hint": "Let $u=2x^2+3$, so $du=4x\\,dx$; rewrite $8x\\,dx$ in terms of $du$.", "ans": "**Why substitution helps here.** The integral contains a composite expression, $(2x^2+3)$, multiplied by something ($8x$) that is closely related to its derivative. Substitution lets us replace the messy inner expression with a single simple variable $u$, turning the integral into something we can solve using basic rules.\n\n**Step 1 \u2014 choose the substitution.** A good choice for $u$ is usually the \"inner\" expression being raised to a power or otherwise complicated \u2014 here, $u = 2x^2+3$.\n\n**Step 2 \u2014 differentiate $u$ with respect to $x$** to find $du$: $\\dfrac{du}{dx} = 4x \\implies du = 4x\\,dx$.\n\n**Step 3 \u2014 rewrite the integral's $8x\\,dx$ piece in terms of $du$.** We have $du=4x\\,dx$, so $8x\\,dx = 2\\times(4x\\,dx) = 2\\,du$.\n\n**Step 4 \u2014 change the limits of integration to match the new variable $u$** (this is essential for definite integrals with substitution \u2014 you must convert the $x$-limits into $u$-limits, so you don't need to substitute back at the end). When $x=0$: $u=2(0)^2+3=3$. When $x=3$: $u=2(3)^2+3=18+3=21$.\n\n**Step 5 \u2014 rewrite the whole integral in terms of $u$** using the new limits:\n$$\\int_0^3 8x(2x^2+3)\\,dx = \\int_{3}^{21} u\\cdot 2\\,du = 2\\int_3^{21}u\\,du$$\n\n**Step 6 \u2014 integrate using the power rule** ($\\int u\\,du = \\frac{u^2}{2}$):\n$$2\\int_3^{21}u\\,du = 2\\left[\\frac{u^2}{2}\\right]_3^{21} = \\left[u^2\\right]_3^{21}$$\n\n**Step 7 \u2014 apply the limits** (upper minus lower):\n$$= (21)^2 - (3)^2 = 441-9 = 432$$\n\n**Final answer**: $\\int_0^3 8x(2x^2+3)\\,dx = 432$.\n\n*(Check by expanding directly instead: $8x(2x^2+3)=16x^3+24x$, and $\\int_0^3(16x^3+24x)dx = [4x^4+12x^2]_0^3 = 4(81)+12(9) = 324+108=432$ \u2014 the same result, confirming the substitution was done correctly.)*"}, {"cat": "Integration", "q": "Evaluate $\\int 5\\sqrt{u^2}\\,du$.", "hint": "$\\sqrt{u^2}=|u|$; for a straightforward power-rule application, treat it as $5u$ (assuming $u\\geq0$) and integrate.", "ans": "**Step 1 \u2014 simplify the expression under the square root.** Recall that $\\sqrt{u^2}=|u|$ (the absolute value of $u$), since a square root always returns a non-negative result. For the purposes of this integral (and assuming the standard convention that $u\\geq0$ over the region of interest, as is typical in these applied problems), we can treat $\\sqrt{u^2}=u$.\n\n**Step 2 \u2014 rewrite the integral with this simplification**:\n$$\\int 5\\sqrt{u^2}\\,du = \\int 5u\\,du$$\n\n**Step 3 \u2014 apply the power rule for integration**: $\\int u^n\\,du = \\dfrac{u^{n+1}}{n+1}+C$ (increase the power by 1, then divide by the new power). Here $u=u^1$, so $n=1$, giving $\\int u\\,du = \\dfrac{u^2}{2}$. The constant multiplier 5 simply carries through unchanged:\n$$\\int 5u\\,du = 5\\cdot\\frac{u^2}{2}+C = \\frac{5u^2}{2}+C$$\n\n**Final answer**: $\\dfrac{5u^2}{2}+C$."}, {"cat": "Integration", "q": "Use partial fractions to find $\\int \\dfrac{1}{x^2-4}\\,dx$.", "hint": "Factor the denominator as a difference of squares, then split into partial fractions.", "ans": "**Why partial fractions is needed here.** The integrand is a fraction whose denominator is a more complicated polynomial than the numerator \u2014 direct integration doesn't apply. But if the denominator can be factored into simpler linear pieces, we can rewrite the whole fraction as a *sum* of simpler fractions, each of which is easy to integrate (using the standard result $\\int\\frac{1}{x-a}dx=\\ln|x-a|+C$).\n\n**Step 1 \u2014 factor the denominator.** $x^2-4$ is a \"difference of squares\" pattern ($a^2-b^2=(a-b)(a+b)$, here with $a=x,b=2$): $x^2-4=(x-2)(x+2)$.\n\n**Step 2 \u2014 set up the partial fraction decomposition.** We want to write:\n$$\\frac{1}{(x-2)(x+2)} = \\frac{A}{x-2}+\\frac{B}{x+2}$$\nfor some constants $A$ and $B$ that we need to find.\n\n**Step 3 \u2014 clear the denominators** by multiplying both sides by $(x-2)(x+2)$:\n$$1 = A(x+2)+B(x-2)$$\n\n**Step 4 \u2014 find $A$ and $B$ using the \"cover-up\" method** (substitute convenient values of $x$ that make one of the terms vanish). Let $x=2$: the $B(x-2)$ term becomes $B(0)=0$, leaving $1=A(2+2)=4A \\implies A=\\dfrac14$.\n\nLet $x=-2$: the $A(x+2)$ term becomes $A(0)=0$, leaving $1=B(-2-2)=-4B \\implies B=-\\dfrac14$.\n\n**Step 5 \u2014 rewrite the original integral using these partial fractions**:\n$$\\int\\frac{1}{x^2-4}dx = \\int\\left(\\frac{1/4}{x-2} - \\frac{1/4}{x+2}\\right)dx$$\n\n**Step 6 \u2014 integrate each simple term separately**, using $\\int\\frac{1}{x-a}dx=\\ln|x-a|+C$:\n$$= \\frac14\\ln|x-2| - \\frac14\\ln|x+2| + C$$\n\n**Step 7 \u2014 combine using log properties** (optional, for a tidier final form): recall $\\ln A - \\ln B = \\ln\\left(\\frac{A}{B}\\right)$:\n$$= \\frac14\\ln\\left|\\frac{x-2}{x+2}\\right| + C$$"}, {"cat": "Integration", "q": "The marginal cost function is $MC=2Q-6$. If total cost is 212 when $Q=8$, find the total cost when $Q=14$.", "hint": "Integrate $MC$ to get $TC$ plus a constant, then use the given point to find the constant.", "ans": "**The economic logic first.** Marginal cost is defined as the *derivative* of total cost with respect to output: $MC=\\dfrac{d(TC)}{dQ}$. To recover the total cost function from the marginal cost function, we must do the reverse operation \u2014 **integrate**.\n\n**Step 1 \u2014 integrate the marginal cost function** to obtain the total cost function, remembering to include an unknown constant of integration (since indefinite integration always leaves one):\n$$TC = \\int MC\\,dQ = \\int(2Q-6)\\,dQ$$\n\nUsing the power rule on each term: $\\int 2Q\\,dQ = Q^2$ and $\\int(-6)\\,dQ = -6Q$. So:\n$$TC = Q^2 - 6Q + C$$\n\n**Step 2 \u2014 use the given information to find the specific value of $C$.** We're told $TC=212$ when $Q=8$. Substitute these values into the formula:\n$$212 = (8)^2 - 6(8) + C$$\n$$212 = 64-48+C = 16+C$$\n\n**Step 3 \u2014 solve for $C$**:\n$$C = 212-16 = 196$$\n\n**Step 4 \u2014 write out the complete, specific total cost function** (now that we know $C$):\n$$TC = Q^2-6Q+196$$\n\n**Step 5 \u2014 use this specific function to find total cost at $Q=14$**:\n$$TC(14) = (14)^2-6(14)+196 = 196-84+196$$\n\n**Step 6 \u2014 do the final arithmetic**: $196-84=112$, then $112+196=308$.\n\n**Final answer**: $TC(14)=308$."}, {"cat": "Integration", "q": "Integrate: (i) $x^5+2x^2+9$ (ii) $e^x+\\frac{3}{x}$ (iii) $10e^{10x}$.", "hint": "Power rule for polynomials; standard forms for $e^x$, $1/x$, and $e^{kx}$.", "ans": "**(i) $\\int(x^5+2x^2+9)\\,dx$ \u2014 apply the power rule to each term separately.** Recall: $\\int x^n\\,dx = \\dfrac{x^{n+1}}{n+1}+C$, and $\\int k\\,dx = kx+C$ for a constant $k$ (this is the special case where $n=0$, since a constant is really $kx^0$).\n\nFor $x^5$: increase power to 6, divide by 6: $\\dfrac{x^6}{6}$.\n\nFor $2x^2$: increase power to 3, divide by 3: $2\\cdot\\dfrac{x^3}{3}=\\dfrac{2x^3}{3}$.\n\nFor the constant $9$: this is $9x^0$, and integrating a constant simply gives that constant times $x$: $9x$.\n\n$$\\int(x^5+2x^2+9)dx = \\frac{x^6}{6}+\\frac{2x^3}{3}+9x+C$$\n\n**(ii) $\\int\\left(e^x+\\dfrac3x\\right)dx$ \u2014 use two standard integration results.** First, $\\int e^x\\,dx = e^x+C$ (the exponential function is its own integral, just as it's its own derivative \u2014 a special property). Second, $\\int\\dfrac1x\\,dx = \\ln|x|+C$ (this is a standard result that doesn't follow from the ordinary power rule, because the power rule $\\frac{x^{n+1}}{n+1}$ breaks down when $n=-1$, since you'd be dividing by zero \u2014 the log rule fills this gap).\n\n$$\\int\\left(e^x+\\frac3x\\right)dx = e^x + 3\\ln|x| + C$$\n\n**(iii) $\\int 10e^{10x}\\,dx$ \u2014 use the exponential rule for a linear exponent.** Recall $\\int e^{kx}dx = \\dfrac{1}{k}e^{kx}+C$ (you divide by the coefficient of $x$ in the exponent). Here $k=10$:\n$$\\int 10e^{10x}dx = 10\\cdot\\frac{1}{10}e^{10x}+C = e^{10x}+C$$\n(Notice the coefficient 10 in front conveniently cancels with the $\\frac{1}{10}$ that integration introduces \u2014 this isn't a coincidence, it was chosen to make the answer clean.)"}, {"cat": "Integration", "q": "Find $\\int \\dfrac{3x+1}{x^2+2x-3}\\,dx$ using partial fractions.", "hint": "Factor the denominator, split into partial fractions, solve for the constants.", "ans": "**Step 1 \u2014 factor the denominator.** We need two numbers that multiply to $-3$ and add to $2$: those are $3$ and $-1$. So $x^2+2x-3=(x+3)(x-1)$.\n\n**Step 2 \u2014 set up the partial fraction decomposition:**\n$$\\frac{3x+1}{(x+3)(x-1)} = \\frac{A}{x+3}+\\frac{B}{x-1}$$\n\n**Step 3 \u2014 clear denominators** by multiplying both sides by $(x+3)(x-1)$:\n$$3x+1 = A(x-1)+B(x+3)$$\n\n**Step 4 \u2014 use the cover-up method to solve for $A$ and $B$.**\n\nLet $x=1$ (this makes the $A(x-1)$ term vanish, since $x-1=0$): $3(1)+1=B(1+3) \\implies 4=4B \\implies B=1$.\n\nLet $x=-3$ (this makes the $B(x+3)$ term vanish): $3(-3)+1=A(-3-1) \\implies -9+1=-4A \\implies -8=-4A \\implies A=2$.\n\n**Step 5 \u2014 rewrite and integrate**, using the standard result $\\int\\frac{1}{x-a}dx=\\ln|x-a|+C$:\n$$\\int\\left(\\frac{2}{x+3}+\\frac{1}{x-1}\\right)dx = 2\\ln|x+3| + \\ln|x-1| + C$$"}, {"cat": "Integration", "q": "Find $\\int \\dfrac{2x-5}{x^2-5x+6}\\,dx$.", "hint": "Factor the denominator as $(x-2)(x-3)$, then use partial fractions.", "ans": "**Step 1 \u2014 factor the denominator.** We need two numbers multiplying to $6$ and adding to $-5$: those are $-2$ and $-3$. So $x^2-5x+6=(x-2)(x-3)$.\n\n**Step 2 \u2014 set up the decomposition:**\n$$\\frac{2x-5}{(x-2)(x-3)} = \\frac{A}{x-2}+\\frac{B}{x-3}$$\n\n**Step 3 \u2014 clear denominators:**\n$$2x-5 = A(x-3)+B(x-2)$$\n\n**Step 4 \u2014 use the cover-up method.**\n\nLet $x=2$: $2(2)-5=A(2-3) \\implies -1=-A \\implies A=1$.\n\nLet $x=3$: $2(3)-5=B(3-2) \\implies 1=B \\implies B=1$.\n\n**Step 5 \u2014 write out and integrate:**\n$$\\int\\left(\\frac{1}{x-2}+\\frac{1}{x-3}\\right)dx = \\ln|x-2|+\\ln|x-3|+C$$"}, {"cat": "Integration", "q": "Evaluate $\\int \\dfrac{\\cos x}{1+\\sin x}\\,dx$.", "hint": "Recognise the numerator as (almost) the derivative of the denominator \u2014 substitute $u=1+\\sin x$.", "ans": "**A pattern worth recognising**: whenever an integral has the form $\\dfrac{f'(x)}{f(x)}$ (the derivative of the denominator sitting exactly in the numerator), the integral always equals $\\ln|f(x)|+C$ \u2014 this comes directly from the chain rule applied to logarithms, and is one of the most useful shortcuts to spot.\n\n**Step 1 \u2014 check whether this pattern applies here.** The denominator is $1+\\sin x$. Its derivative (w.r.t. $x$) is $\\cos x$ (the derivative of the constant $1$ is $0$, and the derivative of $\\sin x$ is $\\cos x$). This is *exactly* the numerator! So yes, this fits the pattern perfectly.\n\n**Step 2 \u2014 formalize with substitution.** Let $u = 1+\\sin x$. Then $du = \\cos x\\,dx$ (this is exactly the numerator's differential).\n\n**Step 3 \u2014 rewrite the integral in terms of $u$:**\n$$\\int\\frac{\\cos x}{1+\\sin x}dx = \\int\\frac{du}{u}$$\n\n**Step 4 \u2014 integrate using the standard log rule**, $\\int\\frac{du}{u}=\\ln|u|+C$:\n$$= \\ln|u|+C$$\n\n**Step 5 \u2014 substitute back** what $u$ actually represents, since the final answer must be in terms of $x$:\n$$= \\ln|1+\\sin x| + C$$"}, {"cat": "Integration", "q": "Find $\\int \\cos x\\cdot e^{\\sin x}\\,dx$.", "hint": "Substitute $u=\\sin x$.", "ans": "**Step 1 \u2014 spot the substitution.** The integral has $e^{\\sin x}$ (an exponential of $\\sin x$) multiplied by $\\cos x$. Since $\\dfrac{d}{dx}(\\sin x)=\\cos x$, notice that $\\cos x$ is exactly the derivative of the \"inner function\" $\\sin x$ sitting inside the exponential \u2014 this is the classic signal to substitute $u=\\sin x$.\n\n**Step 2 \u2014 carry out the substitution.** Let $u=\\sin x$, so $du=\\cos x\\,dx$.\n\n**Step 3 \u2014 rewrite the integral entirely in terms of $u$:**\n$$\\int\\cos x\\cdot e^{\\sin x}\\,dx = \\int e^u\\,du$$\n(The $\\cos x\\,dx$ part has been completely absorbed into $du$.)\n\n**Step 4 \u2014 integrate**, using the fact that $e^u$ is its own antiderivative:\n$$\\int e^u\\,du = e^u+C$$\n\n**Step 5 \u2014 substitute back $u=\\sin x$:**\n$$= e^{\\sin x}+C$$"}, {"cat": "Integration", "q": "Evaluate the definite integrals: (i) $\\int_1^3 x^2\\,dx$ (ii) $\\int_0^4 e^x\\,dx$.", "hint": "Find the antiderivative, then apply the limits (upper minus lower).", "ans": "**The two-step process for any definite integral**: (1) find the antiderivative (ignore the limits for a moment, treat it like an indefinite integral, and don't bother writing $+C$ since it will cancel out); (2) evaluate that antiderivative at the upper limit, evaluate it at the lower limit, and subtract (upper minus lower) \u2014 this is the Fundamental Theorem of Calculus.\n\n**(i) $\\int_1^3 x^2\\,dx$.**\n\nAntiderivative (power rule): $\\int x^2\\,dx = \\dfrac{x^3}{3}$.\n\nEvaluate at the limits: $\\left[\\dfrac{x^3}{3}\\right]_1^3 = \\dfrac{(3)^3}{3} - \\dfrac{(1)^3}{3} = \\dfrac{27}{3}-\\dfrac13 = 9-\\dfrac13$.\n\nConvert to a common fraction: $9=\\dfrac{27}{3}$, so $\\dfrac{27}{3}-\\dfrac13=\\dfrac{26}{3}$.\n\n**Final answer (i)**: $\\dfrac{26}{3}$ (approximately $8.67$).\n\n**(ii) $\\int_0^4 e^x\\,dx$.**\n\nAntiderivative: $\\int e^x\\,dx = e^x$ (the exponential is its own antiderivative).\n\nEvaluate at the limits: $\\left[e^x\\right]_0^4 = e^4 - e^0$.\n\nRecall $e^0=1$ (anything to the power zero is 1). So:\n$$= e^4 - 1$$\n\nNumerically, $e^4\\approx54.6$, so the answer is approximately $53.6$.\n\n**Final answer (ii)**: $e^4-1 \\approx 53.6$."}, {"cat": "Integration", "q": "Find $\\int \\dfrac{4x-3}{x^2+4x+3}\\,dx$.", "hint": "Factor $x^2+4x+3=(x+1)(x+3)$ and use partial fractions.", "ans": "**Step 1 \u2014 factor the denominator.** We need two numbers multiplying to $3$ and adding to $4$: those are $1$ and $3$. So $x^2+4x+3=(x+1)(x+3)$.\n\n**Step 2 \u2014 set up the decomposition:**\n$$\\frac{4x-3}{(x+1)(x+3)} = \\frac{A}{x+1}+\\frac{B}{x+3}$$\n\n**Step 3 \u2014 clear denominators:**\n$$4x-3 = A(x+3)+B(x+1)$$\n\n**Step 4 \u2014 use the cover-up method.**\n\nLet $x=-1$: $4(-1)-3=A(-1+3) \\implies -7=2A \\implies A=-3.5$.\n\nLet $x=-3$: $4(-3)-3=B(-3+1) \\implies -15=-2B \\implies B=7.5$.\n\n**Step 5 \u2014 write out and integrate:**\n$$\\int\\left(\\frac{-3.5}{x+1}+\\frac{7.5}{x+3}\\right)dx = -3.5\\ln|x+1| + 7.5\\ln|x+3| + C$$"}, {"cat": "Integration", "q": "Find $\\int \\dfrac{2x+7}{x^2+7x-4}\\,dx$ using the substitution method.", "hint": "Notice the numerator is close to (a multiple of) the derivative of the denominator.", "ans": "**Step 1 \u2014 check the derivative of the denominator.** The denominator is $x^2+7x-4$. Its derivative (w.r.t. $x$) is $2x+7$ \u2014 and this is **exactly** the numerator! This is the \"derivative of denominator sitting in the numerator\" pattern again, which always integrates to a natural log.\n\n**Step 2 \u2014 substitute.** Let $u=x^2+7x-4$, so $du=(2x+7)\\,dx$.\n\n**Step 3 \u2014 rewrite the integral:**\n$$\\int\\frac{2x+7}{x^2+7x-4}dx = \\int\\frac{du}{u}$$\n\n**Step 4 \u2014 integrate:**\n$$= \\ln|u| + C$$\n\n**Step 5 \u2014 substitute back:**\n$$= \\ln|x^2+7x-4| + C$$"}, {"cat": "Integration", "q": "Find $\\int 4x^3e^{x^4}\\,dx$.", "hint": "Substitute $u=x^4$.", "ans": "**Step 1 \u2014 spot the pattern.** We have $e^{x^4}$ multiplied by $4x^3$. Since $\\dfrac{d}{dx}(x^4)=4x^3$, the multiplier $4x^3$ is exactly the derivative of the inner exponent $x^4$ \u2014 this is the signal to substitute.\n\n**Step 2 \u2014 substitute.** Let $u=x^4$, so $du=4x^3\\,dx$ (which conveniently matches the rest of the integrand exactly).\n\n**Step 3 \u2014 rewrite the integral:**\n$$\\int 4x^3e^{x^4}\\,dx = \\int e^u\\,du$$\n\n**Step 4 \u2014 integrate:**\n$$= e^u+C$$\n\n**Step 5 \u2014 substitute back:**\n$$= e^{x^4}+C$$"}, {"cat": "Integration", "q": "Find $\\int e^{ax+b}\\,dx$.", "hint": "Straightforward exponential rule with a linear exponent \u2014 divide by the coefficient of $x$.", "ans": "**The general rule for integrating $e$ raised to a linear expression**: $\\int e^{kx+c}\\,dx = \\dfrac{1}{k}e^{kx+c}+C$, where $k$ is the coefficient multiplying $x$ inside the exponent. This comes from reversing the chain rule: if you differentiated $\\frac1k e^{kx+c}$, the chain rule would bring down a factor of $k$, which cancels the $\\frac1k$ out front and leaves you back with $e^{kx+c}$ \u2014 confirming this is the correct antiderivative.\n\n**Applying this here**, with the exponent $ax+b$ (so the coefficient of $x$ is $a$):\n$$\\int e^{ax+b}dx = \\frac{1}{a}e^{ax+b}+C \\qquad (a\\neq0)$$"}, {"cat": "Integration", "q": "Find: (i) $\\int x^{-1}dx$ (ii) $\\int(12e^{3x}-4e^{-2x})dx$ (iii) $\\int\\dfrac{6x^2+4}{4x^3+8x}dx$.", "hint": "(i) Standard log rule. (ii) Exponential rule term by term. (iii) Numerator is proportional to the derivative of the denominator.", "ans": "**(i) $\\int x^{-1}dx$.** As noted before, the ordinary power rule $\\int x^n dx=\\frac{x^{n+1}}{n+1}$ fails when $n=-1$ (you'd be dividing by zero). This special case has its own standard result instead:\n$$\\int x^{-1}dx = \\int\\frac1x\\,dx = \\ln|x|+C$$\n\n**(ii) $\\int(12e^{3x}-4e^{-2x})dx$.** Apply $\\int e^{kx}dx=\\frac1k e^{kx}$ to each term.\n\nFor $12e^{3x}$: here $k=3$, so $\\int 12e^{3x}dx = 12\\times\\frac13e^{3x} = 4e^{3x}$.\n\nFor $-4e^{-2x}$: here $k=-2$, so $\\int(-4e^{-2x})dx = -4\\times\\frac{1}{-2}e^{-2x} = 2e^{-2x}$ (dividing by a negative $k$ flips the sign).\n\n$$\\int(12e^{3x}-4e^{-2x})dx = 4e^{3x}+2e^{-2x}+C$$\n\n**(iii) $\\int\\dfrac{6x^2+4}{4x^3+8x}dx$.** Check whether the numerator is (a multiple of) the derivative of the denominator. Denominator: $4x^3+8x$; its derivative is $12x^2+8$. Notice this equals exactly $2\\times(6x^2+4)$ \u2014 so the numerator is *half* the denominator's derivative.\n\nLet $u=4x^3+8x$, so $du=(12x^2+8)dx = 2(6x^2+4)dx$, meaning $(6x^2+4)dx = \\frac12 du$.\n\n$$\\int\\frac{6x^2+4}{4x^3+8x}dx = \\int\\frac{\\frac12 du}{u} = \\frac12\\int\\frac{du}{u} = \\frac12\\ln|u|+C = \\frac12\\ln|4x^3+8x|+C$$"}, {"cat": "Integration", "q": "The marginal propensity to save is $\\dfrac{dS}{dY}=0.3-0.1Y^{-1/2}$. If $S=-3.2$ when $Y=25$, find the saving function $S(Y)$.", "hint": "Integrate w.r.t. $Y$, then use the given point to find the constant.", "ans": "**Step 1 \u2014 integrate the given derivative to recover the original function**, remembering the constant of integration:\n$$S = \\int(0.3-0.1Y^{-1/2})dY$$\n\nIntegrate term by term. For $0.3$ (a constant times $Y^0$): $\\int 0.3\\,dY = 0.3Y$.\n\nFor $-0.1Y^{-1/2}$: apply the power rule, increasing the exponent by 1 (from $-\\frac12$ to $\\frac12$) and dividing by the new exponent: $\\int Y^{-1/2}dY = \\dfrac{Y^{1/2}}{1/2} = 2Y^{1/2} = 2\\sqrt{Y}$. So $\\int(-0.1Y^{-1/2})dY = -0.1\\times2\\sqrt Y = -0.2\\sqrt Y$.\n\nPutting it together:\n$$S = 0.3Y - 0.2\\sqrt{Y} + C$$\n\n**Step 2 \u2014 use the given condition, $S=-3.2$ when $Y=25$, to find $C$.** Note $\\sqrt{25}=5$:\n$$-3.2 = 0.3(25) - 0.2(5) + C$$\n$$-3.2 = 7.5 - 1 + C = 6.5+C$$\n\n**Step 3 \u2014 solve for $C$:**\n$$C = -3.2-6.5 = -9.7$$\n\n**Final answer**: $S(Y) = 0.3Y - 0.2\\sqrt{Y} - 9.7$."}, {"cat": "Integration", "q": "Evaluate $\\int_1^9 x\\sqrt{1+2x}\\,dx$ (via substitution).", "hint": "Let $u=1+2x$, express $x$ and $dx$ in terms of $u$, and rewrite the whole integral before applying limits.", "ans": "**Why this needs substitution.** The presence of $\\sqrt{1+2x}$ (an awkward square root of a linear expression) multiplied by a separate $x$ makes this hard to integrate directly. Substitution simplifies the square root, but since the leftover $x$ can't just be ignored, we must also rewrite $x$ itself in terms of the new variable $u$.\n\n**Step 1 \u2014 substitute.** Let $u=1+2x$.\n\n**Step 2 \u2014 solve this for $x$ in terms of $u$** (since we still have a leftover $x$ in the integrand that needs converting): from $u=1+2x$, rearrange to get $x = \\dfrac{u-1}{2}$.\n\n**Step 3 \u2014 find $dx$ in terms of $du$**: differentiating $u=1+2x$ gives $du=2\\,dx$, so $dx=\\dfrac{du}{2}$.\n\n**Step 4 \u2014 convert the limits of integration** from $x$-values to $u$-values: when $x=1$, $u=1+2(1)=3$. When $x=9$, $u=1+2(9)=19$.\n\n**Step 5 \u2014 rewrite the entire integral in terms of $u$**, substituting $x=\\frac{u-1}{2}$, $\\sqrt{1+2x}=\\sqrt u$, and $dx=\\frac{du}{2}$:\n$$\\int_1^9 x\\sqrt{1+2x}\\,dx = \\int_3^{19}\\left(\\frac{u-1}{2}\\right)\\sqrt{u}\\cdot\\frac{du}{2} = \\frac14\\int_3^{19}(u-1)\\sqrt{u}\\,du$$\n\n**Step 6 \u2014 expand $(u-1)\\sqrt u = (u-1)u^{1/2} = u^{3/2}-u^{1/2}$** (multiplying out, using the rule $u\\cdot u^{1/2}=u^{3/2}$):\n$$= \\frac14\\int_3^{19}\\left(u^{3/2}-u^{1/2}\\right)du$$\n\n**Step 7 \u2014 integrate each term using the power rule.** For $u^{3/2}$: increase power to $\\frac52$, divide by $\\frac52$: $\\dfrac{u^{5/2}}{5/2}=\\dfrac25 u^{5/2}$. For $u^{1/2}$: increase power to $\\frac32$, divide by $\\frac32$: $\\dfrac{2}{3}u^{3/2}$.\n$$= \\frac14\\left[\\frac25 u^{5/2} - \\frac23 u^{3/2}\\right]_3^{19} = \\frac{1}{10}\\Big[u^{5/2}\\Big]_3^{19} - \\frac{1}{6}\\Big[u^{3/2}\\Big]_3^{19}$$\n\n(This second form comes from multiplying the outer $\\frac14$ into each fraction: $\\frac14\\times\\frac25=\\frac{1}{10}$ and $\\frac14\\times\\frac23=\\frac16$.)\n\n**Step 8 \u2014 evaluate the powers of $u$ at the limits precisely.** $\\sqrt{19}\\approx4.3589$, so $19^{3/2}=19\\times\\sqrt{19}\\approx82.82$ and $19^{5/2}=19^2\\times\\sqrt{19}=361\\times4.3589\\approx1573.56$. Similarly $\\sqrt3\\approx1.7321$, so $3^{3/2}=3\\times\\sqrt3\\approx5.196$ and $3^{5/2}=9\\times\\sqrt3\\approx15.588$.\n\n**Step 9 \u2014 substitute these values in:**\n$$\\frac{1}{10}(1573.56-15.588) - \\frac16(82.82-5.196) = \\frac{1}{10}(1557.97) - \\frac16(77.62)$$\n$$= 155.80 - 12.94 = 142.86$$\n\n**Final answer**: $\\int_1^9 x\\sqrt{1+2x}\\,dx \\approx 142.86$ (exactly, $\\dfrac{1}{10}\\left(19^{5/2}-3^{5/2}\\right)-\\dfrac16\\left(19^{3/2}-3^{3/2}\\right)$)."}, {"cat": "Integration", "q": "Find $\\int 3x^2\\sin(x^3+1)\\,dx$.", "hint": "Substitute $u=x^3+1$.", "ans": "**Step 1 \u2014 spot the pattern.** We have $\\sin(x^3+1)$ multiplied by $3x^2$. Since $\\dfrac{d}{dx}(x^3+1)=3x^2$, this multiplier matches the derivative of the inner expression exactly.\n\n**Step 2 \u2014 substitute.** Let $u=x^3+1$, so $du=3x^2\\,dx$.\n\n**Step 3 \u2014 rewrite the integral:**\n$$\\int 3x^2\\sin(x^3+1)\\,dx = \\int\\sin u\\,du$$\n\n**Step 4 \u2014 integrate**, using the standard result $\\int\\sin u\\,du = -\\cos u+C$ (recall the derivative of $\\cos u$ is $-\\sin u$, so integrating $\\sin u$ reverses that sign):\n$$= -\\cos u+C$$\n\n**Step 5 \u2014 substitute back:**\n$$= -\\cos(x^3+1)+C$$"}, {"cat": "Integration", "q": "Find $\\int 2xe^{x^2}\\,dx$.", "hint": "Substitute $u=x^2$.", "ans": "**Step 1 \u2014 spot the pattern.** $e^{x^2}$ multiplied by $2x$; since $\\dfrac{d}{dx}(x^2)=2x$, the multiplier matches the derivative of the inner exponent.\n\n**Step 2 \u2014 substitute.** Let $u=x^2$, so $du=2x\\,dx$.\n\n**Step 3 \u2014 rewrite:**\n$$\\int 2xe^{x^2}dx = \\int e^u\\,du$$\n\n**Step 4 \u2014 integrate:**\n$$= e^u+C$$\n\n**Step 5 \u2014 substitute back:**\n$$= e^{x^2}+C$$"}, {"cat": "Integration", "q": "Outline three techniques for integrating complex functions, and use one to find $\\int(3x+5)^{10}dx$.", "hint": "Techniques: substitution, integration by parts, partial fractions. Use substitution here.", "ans": "**Three common techniques for tackling integrals that don't fit basic rules directly:**\n\n1. **Substitution (change of variable)** \u2014 replace a complicated inner expression with a single new variable $u$, simplifying the integral, then substitute back at the end. Best used when you can spot a function and (a multiple of) its derivative both present in the integral.\n\n2. **Integration by parts** \u2014 used for integrating a *product* of two different types of functions (e.g. a polynomial times an exponential), based on the formula $\\int u\\,dv = uv - \\int v\\,du$.\n\n3. **Partial fractions** \u2014 used for integrating a ratio of polynomials, by breaking the complicated fraction into a sum of simpler fractions that are each individually easy to integrate (as done in several problems above).\n\n**Now applying substitution to solve $\\int(3x+5)^{10}dx$:**\n\n**Step 1 \u2014 substitute.** Let $u=3x+5$ (the \"inner\" expression being raised to a power).\n\n**Step 2 \u2014 find $du$:** $du = 3\\,dx \\implies dx = \\dfrac{du}{3}$.\n\n**Step 3 \u2014 rewrite the integral:**\n$$\\int(3x+5)^{10}dx = \\int u^{10}\\cdot\\frac{du}{3} = \\frac13\\int u^{10}\\,du$$\n\n**Step 4 \u2014 integrate using the power rule** (increase the power to 11, divide by 11):\n$$= \\frac13\\cdot\\frac{u^{11}}{11}+C = \\frac{u^{11}}{33}+C$$\n\n**Step 5 \u2014 substitute back $u=3x+5$:**\n$$= \\frac{(3x+5)^{11}}{33}+C$$"}, {"cat": "Differential Equations", "q": "With relevant examples, define the term 'differential equation'.", "hint": "It's an equation involving derivatives of an unknown function.", "ans": "**Definition.** A **differential equation** is an equation that contains one or more **derivatives** of an unknown function, alongside the function and/or the independent variable(s) themselves. Unlike an ordinary algebraic equation (where you solve for a specific *number*, like $x=5$), the \"unknown\" in a differential equation is an entire **function** \u2014 solving it means finding what that underlying function actually is.\n\n**Why they matter**: many real processes are naturally described by how quantities *change* rather than by their absolute values directly \u2014 e.g. \"the rate of population growth is proportional to the current population\" is a statement about a derivative, and translating it into a differential equation lets us solve for the population as an explicit function of time.\n\n**Example 1 (ordinary differential equation)**: $\\dfrac{dy}{dx}=3y$. This says \"the rate of change of $y$ with respect to $x$ is always three times the current value of $y$\" \u2014 solving it (using separation of variables) gives $y=Ce^{3x}$ for some constant $C$.\n\n**Example 2 (partial differential equation)**: $\\dfrac{\\partial^2 z}{\\partial x^2}+\\dfrac{\\partial^2z}{\\partial y^2}=0$ (the Laplace equation) \u2014 this involves partial derivatives with respect to *two* different independent variables, $x$ and $y$."}, {"cat": "Differential Equations", "q": "Distinguish between ordinary and partial differential equations; and between order and degree of a differential equation.", "hint": "Ordinary = one independent variable; partial = more than one. Order = highest derivative; degree = power of that highest derivative.", "ans": "**Ordinary vs. partial \u2014 this is about how many independent variables are involved.**\n\nAn **ordinary differential equation (ODE)** involves derivatives of a function with respect to **only one** independent variable \u2014 e.g. $\\dfrac{dy}{dx}=3y$, where $y$ depends only on $x$.\n\nA **partial differential equation (PDE)** involves **partial** derivatives of a function with respect to **two or more** independent variables \u2014 e.g. $\\dfrac{\\partial^2z}{\\partial x^2}+\\dfrac{\\partial^2z}{\\partial y^2}=0$, where $z$ depends on both $x$ and $y$.\n\n**Order vs. degree \u2014 this is about the structure of a single differential equation, once you know which kind it is.**\n\nThe **order** of a differential equation is simply the order of the **highest derivative** that appears in the equation \u2014 count how many times differentiation has been applied, and take the highest count present. For example, $\\dfrac{d^2y}{dx^2}+3\\dfrac{dy}{dx}=0$ has order 2, because the highest derivative present is a second derivative.\n\nThe **degree** of a differential equation is the **power (exponent)** to which that highest-order derivative is raised, *once the equation has been written as a polynomial in its derivatives* (i.e. no derivatives inside square roots, fractions with derivatives in the denominator, etc. \u2014 you may need to rearrange/clear these first). For example, $\\left(\\dfrac{d^2y}{dx^2}\\right)^3+\\dfrac{dy}{dx}=0$ has degree 3, because the highest-order derivative, $\\frac{d^2y}{dx^2}$, is raised to the power 3.\n\n**Quick way to remember**: order = \"how many times did we differentiate\", degree = \"what power is that top derivative raised to\"."}, {"cat": "Differential Equations", "q": "Determine the order and degree of: (i) $\\dfrac{dy}{dx}=3y$ (ii) $\\dfrac{d^2y}{dx^2}+(x^2-5)\\dfrac{dy}{dx}+xy=0$ (iii) $\\left(\\dfrac{d^3y}{dx^3}\\right)^2+\\left(\\dfrac{d^2y}{dx^2}\\right)^5+\\dfrac{y}{x^2+1}=e^x$.", "hint": "Find the highest derivative present (order), then its power (degree).", "ans": "**The two-step check for each equation**: first, scan the equation and identify the derivative with the highest number of \"primes\" or highest order symbol present \u2014 that number is the **order**. Second, look at what power that specific highest-order derivative is raised to \u2014 that power is the **degree**.\n\n**(i) $\\dfrac{dy}{dx}=3y$.** The only derivative present is $\\dfrac{dy}{dx}$, a first derivative, so the highest (and only) order present is **1**. It appears raised to the power 1 (no exponent shown means power 1). **Order = 1, Degree = 1.**\n\n**(ii) $\\dfrac{d^2y}{dx^2}+(x^2-5)\\dfrac{dy}{dx}+xy=0$.** The derivatives present are $\\dfrac{d^2y}{dx^2}$ (second order) and $\\dfrac{dy}{dx}$ (first order). The highest of these is the second derivative, so **order = 2**. That highest-order term, $\\dfrac{d^2y}{dx^2}$, appears with no exponent shown, meaning power 1. **Order = 2, Degree = 1.**\n\n**(iii) $\\left(\\dfrac{d^3y}{dx^3}\\right)^2+\\left(\\dfrac{d^2y
