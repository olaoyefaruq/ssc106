<style>
  :root{
    --cream: #f6efe1;
    --cream-2: #efe4cd;
    --paper: #fffbf3;
    --ink: #241c12;
    --ink-soft: #55492f;
    --amber: #b8631a;
    --amber-deep: #8a4a12;
    --amber-bright: #d97e28;
    --line: #241c12;
    --green: #4f6b3a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; max-width:100%; overflow-x:hidden;}
  body{
    background: var(--cream);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(36,28,18,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    line-height: 1.5;
    padding: 0 0 80px 0;
    width: 100%;
  }
  h1,h2,h3, .display{
    font-family: 'Playfair Display', serif;
  }
  .hard-shadow{
    box-shadow: 6px 6px 0 var(--line);
  }
  .hard-shadow-sm{
    box-shadow: 4px 4px 0 var(--line);
  }
  /* ===== HEADER ===== */
  header{
    max-width: 980px;
    margin: 36px auto 28px auto;
    padding: 0 20px;
  }
  .masthead{
    background: var(--paper);
    border: 2.5px solid var(--line);
    border-radius: 4px;
    padding: 28px 30px 24px 30px;
    position: relative;
  }
  .kicker{
    font-size: 12.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--amber-deep);
    margin-bottom: 6px;
  }
  .masthead h1{
    font-size: 34px;
    font-weight: 700;
    margin: 0 0 8px 0;
    line-height: 1.15;
  }
  .masthead h1 em{
    font-style: italic;
    color: var(--amber);
  }
  .masthead p{
    font-size: 15px;
    color: var(--ink-soft);
    max-width: 640px;
    margin: 0;
  }
  .stats-row{
    display:flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .stat-chip{
    border: 1.5px solid var(--line);
    background: var(--cream-2);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
  }
  .stat-chip b{ color: var(--amber-deep); }

  /* ===== CONTROLS ===== */
  .controls{
    max-width: 980px;
    margin: 0 auto 22px auto;
    padding: 0 20px;
    display:flex;
    flex-direction: column;
    gap: 12px;
  }
  .search-wrap{
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 4px;
    display:flex;
    align-items:center;
    padding: 10px 14px;
  }
  .search-wrap input{
    border:none;
    outline:none;
    background:transparent;
    font-family:'DM Sans',sans-serif;
    font-size: 15px;
    width:100%;
    color: var(--ink);
  }
  .search-wrap input::placeholder{ color:#a8987a; }
  .search-icon{ margin-right:10px; font-size:15px; opacity:.6; }

  .tabs{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tab-btn{
    font-family:'DM Sans',sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 14px;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 20px;
    cursor:pointer;
    color: var(--ink);
    transition: transform .12s ease, background .12s ease;
  }
  .tab-btn:hover{ transform: translateY(-1px); }
  .tab-btn.active{
    background: var(--amber);
    color: var(--paper);
    border-color: var(--amber-deep);
  }
  .tab-btn .count{
    opacity:.65;
    font-weight:500;
    margin-left: 3px;
  }

  /* ===== QUESTIONS ===== */
  main{
    max-width: 980px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .category-heading{
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .1em;
    font-weight: 700;
    color: var(--amber-deep);
    margin: 34px 0 14px 2px;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .category-heading::after{
    content:'';
    flex:1;
    height: 1.5px;
    background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 11px);
    opacity: .5;
  }
  .qcard{
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 4px;
    padding: 20px 22px 18px 22px;
    margin-bottom: 16px;
    max-width: 100%;
    overflow: hidden;
  }
  .qcard-top{
    display:flex;
    gap: 12px;
    align-items:flex-start;
    min-width: 0;
  }
  .qnum{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-style: italic;
    font-size: 20px;
    color: var(--amber);
    min-width: 34px;
  }
  .qtext{
    font-size: 16px;
    line-height: 1.55;
    color: var(--ink);
    flex:1;
    min-width: 0;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .qtext .katex{ font-size: 1em; }
  .qtext .katex-display{
    display: block;
    overflow-x: auto;
    overflow-y: hidden;
    max-width: 100%;
    margin: 8px 0;
  }
  .btn-row{
    display:flex;
    gap: 10px;
    margin-top: 14px;
    margin-left: 46px;
    flex-wrap: wrap;
  }
  .qbtn{
    font-family:'DM Sans',sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: .03em;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 3px;
    border: 1.5px solid var(--line);
    cursor:pointer;
    background: var(--cream-2);
    color: var(--ink);
    transition: transform .1s ease;
  }
  .qbtn:hover{ transform: translateY(-1px); }
  .qbtn.hint-btn{
    background: #f4e0bd;
  }
  .qbtn.hint-btn.on{
    background: var(--amber-bright);
    color: var(--paper);
  }
  .qbtn.ans-btn{
    background: #e3ded0;
  }
  .qbtn.ans-btn.on{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .reveal{
    margin-left: 46px;
    margin-top: 12px;
    padding: 16px 18px;
    border-radius: 3px;
    font-size: 14.5px;
    line-height: 1.7;
    display:none;
    max-width: calc(100% - 46px);
    overflow: hidden;
  }
  .reveal.show{ display:block; animation: fadein .18s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(-3px);} to{opacity:1; transform:translateY(0);} }
  .reveal.hint{
    background: #fbf1dc;
    border: 1.5px dashed var(--amber);
    color: var(--amber-deep);
  }
  .reveal.hint::before{
    content: '\1F4A1  Hint';
    display:block;
    font-weight:700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 6px;
  }
  .reveal.answer{
    background: #fdfaf3;
    border: 1.5px solid var(--line);
    color: var(--ink);
  }
  .reveal.answer::before{
    content: '\2713  Full Worked Solution';
    display:block;
    font-weight:700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 10px;
    color: var(--green);
  }
  .reveal, .reveal p{
    max-width: 100%;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .reveal .katex{
    white-space: normal;
  }
  .reveal .katex-display{
    display: block;
    margin: 12px 0;
    padding: 2px 0;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }
  /* every display equation gets its own isolated block so two formulas can never sit on the same visual line */
  .math-block{
    display: block;
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    margin: 10px 0;
    -webkit-overflow-scrolling: touch;
  }
  .math-block .katex-display{ margin: 0; }
  .reveal p{ margin: 0 0 10px 0; }
  .reveal p:last-child{ margin-bottom: 0; }
  .reveal strong{ color: var(--amber-deep); }
  .reveal em{ font-style: italic; }

  .no-results{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-style: italic;
    font-family: 'Playfair Display', serif;
    font-size: 18px;
  }

  footer{
    max-width: 980px;
    margin: 40px auto 0 auto;
    padding: 18px 20px;
    text-align:center;
    color: var(--ink-soft);
    font-size: 12.5px;
  }

  @media (max-width: 600px){
    .masthead h1{ font-size: 26px; }
    .btn-row, .reveal{ margin-left: 0; }
    .qtext{ font-size: 15px; }
  }
</style>

<script>
const QUESTIONS = [{"cat": "Functions & Basic Concepts", "q": "With relevant examples, distinguish between Monomials and Polynomials.", "hint": "A monomial has one term. A polynomial is a sum of monomials.", "ans": "**Start with what a 'term' is.** In algebra, a term is a single piece of an expression made of numbers and variables multiplied together \u2014 no plus or minus sign hiding inside it. For example, $5x^3$ is one term; $2x^2y$ is one term.\n\n**Monomial** \u2014 the prefix 'mono' means *one*. A monomial is therefore an algebraic expression consisting of exactly **one** term, e.g. $5x^3$, $-7xy^2$, or even just the constant $9$.\n\n**Polynomial** \u2014 the prefix 'poly' means *many*. A polynomial is an expression made up of two or more terms connected by $+$ or $-$, e.g. $2x^3 - 5x^2 + 7x - 1$. Special names exist for small polynomials: two terms = **binomial** (e.g. $x+3$), three terms = **trinomial** (e.g. $x^2+2x+1$).\n\n**The subtle point**: technically, a single monomial is also considered a polynomial with just one term \u2014 'polynomial' is the umbrella category, and 'monomial' describes the one-term case within it. In everyday usage, though, people say 'polynomial' when they mean an expression with several terms, and 'monomial' when there's just one.\n\nSo: **monomial = one term**, **polynomial = general term for algebraic expressions built from added/subtracted terms (often meaning 2 or more).**"}, {"cat": "Functions & Basic Concepts", "q": "Define the term 'function' and give two examples.", "hint": "Think input $\\to$ unique output.", "ans": "**Definition.** A **function** is a rule that connects two sets of numbers (or objects) such that every input value from the first set (called the **domain**) is matched to *exactly one* output value in the second set (called the **range**). We write this as $y = f(x)$, read \"$y$ equals $f$ of $x$\", meaning $y$ is the output produced when the rule $f$ acts on the input $x$.\n\n**The key requirement \u2014 uniqueness.** For a relation to qualify as a function, each input must give *one and only one* output. If a single input could produce two different outputs, it would not be a function; it would just be a general relation. This is why, for instance, $x^2+y^2=25$ (a circle) is *not* a function of $x$ on its own \u2014 for $x=3$, $y$ could be $4$ or $-4$, i.e. two outputs from one input.\n\n**Example 1**: $f(x) = 2x+3$. This is a linear function. If $x=1$, then $f(1)=2(1)+3=5$; if $x=4$, then $f(4)=11$. Every $x$ gives exactly one $y$.\n\n**Example 2**: $f(x)=x^2$. If $x=3$, $f(3)=9$; if $x=-3$, $f(-3)=9$ also. Notice two *different inputs* can share the same output \u2014 that's fine, it's still a function, as long as each input only maps to one output."}, {"cat": "Functions & Basic Concepts", "q": "With appropriate examples, differentiate between explicit and implicit functions.", "hint": "Can you isolate $y$ by itself on one side?", "ans": "**The core question to ask**: has the equation already been solved for $y$, or are $x$ and $y$ still tangled together?\n\n**Explicit function.** Here $y$ is written *directly and completely* in terms of $x$, on its own on one side of the equation: $y = f(x)$. You can plug in any $x$ and immediately compute $y$ with no further algebra. Example: $y = 3x^2+2$. If $x=1$, then straightaway $y=3(1)+2=5$.\n\n**Implicit function.** Here $x$ and $y$ appear mixed together in the same equation, and $y$ has *not* been isolated: $F(x,y)=0$. You cannot simply \"read off\" $y$ for a given $x$ without doing extra algebra (and sometimes it's impossible to isolate $y$ at all). Example: $x^2+y^2=25$ (the equation of a circle of radius 5). To find $y$ for $x=3$, you must rearrange: $y^2=25-9=16$, so $y=\\pm4$ \u2014 and even then you get *two* possible values, showing why implicit equations don't automatically behave like clean functions.\n\n**Why it matters practically**: many economic relationships are naturally implicit (e.g. a budget constraint $P_xX+P_yY=M$), and you often need implicit differentiation to find $\\dfrac{dy}{dx}$ without first solving for $y$ explicitly."}, {"cat": "Functions & Basic Concepts", "q": "Distinguish between trigonometric and exponential functions, with examples.", "hint": "One repeats in cycles; the other grows/decays continuously.", "ans": "**Trigonometric functions** come from the geometry of a right-angled triangle \u2014 they express the ratio between two sides of the triangle as a function of one of its angles. The most familiar are $\\sin\\theta$, $\\cos\\theta$, and $\\tan\\theta$. Their defining behavioural feature is that they are **periodic**: the output repeats itself over and over as the angle increases, always staying between fixed bounds (for sine and cosine, between $-1$ and $1$). Example: $y=\\sin x$ \u2014 as $x$ increases from $0$ to $2\\pi$ (360\u00b0), $y$ rises to 1, falls to $-1$, and returns to 0, then repeats this cycle forever.\n\n**Exponential functions** have the independent variable sitting in the *exponent* rather than the base: $y=b^x$ (or, most commonly in calculus, $y=e^x$, where $e\\approx2.71828$). Their defining behavioural feature is that the rate at which they grow (or decay) is proportional to their current size \u2014 the bigger $y$ gets, the faster it grows. Example: $y=e^x$ \u2014 as $x$ increases, $y$ keeps climbing faster and faster, with no upper bound and no repeating pattern.\n\n**The contrast in one line**: trig functions oscillate between bounded values forever; exponential functions (for base $>1$) grow without bound and never repeat \u2014 they are monotonic (always moving in one direction)."}, {"cat": "Functions & Basic Concepts", "q": "Distinguish between monotonic function and polynomial function.", "hint": "Monotonic describes *behaviour* (always rising or falling); polynomial describes *form* (powers of $x$).", "ans": "These two terms answer completely different questions about a function, so it helps to separate *what the function looks like* from *how the function behaves*.\n\n**Polynomial function \u2014 describes FORM.** A function is polynomial if it can be written as a sum of terms, each of which is a constant times a whole-number power of $x$: $f(x) = a_nx^n + a_{n-1}x^{n-1} + \\cdots + a_1x + a_0$. This is purely about the algebraic *shape* of the expression \u2014 nothing about how it behaves as $x$ changes.\n\n**Monotonic function \u2014 describes BEHAVIOUR.** A function is monotonic if, as $x$ increases across its whole domain, $y$ *never changes direction*: it is either always non-decreasing (monotonically increasing) or always non-increasing (monotonically decreasing). This says nothing about the algebraic form \u2014 a monotonic function could be a straight line, a curve, an exponential, anything, as long as it never \"turns around\".\n\n**Why they're not the same thing, with examples**:\n- $y = x$ is *both* polynomial (degree 1) *and* monotonic (always increasing).\n- $y = x^2$ is polynomial (degree 2), but it is **not** monotonic over all real numbers \u2014 it decreases for $x<0$ and increases for $x>0$, i.e. it turns around at $x=0$.\n- $y = e^x$ is monotonic (always increasing) but is **not** a polynomial \u2014 no finite sum of powers of $x$ can produce it.\n\nSo a function can be one, both, or neither \u2014 the categories overlap but measure different things."}, {"cat": "Functions & Basic Concepts", "q": "With appropriate example, make a clear distinction between rational function and trigonometric function.", "hint": "One is a ratio of polynomials; the other involves angles.", "ans": "**Rational function.** Recall that in ordinary arithmetic, a \"rational number\" is one that can be written as a fraction of two whole numbers, like $\\frac{3}{4}$. A **rational function** follows the same idea but with polynomials instead of whole numbers: it is the ratio (fraction) of two polynomials, $f(x)=\\dfrac{p(x)}{q(x)}$, where $q(x)\\neq 0$. Example: $f(x)=\\dfrac{x^2-1}{x+2}$. Because you're dividing by an expression containing $x$, rational functions can have **vertical asymptotes** \u2014 values of $x$ that make the denominator zero and must be excluded from the domain (here, $x=-2$ is excluded).\n\n**Trigonometric function.** As covered earlier, this is a function built from the ratios of sides in a right triangle relative to an angle \u2014 $\\sin x$, $\\cos x$, $\\tan x$, etc. Example: $f(x)=\\tan x = \\dfrac{\\sin x}{\\cos x}$.\n\n**Key structural difference**: a rational function is built purely from polynomials (powers of $x$) divided by each other; a trigonometric function is built from angle-based ratios and is periodic. Interestingly, $\\tan x$ is technically *also* a ratio (of $\\sin x$ over $\\cos x$), but because $\\sin x$ and $\\cos x$ are not polynomials, $\\tan x$ is not classified as a rational function \u2014 it's still trigonometric."}, {"cat": "Functions & Basic Concepts", "q": "Identify the type of each function: (i) $y=7^x$ (ii) $y=4x^3-6x^2+8x-1$ (iii) $y=ax^b$ ($a\\neq0, b\\neq0$).", "hint": "Look at where the variable sits: is it the base or the exponent?", "ans": "**The method**: look carefully at *where* the letter $x$ sits in the expression \u2014 is it the base being raised to a fixed power, or is it up in the exponent with a fixed base? That single distinction tells you the type.\n\n**(i) $y=7^x$.** Here the base is the fixed number $7$, and the variable $x$ is in the exponent. Whenever the variable is the *exponent*, the function is called an **exponential function**.\n\n**(ii) $y=4x^3-6x^2+8x-1$.** This is a sum of terms, each a constant multiplied by a whole-number power of $x$ ($x^3$, $x^2$, $x^1$, $x^0$). This is the definition of a **polynomial function** \u2014 specifically, since the highest power is 3, it's called a *cubic* polynomial.\n\n**(iii) $y=ax^b$.** Here the variable $x$ is the **base**, and the exponent $b$ is a fixed constant. Whenever the variable is the *base* raised to a fixed power, the function is called a **power function**.\n\n**Quick rule of thumb to remember**: variable in the exponent \u2192 exponential; variable in the base \u2192 power (or polynomial, if it's a sum of several such terms)."}, {"cat": "Functions & Basic Concepts", "q": "With relevant examples, identify and explain the three main classes of transcendental functions.", "hint": "Transcendental = 'not algebraic'. Think of the functions that can't be built from finite +, \u2212, \u00d7, \u00f7, and roots of $x$.", "ans": "**What 'transcendental' means.** An **algebraic function** is any function you can build using only a finite number of additions, subtractions, multiplications, divisions, and roots applied to $x$ \u2014 e.g. $x^2+3x$, or $\\sqrt{x}$. A **transcendental function** is one that *cannot* be constructed this way \u2014 it \"transcends\" ordinary algebra. These functions typically arise from calculus, geometry, or growth processes rather than simple arithmetic combinations.\n\n**The three main classes, explained one by one:**\n\n1. **Exponential functions**: $y=b^x$ or, most commonly, $y=e^x$ (where $e \\approx 2.71828$ is a special mathematical constant). The variable sits in the exponent. Example: $y=e^{2x}$. These model continuous growth or decay (population growth, compound interest, radioactive decay).\n\n2. **Logarithmic functions**: $y=\\log_b x$, most commonly $y=\\ln x$ (log base $e$). A logarithm answers the question \"to what power must I raise the base to get this number?\" Logarithmic functions are the **inverse** of exponential functions \u2014 they undo what exponentiation does. Example: $y=\\ln x$.\n\n3. **Trigonometric functions**: $y=\\sin x, \\cos x, \\tan x$, etc., built from angle-based ratios. Example: $y=\\cos x$.\n\nYou cannot write any of these three as a finite combination of $+,-,\\times,\\div$, and roots of $x$ alone \u2014 that's precisely what makes them transcendental rather than algebraic."}, {"cat": "Functions & Basic Concepts", "q": "Highlight three examples of non-algebraic functions with relevant examples.", "hint": "Same idea as transcendental functions above.", "ans": "'Non-algebraic' is another name for **transcendental**, i.e. functions that cannot be built purely from a finite sequence of $+, -, \\times, \\div$ and roots applied to $x$. Three clear examples:\n\n1. **Exponential**: $y = e^{2x}$ \u2014 variable in the exponent, models continuous growth.\n2. **Logarithmic**: $y = \\ln x$ \u2014 the inverse of an exponential; answers \"what power gives this value?\"\n3. **Trigonometric**: $y = \\cos x$ \u2014 built from angle ratios, periodic (repeats forever).\n\nA fourth category sometimes mentioned is **hyperbolic functions**, e.g. $y = \\sinh x = \\dfrac{e^x - e^{-x}}{2}$, which behave similarly to trig functions but are built from exponentials instead of angles."}, {"cat": "Functions & Basic Concepts", "q": "Distinguish between the functions $y = x^b$ ($b \\neq 0$) and $y = b^x$ ($b > 1$).", "hint": "Which one has the variable as the base, and which has it as the exponent?", "ans": "This is exactly the base-versus-exponent distinction from earlier, applied to a specific pair of functions \u2014 and it's worth being very precise about it since it's repeated across several past papers.\n\n**$y = x^b$** \u2014 here $x$ is the **base** (the thing being raised to a power) and $b$ is a **fixed constant exponent**. This is called a **power function**. Example: with $b=3$, $y=x^3$. As $x$ grows, $y$ grows according to a fixed power \u2014 the growth rate is *polynomial*.\n\n**$y = b^x$** \u2014 here $b$ is a **fixed constant base** and $x$ is the **exponent**, which is now the variable. This is called an **exponential function**. Example: with $b=3$, $y=3^x$. As $x$ grows, $y$ grows because the exponent itself is increasing \u2014 the growth rate is *exponential*.\n\n**Why the distinction matters for size/growth**: for large values of $x$, an exponential function $b^x$ (with $b>1$) will *always* eventually grow faster than any power function $x^b$, no matter how large the fixed power $b$ is. This is a fundamental fact used throughout economics and mathematics \u2014 exponential growth eventually dominates polynomial growth."}, {"cat": "Functions & Basic Concepts", "q": "Given the functions, determine whether each is even or odd: (i) $f(x)=4x^4-7x^2$ (ii) $f(x)=\\cos x$ (iii) $f(x)=\\frac{1}{x}+\\sqrt[3]{x}$ (iv) $f(x)=3^x+3^{-x}$.", "hint": "Test $f(-x)$: if $f(-x)=f(x)$ it's even; if $f(-x)=-f(x)$ it's odd.", "ans": "**The definitions you need first.**\n- A function is **even** if replacing $x$ with $-x$ leaves the function completely unchanged: $f(-x)=f(x)$. Graphically, this means the graph is a mirror image across the $y$-axis.\n- A function is **odd** if replacing $x$ with $-x$ flips the sign of the whole function: $f(-x)=-f(x)$. Graphically, the graph has 180\u00b0 rotational symmetry about the origin.\n\n**The method**: substitute $-x$ everywhere you see $x$ in the original function, simplify carefully (being especially careful with signs on odd powers), and compare the result to the original $f(x)$.\n\n**(i) $f(x)=4x^4-7x^2$.** Substitute: $f(-x)=4(-x)^4-7(-x)^2$. Since $(-x)^4=x^4$ (an even power kills the negative sign) and $(-x)^2=x^2$ (same reason), we get $f(-x)=4x^4-7x^2=f(x)$. Because $f(-x)=f(x)$, this function is **even**. (Notice both powers involved, 4 and 2, are even numbers \u2014 that's a strong clue.)\n\n**(ii) $f(x)=\\cos x$.** From basic trigonometry, cosine is symmetric about the $y$-axis: $\\cos(-x)=\\cos x$. So $f(-x)=f(x)$ \u2014 **even**.\n\n**(iii) $f(x)=\\dfrac{1}{x}+\\sqrt[3]{x}$.** Substitute: $f(-x)=\\dfrac{1}{-x}+\\sqrt[3]{-x} = -\\dfrac{1}{x}-\\sqrt[3]{x}$ (a cube root of a negative number is negative, and $\\frac{1}{-x}=-\\frac1x$). Factor out the minus sign: $f(-x) = -\\left(\\dfrac1x+\\sqrt[3]{x}\\right) = -f(x)$. Since $f(-x)=-f(x)$, this function is **odd**.\n\n**(iv) $f(x)=3^x+3^{-x}$.** Substitute: $f(-x)=3^{-x}+3^{-(-x)}=3^{-x}+3^{x}$. This is just the two terms of the original written in the opposite order \u2014 addition doesn't care about order, so $f(-x)=3^x+3^{-x}=f(x)$ \u2014 **even**."}, {"cat": "Functions & Basic Concepts", "q": "If $f(x) = 1 + x^2 + x^4$, show that $f(-a) = f(a)$ for all values of $a$.", "hint": "Substitute $-a$ for every $x$ and simplify \u2014 odd powers of $-a$ flip sign, even powers don't.", "ans": "**The key rule of signs you need**: when you raise a negative number to a power, the sign of the result depends on whether the power (exponent) is even or odd.\n- Negative number raised to an **even** power \u2192 result is **positive** (the negative signs cancel in pairs). E.g. $(-2)^2 = 4$, $(-2)^4=16$.\n- Negative number raised to an **odd** power \u2192 result stays **negative**. E.g. $(-2)^3=-8$.\n\n**Applying this to the problem.** We are given $f(x)=1+x^2+x^4$. To find $f(-a)$, replace every occurrence of $x$ with $-a$:\n$$f(-a) = 1 + (-a)^2 + (-a)^4$$\n\nNow evaluate each power separately, using the sign rule above:\n- $(-a)^2$: exponent 2 is even, so $(-a)^2 = a^2$.\n- $(-a)^4$: exponent 4 is even, so $(-a)^4 = a^4$.\n\nSubstituting these back in:\n$$f(-a) = 1 + a^2 + a^4$$\n\nBut this is exactly the same expression as $f(a) = 1 + a^2 + a^4$. Therefore:\n$$f(-a) = f(a)$$\n\n**Why this happened**: every single power of $x$ appearing in $f(x)$ \u2014 namely $x^0$ (the constant 1), $x^2$, and $x^4$ \u2014 is an *even* power. Whenever a function is built entirely from even powers of $x$, it is automatically an **even function**, and the property $f(-a)=f(a)$ follows immediately, for any value of $a$ you choose, not just a specific one."}, {"cat": "Functions & Basic Concepts", "q": "Establish whether $Y = 3X^2$ is homogeneous and determine its degree of homogeneity.", "hint": "Replace $X$ with $\\lambda X$ and see what power of $\\lambda$ pulls out.", "ans": "**What 'homogeneous' means, from first principles.** A function is called **homogeneous of degree $n$** if, when you scale *every* independent variable by the same factor $\\lambda$ (lambda, representing 'any positive number, like doubling or tripling'), the *entire function's output* scales by exactly $\\lambda^n$. In symbols: $f(\\lambda X) = \\lambda^n f(X)$. The number $n$ that appears is called the **degree of homogeneity**, and it tells you how sensitively the output responds to proportional scaling of the inputs \u2014 this concept is hugely important in economics for describing \"returns to scale\".\n\n**The test procedure, step by step:**\n1. Take the original function.\n2. Replace every occurrence of the independent variable with $\\lambda$ times that variable.\n3. Simplify the expression and try to factor out a power of $\\lambda$.\n4. If you can write the result as (some power of $\\lambda$) $\\times$ (the original function), the function is homogeneous, and that power is the degree.\n\n**Applying it here.** We have $Y = 3X^2$. Replace $X$ with $\\lambda X$:\n$$Y(\\lambda X) = 3(\\lambda X)^2$$\n\nExpand $(\\lambda X)^2 = \\lambda^2 X^2$ (both the $\\lambda$ and the $X$ get squared, since squaring applies to the whole product):\n$$Y(\\lambda X) = 3\\lambda^2 X^2$$\n\nNow regroup, pulling the $\\lambda^2$ out to the front and recognising that $3X^2$ is exactly the original function:\n$$Y(\\lambda X) = \\lambda^2 \\cdot (3X^2) = \\lambda^2 \\cdot Y$$\n\nSince the whole function scaled by exactly $\\lambda^2$, we conclude: **$Y$ is homogeneous, and its degree of homogeneity is 2.** Economically, this would mean that if you doubled the input $X$ ($\\lambda=2$), the output would increase by $2^2=4$ times \u2014 a strong form of increasing returns."}, {"cat": "Functions & Basic Concepts", "q": "Explain any five reasons for the increasing use of mathematics as a tool and language of analysis in the social sciences.", "hint": "Think precision, prediction, testing, and communication.", "ans": "Social sciences (like economics, sociology, political science) study human behaviour, which is naturally messy and hard to pin down in words alone. Mathematics has become central to these fields for several concrete reasons:\n\n1. **Precision and lack of ambiguity.** Ordinary language is often vague \u2014 saying \"demand tends to fall when price rises\" doesn't tell you *how much* it falls. A mathematical statement like $Q_d = 100 - 2P$ removes all ambiguity: for every 1-unit rise in price, quantity demanded falls by exactly 2 units.\n\n2. **Logical rigor and internal consistency.** When a theory is expressed mathematically, every assumption must be stated explicitly (you cannot \"hide\" an assumption inside vague wording), and the conclusions follow by strict logical/algebraic steps. This exposes weak or inconsistent reasoning that might otherwise slip past in a purely verbal argument.\n\n3. **Prediction and quantification.** A mathematical model doesn't just describe direction of change \u2014 it lets you calculate specific numerical forecasts. For example, given a cost function, you can calculate exactly how much total cost will rise if output increases by a specific number of units.\n\n4. **Testability against real data.** Mathematical/statistical models can be fitted to actual data and formally tested \u2014 you can check whether a theory's predictions match observed outcomes (e.g. using regression analysis), something far harder to do rigorously with purely descriptive theories.\n\n5. **Compactness and universal communication.** A single well-chosen equation can summarize a relationship that might otherwise take several paragraphs of prose to describe, and \u2014 unlike natural language \u2014 mathematical notation means the same thing to researchers regardless of what language they speak, making it a genuinely international language of analysis."}, {"cat": "Differentiation", "q": "Differentiate between the quotient rule and the product rule of differentiation.", "hint": "One is for functions multiplied together; the other for functions divided.", "ans": "Both rules exist because you cannot simply differentiate two combined functions term-by-term the way you can with addition \u2014 multiplication and division of functions require special formulas.\n\n**Product rule** \u2014 used when two functions of $x$, call them $u$ and $v$, are **multiplied**: $y = u \\cdot v$. The rule states:\n$$\\frac{dy}{dx} = u\\frac{dv}{dx} + v\\frac{du}{dx}$$\nIn words: *(first function) \u00d7 (derivative of second) + (second function) \u00d7 (derivative of first)*. You differentiate each function in turn while keeping the other one as it is, and add the two results.\n\n**Quotient rule** \u2014 used when one function is **divided** by another: $y = \\dfrac{u}{v}$. The rule states:\n$$\\frac{dy}{dx} = \\frac{v\\frac{du}{dx} - u\\frac{dv}{dx}}{v^2}$$\nIn words: *(bottom \u00d7 derivative of top, minus top \u00d7 derivative of bottom), all divided by (bottom squared)*. Order matters here (unlike the product rule) because subtraction is not symmetric \u2014 get the top and bottom the wrong way round and you'll get the wrong sign.\n\n**When to use which**: look at the operation directly connecting the two functions. If it's $\\times$, use the product rule; if it's $\\div$ (a fraction), use the quotient rule. (Tip: sometimes a quotient can be rewritten using negative exponents, e.g. $\\frac{u}{v}=u\\cdot v^{-1}$, and then handled with the product rule plus the chain rule instead \u2014 both approaches give the same answer.)"}, {"cat": "Differentiation", "q": "Find the derivative of $y = \\dfrac{10x^8 - 6x^7}{2x}$.", "hint": "Simplify by dividing each term by $2x$ first \u2014 you don't need the quotient rule here.", "ans": "**Don't reach for the quotient rule immediately** \u2014 always check first whether the expression can be simplified by ordinary division, since that saves a lot of unnecessary work.\n\n**Step 1 \u2014 simplify the fraction.** Since every term in the numerator is being divided by the same denominator $2x$, split the fraction into two separate fractions and simplify each individually:\n$$y = \\frac{10x^8}{2x} - \\frac{6x^7}{2x}$$\n\nFor the first term: $\\dfrac{10x^8}{2x} = \\dfrac{10}{2}\\cdot\\dfrac{x^8}{x} = 5x^{8-1}=5x^7$ (recall the exponent rule $\\frac{x^a}{x^b}=x^{a-b}$).\n\nFor the second term: $\\dfrac{6x^7}{2x} = \\dfrac{6}{2}\\cdot\\dfrac{x^7}{x} = 3x^{7-1}=3x^6$.\n\nSo the whole function simplifies to:\n$$y = 5x^7 - 3x^6$$\n\n**Step 2 \u2014 apply the power rule.** Recall the **power rule** of differentiation: if $y=x^n$, then $\\dfrac{dy}{dx}=nx^{n-1}$ (bring the exponent down as a multiplying constant, then reduce the exponent by 1). Apply this to each term separately (differentiation of a sum is just the sum of the derivatives):\n\n- For $5x^7$: bring down the 7, multiply by the existing 5, reduce the power by 1 \u2192 $5 \\times 7\\, x^{7-1} = 35x^6$.\n- For $-3x^6$: bring down the 6, multiply by $-3$, reduce the power by 1 \u2192 $-3\\times6\\,x^{6-1} = -18x^5$.\n\n**Final answer**: $\\dfrac{dy}{dx} = 35x^6 - 18x^5$."}, {"cat": "Differentiation", "q": "Find the derivative of $y = (3x^4 + 5)^6$.", "hint": "Use the chain rule: derivative of the outside, times derivative of the inside.", "ans": "**Why we need the chain rule here.** This function is a \"function inside a function\" \u2014 we have something raised to the power 6, and that \"something\" ($3x^4+5$) is itself a function of $x$. Whenever you see one function nested inside another like this, you need the **chain rule**.\n\n**The chain rule, explained.** If $y = f(g(x))$ \u2014 i.e. $y$ depends on an 'inner' expression $u=g(x)$, and then a further rule $f$ is applied to $u$ \u2014 then:\n$$\\frac{dy}{dx} = \\frac{dy}{du}\\cdot\\frac{du}{dx}$$\nIn plain words: **differentiate the outer function first (treating the inner part as a single block), then multiply by the derivative of that inner part.**\n\n**Step 1 \u2014 identify the inner and outer parts.** Let $u = 3x^4+5$ (the \"inside\"). Then the whole expression becomes $y = u^6$ (the \"outside\" \u2014 a simple power function of $u$).\n\n**Step 2 \u2014 differentiate the outer function w.r.t. $u$**, treating $u$ as if it were just a single variable (using the ordinary power rule): \n$$\\frac{dy}{du} = 6u^5$$\n\n**Step 3 \u2014 differentiate the inner function w.r.t. $x$**:\n$$u = 3x^4+5 \\quad\\Rightarrow\\quad \\frac{du}{dx} = 12x^3$$\n(the derivative of $3x^4$ is $3\\times4\\,x^3=12x^3$, and the derivative of the constant $5$ is $0$).\n\n**Step 4 \u2014 multiply the two pieces together (this is the chain rule in action)**:\n$$\\frac{dy}{dx} = 6u^5 \\cdot 12x^3 = 72x^3u^5$$\n\n**Step 5 \u2014 substitute back what $u$ actually is**, since the final answer should be in terms of $x$ only, not $u$:\n$$\\frac{dy}{dx} = 72x^3(3x^4+5)^5$$"}, {"cat": "Differentiation", "q": "If $f(x) = \\dfrac{x^2}{(2x-1)^3}$, find $f'(x)$.", "hint": "Quotient rule with $u=x^2$, $v=(2x-1)^3$ (chain rule needed for $v'$).", "ans": "This problem needs **two rules working together**: the quotient rule (because we have one function divided by another) and, inside that, the chain rule (because the denominator itself is a function raised to a power).\n\n**Step 1 \u2014 label the top and bottom.** Let $u = x^2$ (the numerator) and $v = (2x-1)^3$ (the denominator).\n\n**Step 2 \u2014 differentiate $u$.** By the simple power rule: $u' = 2x$.\n\n**Step 3 \u2014 differentiate $v$ using the chain rule**, since $v$ is \"(something) cubed\": let the inner part be $2x-1$, whose derivative is $2$. So:\n$$v' = 3(2x-1)^2 \\cdot 2 = 6(2x-1)^2$$\n\n**Step 4 \u2014 apply the quotient rule formula**: $f'(x) = \\dfrac{vu'-uv'}{v^2}$. Substitute everything in:\n$$f'(x) = \\frac{(2x-1)^3(2x) - x^2\\cdot 6(2x-1)^2}{[(2x-1)^3]^2} = \\frac{2x(2x-1)^3 - 6x^2(2x-1)^2}{(2x-1)^6}$$\n\n**Step 5 \u2014 simplify by factoring.** Notice both terms in the numerator share a common factor of $(2x-1)^2$ (the smaller power present in both). Pull it out:\n$$= \\frac{(2x-1)^2\\left[2x(2x-1) - 6x^2\\right]}{(2x-1)^6}$$\n\n**Step 6 \u2014 cancel the common power of $(2x-1)$** between numerator and denominator ($\\frac{(2x-1)^2}{(2x-1)^6}=\\frac{1}{(2x-1)^4}$):\n$$= \\frac{2x(2x-1)-6x^2}{(2x-1)^4}$$\n\n**Step 7 \u2014 expand and simplify the numerator.** $2x(2x-1) = 4x^2-2x$. So the numerator becomes $4x^2-2x-6x^2 = -2x^2-2x = -2x(x+1)$.\n\n**Final answer**: $f'(x) = \\dfrac{-2x(x+1)}{(2x-1)^4}$."}, {"cat": "Differentiation", "q": "The total sales $s(t) = \\dfrac{125t^2}{t^2+100}$ months after launch. Find $s'(t)$ and briefly interpret.", "hint": "Quotient rule; interpretation is about marginal/rate of change of sales over time.", "ans": "**Step 1 \u2014 identify top and bottom.** Let $u=125t^2$ (numerator) and $v=t^2+100$ (denominator).\n\n**Step 2 \u2014 differentiate each with the power rule.** $u' = 250t$. $v' = 2t$ (the derivative of the constant 100 is zero).\n\n**Step 3 \u2014 apply the quotient rule**, $s'(t) = \\dfrac{vu'-uv'}{v^2}$:\n$$s'(t) = \\frac{(t^2+100)(250t) - (125t^2)(2t)}{(t^2+100)^2}$$\n\n**Step 4 \u2014 expand the numerator carefully.** $(t^2+100)(250t) = 250t^3+25000t$. And $(125t^2)(2t) = 250t^3$. Subtracting: $250t^3+25000t-250t^3 = 25000t$ (the $250t^3$ terms cancel exactly).\n\n**Final derivative**: \n$$s'(t) = \\frac{25000t}{(t^2+100)^2}$$\n\n**What this derivative *means* (interpretation)**: $s'(t)$ tells us the *rate* at which cumulative sales are increasing at time $t$ \u2014 think of it as the \"speed\" of sales growth. Two things stand out:\n- For any $t>0$, $s'(t)$ is positive, so sales keep rising after launch \u2014 good news, sales never fall over time in this model.\n- But look at the *shape*: the numerator grows only proportionally to $t$ (linearly), while the denominator grows much faster, proportional to $t^4$ once squared out. This means as $t$ gets larger and larger, $s'(t)$ shrinks toward zero \u2014 sales growth **slows down** over time, even though sales are still technically increasing. This describes a market that is gradually **saturating**: early sales growth is fast, but it tapers off as the market becomes more fully served."}, {"cat": "Differentiation", "q": "Given $f(x) = x^3 + 9x^2 + 24x - 10$, find the critical values and classify the local maxima/minima.", "hint": "Set $f'(x)=0$, solve for $x$, then use $f''(x)$ to classify.", "ans": "**The general strategy for finding and classifying turning points** always has the same two stages: (1) find where the slope is zero (candidates for max/min), using the **first derivative**; (2) determine whether each candidate is a peak, a valley, or neither, using the **second derivative**.\n\n**Step 1 \u2014 find the first derivative.** Differentiate term by term using the power rule:\n$$f'(x) = 3x^2 + 18x + 24$$\n\n**Step 2 \u2014 find the critical values by setting $f'(x)=0$.** These are the $x$-values where the graph's slope is momentarily flat (a necessary condition for a peak or valley \u2014 the tangent line is horizontal there):\n$$3x^2+18x+24=0$$\nDivide everything by 3 to simplify: $x^2+6x+8=0$. Factor this quadratic: we need two numbers that multiply to 8 and add to 6 \u2014 those are 2 and 4. So $(x+2)(x+4)=0$, giving critical values $x=-2$ and $x=-4$.\n\n**Step 3 \u2014 find the second derivative**, which tells us the *concavity* (curvature) of the function at each point:\n$$f''(x) = 6x+18$$\n\n**Step 4 \u2014 apply the second-derivative test** at each critical value. The rule is: if $f''(x_0)<0$ the curve is concave **down** there (shaped like a hill \u2229), meaning it's a **local maximum**; if $f''(x_0)>0$ the curve is concave **up** (shaped like a valley \u222a), meaning it's a **local minimum**.\n\n- At $x=-4$: $f''(-4)=6(-4)+18=-24+18=-6$, which is negative \u2192 **local maximum**.\n- At $x=-2$: $f''(-2)=6(-2)+18=-12+18=6$, which is positive \u2192 **local minimum**.\n\n**Step 5 \u2014 find the actual function values (the $y$-coordinates)** by substituting back into the original $f(x)$:\n- $f(-4) = (-4)^3+9(-4)^2+24(-4)-10 = -64+144-96-10 = -26$.\n- $f(-2) = (-2)^3+9(-2)^2+24(-2)-10 = -8+36-48-10 = -30$.\n\n**Summary**: local maximum at the point $(-4,-26)$; local minimum at the point $(-2,-30)$."}, {"cat": "Differentiation", "q": "Find $\\dfrac{dy}{dx}$ if $y = \\dfrac{\\sin x}{\\cos x}$.", "hint": "This is $\\tan x$ \u2014 but derive it with the quotient rule to show the work.", "ans": "**Recognise the setup**: this is a quotient of two trigonometric functions, so the quotient rule applies with $u=\\sin x$ and $v=\\cos x$.\n\n**Step 1 \u2014 recall the derivatives of sine and cosine** (these are standard results you should know): $\\dfrac{d}{dx}(\\sin x) = \\cos x$, and $\\dfrac{d}{dx}(\\cos x) = -\\sin x$. So $u'=\\cos x$ and $v'=-\\sin x$.\n\n**Step 2 \u2014 apply the quotient rule**, $\\dfrac{dy}{dx}=\\dfrac{vu'-uv'}{v^2}$:\n$$\\frac{dy}{dx} = \\frac{\\cos x\\cdot\\cos x - \\sin x\\cdot(-\\sin x)}{\\cos^2 x} = \\frac{\\cos^2x + \\sin^2x}{\\cos^2x}$$\n\n(Note the double negative: subtracting $\\sin x \\times (-\\sin x)$ is the same as *adding* $\\sin^2 x$.)\n\n**Step 3 \u2014 use the Pythagorean identity.** Recall the fundamental trig identity $\\sin^2x+\\cos^2x=1$ (this comes from Pythagoras' theorem applied to the unit circle). So the numerator simplifies straight to 1:\n$$\\frac{dy}{dx} = \\frac{1}{\\cos^2x}$$\n\n**Step 4 \u2014 express in standard notation.** Since $\\dfrac{1}{\\cos x} = \\sec x$ by definition, $\\dfrac{1}{\\cos^2x}=\\sec^2x$.\n\n**Final answer**: $\\dfrac{dy}{dx} = \\sec^2x$. This confirms the well-known standard result that the derivative of $\\tan x$ is $\\sec^2x$ (since $y=\\frac{\\sin x}{\\cos x}$ is exactly the definition of $\\tan x$)."}, {"cat": "Differentiation", "q": "If $Y = \\log(e^x - e^{-x})$, find $\\dfrac{dy}{dx}$.", "hint": "Chain rule: derivative of $\\log u$ is $\\frac{u'}{u}$.", "ans": "**The rule you need**: for a natural logarithm of some inner expression, $y=\\log(u)$ where $u$ is a function of $x$, the chain rule gives $\\dfrac{dy}{dx} = \\dfrac{1}{u}\\cdot\\dfrac{du}{dx} = \\dfrac{u'}{u}$. In words: *derivative of the inside, divided by the inside itself.* This is one of the most frequently used derivative shortcuts in this course, so it's worth memorizing.\n\n**Step 1 \u2014 identify the inner function**: $u = e^x - e^{-x}$.\n\n**Step 2 \u2014 differentiate $u$ with respect to $x$.** Recall that $\\dfrac{d}{dx}(e^x) = e^x$ (the exponential function is its own derivative \u2014 a unique and important property). For the second term, $e^{-x}$, we need the chain rule again: the derivative of the inner exponent $-x$ is $-1$, so $\\dfrac{d}{dx}(e^{-x}) = -e^{-x}$. Putting these together, remembering we're subtracting the second term:\n$$u' = e^x - (-e^{-x}) = e^x + e^{-x}$$\n(Subtracting a negative becomes addition \u2014 a common sign trap in this type of problem.)\n\n**Step 3 \u2014 apply the log-derivative rule** $\\dfrac{u'}{u}$:\n$$\\frac{dy}{dx} = \\frac{e^x+e^{-x}}{e^x-e^{-x}}$$\n\nThis is the final simplified answer \u2014 it cannot be reduced further without a specific value of $x$."}, {"cat": "Differentiation", "q": "If $y = xe^{-x}$, show that $\\dfrac{d^2y}{dx^2} + 2\\dfrac{dy}{dx} + y = 0$.", "hint": "Find $y'$ (product rule), then $y''$, then substitute all three into the expression.", "ans": "This is a **verification problem**: we're not solving for anything new, but checking that three related expressions \u2014 $y$, $y'$, and $y''$ \u2014 combine to satisfy a given equation. The strategy is straightforward: carefully compute each derivative in turn, then substitute all of them into the target expression and simplify until it collapses to zero.\n\n**Step 1 \u2014 find $y'$ using the product rule.** $y=xe^{-x}$ is a product of $x$ and $e^{-x}$, so let $u=x$ ($u'=1$) and $v=e^{-x}$ ($v'=-e^{-x}$, by the chain rule, since the derivative of the exponent $-x$ is $-1$). Product rule: $y' = uv'+vu'$:\n$$y' = x(-e^{-x}) + e^{-x}(1) = -xe^{-x}+e^{-x} = e^{-x}(1-x)$$\n(Factoring out the common $e^{-x}$ makes the next differentiation much easier.)\n\n**Step 2 \u2014 find $y''$ by differentiating $y'=e^{-x}(1-x)$**, again a product, with $u=e^{-x}$ ($u'=-e^{-x}$) and $v=(1-x)$ ($v'=-1$):\n$$y'' = e^{-x}(-1) + (1-x)(-e^{-x}) = -e^{-x} - e^{-x}(1-x)$$\nFactor out $-e^{-x}$ from both terms: $y'' = -e^{-x}\\left[1+(1-x)\\right] = -e^{-x}(2-x) = e^{-x}(x-2)$.\n\n**Step 3 \u2014 substitute $y$, $y'$, and $y''$ into the left-hand side of the target expression**:\n$$y''+2y'+y = e^{-x}(x-2) + 2\\left[e^{-x}(1-x)\\right] + xe^{-x}$$\n\n**Step 4 \u2014 factor out the common $e^{-x}$** from every term, since it appears in all three:\n$$= e^{-x}\\Big[(x-2) + 2(1-x) + x\\Big]$$\n\n**Step 5 \u2014 simplify the bracket** by carefully expanding and collecting like terms:\n$$(x-2) + (2-2x) + x = x-2+2-2x+x = (x-2x+x) + (-2+2) = 0 + 0 = 0$$\n\n**Conclusion**: $y''+2y'+y = e^{-x}\\times 0 = 0$. **This confirms the required identity holds.**"}, {"cat": "Differentiation", "q": "Find the derivatives: (i) $y=3xe^{2x}$ (ii) $y=\\dfrac{7x^2}{x-1}$ (iii) $y=\\sqrt{12x^3+8}$.", "hint": "(i) Product rule. (ii) Quotient rule. (iii) Chain rule with a square root.", "ans": "**(i) $y=3xe^{2x}$ \u2014 product rule.** Let $u=3x$ ($u'=3$) and $v=e^{2x}$ ($v'=2e^{2x}$, by the chain rule, since the derivative of the exponent $2x$ is 2). Product rule, $y'=uv'+vu'$:\n$$y' = 3x(2e^{2x}) + e^{2x}(3) = 6xe^{2x}+3e^{2x} = 3e^{2x}(2x+1)$$\n(Factoring out the common $3e^{2x}$ gives a tidier final form.)\n\n**(ii) $y=\\dfrac{7x^2}{x-1}$ \u2014 quotient rule.** Let $u=7x^2$ ($u'=14x$) and $v=x-1$ ($v'=1$). Apply $\\dfrac{vu'-uv'}{v^2}$:\n$$y' = \\frac{(x-1)(14x) - 7x^2(1)}{(x-1)^2} = \\frac{14x^2-14x-7x^2}{(x-1)^2} = \\frac{7x^2-14x}{(x-1)^2}$$\nFactor the numerator: $7x^2-14x = 7x(x-2)$. Final answer: $y' = \\dfrac{7x(x-2)}{(x-1)^2}$.\n\n**(iii) $y=\\sqrt{12x^3+8}$ \u2014 chain rule.** First rewrite the square root as a power, since it's easier to differentiate that way: $y = (12x^3+8)^{1/2}$. Let $u=12x^3+8$ ($u'=36x^2$). Using the power/chain rule (bring the $\\frac12$ down, reduce the power by 1, then multiply by $u'$):\n$$y' = \\frac12(12x^3+8)^{-1/2}\\cdot 36x^2 = \\frac{36x^2}{2\\sqrt{12x^3+8}} = \\frac{18x^2}{\\sqrt{12x^3+8}}$$"}, {"cat": "Differentiation", "q": "Differentiate with respect to $x$: (a) $y=\\log(\\sin x + \\cos x)$ (b) $y = ax^n + bx^m$.", "hint": "(a) Chain rule: $\\frac{u'}{u}$. (b) Power rule term by term.", "ans": "**(a) $y=\\log(\\sin x+\\cos x)$.** As before, for $y=\\log(u)$, the derivative is $\\dfrac{u'}{u}$. Here $u=\\sin x+\\cos x$, so $u' = \\cos x - \\sin x$ (derivative of $\\sin x$ is $\\cos x$; derivative of $\\cos x$ is $-\\sin x$). Therefore:\n$$y' = \\frac{\\cos x-\\sin x}{\\sin x+\\cos x}$$\n\n**(b) $y=ax^n+bx^m$.** Here $a$, $b$, $n$, $m$ are all just fixed constants, and $x$ is the variable. Apply the power rule to each term separately (a constant multiplying a power simply carries through: $\\frac{d}{dx}(cx^k)=ck\\,x^{k-1}$):\n$$y' = a\\cdot n\\,x^{n-1} + b\\cdot m\\,x^{m-1} = anx^{n-1}+bmx^{m-1}$$"}, {"cat": "Differentiation", "q": "Find $\\dfrac{dy}{dx}$ for: (a) $y=e^{\\sin x-\\cos x}$ (b) $y=\\sin x\\cos x$ (c) $y=\\log(e^x-e^{-x})$.", "hint": "(a) Chain rule on the exponent. (b) Product rule (or use double-angle). (c) Chain rule with log.", "ans": "**(a) $y=e^{\\sin x-\\cos x}$.** For $y=e^u$, the chain rule gives $y'=e^u\\cdot u'$ (the derivative of $e^{\\text{anything}}$ is itself, times the derivative of that \"anything\"). Here $u=\\sin x-\\cos x$, so $u'=\\cos x-(-\\sin x)=\\cos x+\\sin x$. Therefore:\n$$y' = e^{\\sin x-\\cos x}\\cdot(\\cos x+\\sin x)$$\n\n**(b) $y=\\sin x\\cos x$ \u2014 product rule.** Let $u=\\sin x$ ($u'=\\cos x$) and $v=\\cos x$ ($v'=-\\sin x$). Product rule: $y'=uv'+vu'$:\n$$y' = \\sin x(-\\sin x)+\\cos x(\\cos x) = -\\sin^2x+\\cos^2x = \\cos^2x-\\sin^2x$$\nUsing the double-angle identity $\\cos 2x = \\cos^2x-\\sin^2x$, this can also be written neatly as $y'=\\cos 2x$.\n\n**(c) $y=\\log(e^x-e^{-x})$.** Same pattern as an earlier problem: $u=e^x-e^{-x}$, so $u'=e^x+e^{-x}$. Then:\n$$y' = \\frac{u'}{u} = \\frac{e^x+e^{-x}}{e^x-e^{-x}}$$"}, {"cat": "Differentiation", "q": "If $y = x^3+4x^2-3x-15$, find the value(s) of $x$ for which $f'(x)=0$.", "hint": "Differentiate then factor the resulting quadratic.", "ans": "**Step 1 \u2014 differentiate using the power rule term by term.**\n$$f'(x) = 3x^2 + 8x - 3$$\n(Derivative of $x^3$ is $3x^2$; derivative of $4x^2$ is $8x$; derivative of $-3x$ is $-3$; derivative of the constant $-15$ is $0$.)\n\n**Step 2 \u2014 set the derivative equal to zero** (this is what \"find $x$ where $f'(x)=0$\" means \u2014 we're looking for the critical points where the tangent is flat):\n$$3x^2+8x-3=0$$\n\n**Step 3 \u2014 solve the quadratic equation.** This doesn't factor neatly with small whole numbers, so use the **quadratic formula**: for $ax^2+bx+c=0$, $x = \\dfrac{-b\\pm\\sqrt{b^2-4ac}}{2a}$. Here $a=3$, $b=8$, $c=-3$:\n$$x = \\frac{-8\\pm\\sqrt{8^2-4(3)(-3)}}{2(3)} = \\frac{-8\\pm\\sqrt{64+36}}{6} = \\frac{-8\\pm\\sqrt{100}}{6} = \\frac{-8\\pm10}{6}$$\n\n**Step 4 \u2014 evaluate both roots separately.**\n- Taking the $+$ sign: $x = \\dfrac{-8+10}{6} = \\dfrac{2}{6} = \\dfrac13$.\n- Taking the $-$ sign: $x = \\dfrac{-8-10}{6} = \\dfrac{-18}{6} = -3$.\n\n**Final answer**: $f'(x)=0$ at $x=\\dfrac13$ and $x=-3$."}, {"cat": "Differentiation", "q": "Ascertain whether $y = f(x) = x^3-6x^2+12$ has a point of inflection.", "hint": "A point of inflection occurs where $f''(x)=0$ and concavity actually changes sign there.", "ans": "**What a point of inflection is.** It's a point on the curve where the **concavity** switches \u2014 where the curve changes from bending upward (concave up, like a cup \u222a) to bending downward (concave down, like a dome \u2229), or vice versa. Finding a spot where the second derivative equals zero is only the *first clue* \u2014 you must also confirm the sign of $f''(x)$ genuinely flips on either side of that point, otherwise it's just a coincidental zero without an actual change in bending.\n\n**Step 1 \u2014 find the first derivative.**\n$$f'(x) = 3x^2-12x$$\n\n**Step 2 \u2014 find the second derivative** (differentiate $f'(x)$ again):\n$$f''(x) = 6x-12$$\n\n**Step 3 \u2014 find where $f''(x)=0$** (candidate inflection point):\n$$6x-12=0 \\implies x=2$$\n\n**Step 4 \u2014 check that concavity actually changes sign around $x=2$** by testing a value slightly less than 2 and a value slightly greater than 2:\n- At $x=1$ (just below 2): $f''(1)=6(1)-12=-6$, which is **negative** \u2192 curve is concave down here.\n- At $x=3$ (just above 2): $f''(3)=6(3)-12=6$, which is **positive** \u2192 curve is concave up here.\n\nSince the sign of $f''(x)$ genuinely flips from negative to positive as we pass through $x=2$, this confirms real concavity change \u2014 **yes, there is a genuine point of inflection at $x=2$.**\n\n**Step 5 \u2014 find the $y$-coordinate** by substituting $x=2$ into the *original* function: $f(2) = 8-6(4)+12 = 8-24+12=-4$.\n\n**Final answer**: the point of inflection is at $(2,-4)$."}, {"cat": "Partial Derivatives & Homogeneity", "q": "State Young's theorem.", "hint": "It's about mixed second-order partial derivatives being equal.", "ans": "First, a quick refresher on what a **partial derivative** is: when a function depends on two or more variables, say $z=f(x,y)$, a partial derivative measures how $z$ changes when *only one* of the variables moves, while the other is held fixed (treated temporarily as a constant). We write $\\dfrac{\\partial z}{\\partial x}$ (often shortened to $z_x$ or $f_x$) for the rate of change with respect to $x$ alone, and similarly $z_y$ for $y$ alone.\n\nA **second-order mixed partial derivative** means differentiating twice, once with respect to each variable \u2014 but there are two possible *orders* in which you could do this: differentiate w.r.t. $x$ first then $y$ (written $\\dfrac{\\partial^2z}{\\partial y\\partial x}$ or $z_{xy}$), or differentiate w.r.t. $y$ first then $x$ (written $\\dfrac{\\partial^2z}{\\partial x\\partial y}$ or $z_{yx}$).\n\n**Young's theorem** is the statement that \u2014 provided the function's second-order partial derivatives are continuous \u2014 **it does not matter which order you differentiate in; you get exactly the same result either way**:\n$$\\frac{\\partial^2z}{\\partial x\\partial y} = \\frac{\\partial^2z}{\\partial y\\partial x} \\qquad \\text{i.e.} \\qquad z_{xy}=z_{yx}$$\n\nThis is extremely useful in practice: it means you only ever need to compute one of the two mixed partials, and the other is automatically known to be identical."}, {"cat": "Partial Derivatives & Homogeneity", "q": "State Euler's theorem.", "hint": "It's about homogeneous functions and their partial derivatives summing to a multiple of the function.", "ans": "**Recall from earlier** what it means for a function to be **homogeneous of degree $n$**: scaling every input by a factor $\\lambda$ causes the whole output to scale by $\\lambda^n$, i.e. $f(\\lambda x,\\lambda y)=\\lambda^n f(x,y)$.\n\n**Euler's theorem** connects this scaling property to the function's *partial derivatives*. It states that if $z=f(x,y)$ is homogeneous of degree $n$, then:\n$$x\\frac{\\partial z}{\\partial x} + y\\frac{\\partial z}{\\partial y} = nz$$\n\nIn words: if you take each independent variable, multiply it by its own partial derivative, and add all these products together, the result always equals $n$ (the degree of homogeneity) times the original function. This generalizes naturally to more variables: for $z=f(x_1,x_2,\\ldots,x_k)$ homogeneous of degree $n$, $\\displaystyle\\sum_{i=1}^{k} x_i\\frac{\\partial f}{\\partial x_i} = nf$.\n\n**Why this matters in economics**: for a production function $Q=f(L,K)$, Euler's theorem underlies the important result that if the production function exhibits **constant returns to scale** (degree $n=1$), then paying each input its marginal product exactly exhausts total output \u2014 a cornerstone result in the theory of income distribution."}, {"cat": "Partial Derivatives & Homogeneity", "q": "Distinguish between Young's theorem and Euler's theorem.", "hint": "One is about equality of mixed partials; the other is about homogeneous functions and scaling.", "ans": "It's easy to confuse these two theorems since they both involve partial derivatives, but they answer completely different questions.\n\n**Young's theorem** applies to **any** function with continuous second-order partial derivatives \u2014 it doesn't need any special property like homogeneity. It simply says that the order in which you take mixed partial derivatives doesn't matter: $f_{xy}=f_{yx}$. Think of it as a statement about the *mechanics of differentiation itself*.\n\n**Euler's theorem** applies **only to homogeneous functions** \u2014 functions with the special scaling property $f(\\lambda x,\\lambda y)=\\lambda^n f(x,y)$. It relates the first-order partial derivatives back to the original function via $xf_x+yf_y=nf$. Think of it as a statement about the *relationship between a function's shape and how its inputs scale*.\n\n**One-line summary**: Young's theorem is about the *order* of differentiation being irrelevant (applies to essentially all well-behaved functions); Euler's theorem is about *homogeneity/scaling* (applies only to homogeneous functions, and connects derivatives to the function's degree $n$)."}, {"cat": "Partial Derivatives & Homogeneity", "q": "Given $f(x,y)=x^2e^{-y}$, verify Young's theorem.", "hint": "Find $f_x$, then $f_{xy}$ (differentiate $f_x$ w.r.t. $y$); find $f_y$, then $f_{yx}$ (differentiate $f_y$ w.r.t. $x$). Compare.", "ans": "**The verification plan**: compute the mixed partial two different ways \u2014 first differentiate w.r.t. $x$ then $y$; then, separately, differentiate w.r.t. $y$ then $x$ \u2014 and check that both routes land on the same final expression.\n\n**Route 1: differentiate w.r.t. $x$ first, then $y$.**\n\nStep 1a \u2014 find $f_x$ (treat $y$, and therefore $e^{-y}$, as a constant while differentiating with respect to $x$): since $e^{-y}$ is just a constant multiplier here, $f_x = \\dfrac{\\partial}{\\partial x}(x^2)\\cdot e^{-y} = 2x\\cdot e^{-y} = 2xe^{-y}$.\n\nStep 1b \u2014 now differentiate $f_x=2xe^{-y}$ with respect to $y$ (this time, treat $x$ \u2014 and therefore $2x$ \u2014 as a constant): the derivative of $e^{-y}$ w.r.t. $y$ is $-e^{-y}$ (chain rule: derivative of the exponent $-y$ is $-1$). So:\n$$f_{xy} = 2x\\cdot(-e^{-y}) = -2xe^{-y}$$\n\n**Route 2: differentiate w.r.t. $y$ first, then $x$.**\n\nStep 2a \u2014 find $f_y$ (treat $x^2$ as a constant while differentiating w.r.t. $y$): $f_y = x^2\\cdot\\dfrac{\\partial}{\\partial y}(e^{-y}) = x^2\\cdot(-e^{-y}) = -x^2e^{-y}$.\n\nStep 2b \u2014 now differentiate $f_y=-x^2e^{-y}$ with respect to $x$ (treat $e^{-y}$ as constant): $f_{yx} = -2x\\cdot e^{-y} = -2xe^{-y}$.\n\n**Comparison**: from Route 1, $f_{xy}=-2xe^{-y}$; from Route 2, $f_{yx}=-2xe^{-y}$. **They match exactly \u2014 Young's theorem is verified for this function.**"}, {"cat": "Partial Derivatives & Homogeneity", "q": "Using Euler's theorem, determine the degree of homogeneity of $f(x,y)=x^2+2xy-3y^2$.", "hint": "Every term is already degree 2 in combined powers of $x$ and $y$ \u2014 check by scaling $x\\to\\lambda x$, $y\\to\\lambda y$.", "ans": "There are two valid ways to find the degree of homogeneity \u2014 the direct scaling test, and Euler's theorem itself (using partial derivatives). Let's do both so you see they agree.\n\n**Method 1 \u2014 the direct scaling test.** Replace $x$ with $\\lambda x$ and $y$ with $\\lambda y$ everywhere, then simplify:\n$$f(\\lambda x,\\lambda y) = (\\lambda x)^2 + 2(\\lambda x)(\\lambda y) - 3(\\lambda y)^2 = \\lambda^2x^2 + 2\\lambda^2xy - 3\\lambda^2y^2$$\nEvery term picked up exactly $\\lambda^2$ (because each original term \u2014 $x^2$, $xy$, $y^2$ \u2014 has total power 2 when you add the exponents of $x$ and $y$ together). Factor $\\lambda^2$ out:\n$$= \\lambda^2(x^2+2xy-3y^2) = \\lambda^2f(x,y)$$\nSo the function scales by $\\lambda^2$, confirming **degree of homogeneity $=2$**.\n\n**Method 2 \u2014 using Euler's theorem as a check.** First find the partial derivatives: $f_x = 2x+2y$, $f_y=2x-6y$. Euler's theorem says $xf_x+yf_y$ should equal $n\\cdot f(x,y)$ for the correct $n$. Compute:\n$$xf_x+yf_y = x(2x+2y)+y(2x-6y) = 2x^2+2xy+2xy-6y^2 = 2x^2+4xy-6y^2$$\nNotice this equals exactly $2(x^2+2xy-3y^2) = 2f(x,y)$. So $n=2$, **confirming the same answer as Method 1: degree of homogeneity $=2$.**"}, {"cat": "Partial Derivatives & Homogeneity", "q": "Given $f(x,y)=e^{x^2+y^2}$, find $f_x$, $f_y$, $f_{xy}$, $f_{yx}$.", "hint": "Chain rule for $f_x,f_y$; then differentiate each of those with respect to the other variable.", "ans": "**Step 1 \u2014 find $f_x$** (differentiate w.r.t. $x$, treating $y$ as constant). Since $f=e^{u}$ where $u=x^2+y^2$, use the chain rule $\\frac{d}{dx}e^u = e^u\\cdot\\frac{\\partial u}{\\partial x}$. Here $\\dfrac{\\partial u}{\\partial x}=2x$ (the $y^2$ term is treated as constant and disappears). So:\n$$f_x = 2x\\,e^{x^2+y^2}$$\n\n**Step 2 \u2014 find $f_y$** by the same logic, but now differentiating $u$ w.r.t. $y$: $\\dfrac{\\partial u}{\\partial y}=2y$. So:\n$$f_y = 2y\\,e^{x^2+y^2}$$\n\n**Step 3 \u2014 find $f_{xy}$** by differentiating $f_x=2xe^{x^2+y^2}$ with respect to $y$. Here $2x$ is a constant multiplier (we're differentiating w.r.t. $y$ now), so we only need to differentiate $e^{x^2+y^2}$ w.r.t. $y$, which gives $2y\\,e^{x^2+y^2}$ (same chain rule as before). Multiply by the constant $2x$ out front:\n$$f_{xy} = 2x\\cdot(2y\\,e^{x^2+y^2}) = 4xy\\,e^{x^2+y^2}$$\n\n**Step 4 \u2014 find $f_{yx}$** by differentiating $f_y=2ye^{x^2+y^2}$ with respect to $x$. Here $2y$ is the constant multiplier, and differentiating $e^{x^2+y^2}$ w.r.t. $x$ gives $2x\\,e^{x^2+y^2}$:\n$$f_{yx} = 2y\\cdot(2x\\,e^{x^2+y^2}) = 4xy\\,e^{x^2+y^2}$$\n\n**Check**: $f_{xy}=f_{yx}=4xye^{x^2+y^2}$, consistent with Young's theorem as expected."}, {"cat": "Partial Derivatives & Homogeneity", "q": "Find the four second-order partial derivatives of $f(x,y)=x^2+xy-y^2$ and verify whether the function is harmonic.", "hint": "Harmonic means $f_{xx}+f_{yy}=0$ (Laplace's equation).", "ans": "**What 'harmonic' means.** A function $f(x,y)$ is called **harmonic** if it satisfies the **Laplace equation**: $f_{xx}+f_{yy}=0$, where $f_{xx}$ is the second partial derivative purely with respect to $x$ (differentiate twice, both times w.r.t. $x$), and $f_{yy}$ is purely with respect to $y$. This condition shows up throughout physics and economics wherever a quantity is in a kind of \"equilibrium\" or \"steady state\" across space.\n\n**Step 1 \u2014 find the two first-order partial derivatives.**\n$$f_x = 2x+y \\qquad\\qquad f_y = x-2y$$\n\n**Step 2 \u2014 find all four second-order partials**, by differentiating each first-order partial with respect to both $x$ and $y$:\n- $f_{xx}$: differentiate $f_x=2x+y$ w.r.t. $x$ again \u2192 $f_{xx}=2$.\n- $f_{xy}$: differentiate $f_x=2x+y$ w.r.t. $y$ \u2192 $f_{xy}=1$.\n- $f_{yx}$: differentiate $f_y=x-2y$ w.r.t. $x$ \u2192 $f_{yx}=1$. (Notice $f_{xy}=f_{yx}=1$, consistent with Young's theorem.)\n- $f_{yy}$: differentiate $f_y=x-2y$ w.r.t. $y$ again \u2192 $f_{yy}=-2$.\n\n**Step 3 \u2014 check the harmonic condition** $f_{xx}+f_{yy}=0$:\n$$f_{xx}+f_{yy} = 2+(-2) = 0$$\n\nSince this equals zero exactly, **the function is harmonic** \u2014 the Laplace equation is satisfied."}, {"cat": "Partial Derivatives & Homogeneity", "q": "Using Euler's theorem, find the degree of homogeneity of $Q=0.3K^{0.2}L^{0.7}$.", "hint": "Sum the exponents.", "ans": "This is a **Cobb-Douglas type function** (very common in economics for production functions), where each variable is raised to its own fixed power and the terms are multiplied together (not added). For this specific type of function, there's a shortcut worth knowing: **the degree of homogeneity is simply the sum of all the exponents** \u2014 but let's verify this properly with the scaling test rather than just asserting it.\n\n**Step 1 \u2014 apply the scaling test.** Replace $K\\to\\lambda K$ and $L\\to\\lambda L$:\n$$Q(\\lambda K,\\lambda L) = 0.3(\\lambda K)^{0.2}(\\lambda L)^{0.7}$$\n\n**Step 2 \u2014 expand each bracket separately**, remembering that a power applies to *everything* inside the brackets: $(\\lambda K)^{0.2}=\\lambda^{0.2}K^{0.2}$, and $(\\lambda L)^{0.7}=\\lambda^{0.7}L^{0.7}$. Substitute:\n$$Q(\\lambda K,\\lambda L) = 0.3\\cdot\\lambda^{0.2}K^{0.2}\\cdot\\lambda^{0.7}L^{0.7}$$\n\n**Step 3 \u2014 combine the two powers of $\\lambda$** using the rule $\\lambda^a\\times\\lambda^b=\\lambda^{a+b}$: here $a=0.2$ and $b=0.7$, so $\\lambda^{0.2}\\times\\lambda^{0.7}=\\lambda^{0.2+0.7}=\\lambda^{0.9}$. Rearranging:\n$$Q(\\lambda K,\\lambda L) = \\lambda^{0.9}\\cdot\\left(0.3K^{0.2}L^{0.7}\\right) = \\lambda^{0.9}\\,Q(K,L)$$\n\n**Conclusion**: the function scales by $\\lambda^{0.9}$, so **the degree of homogeneity is $0.9$**. Because this is *less than 1*, this production function exhibits **decreasing returns to scale**: if you doubled both inputs ($\\lambda=2$), output would rise by only $2^{0.9}\\approx 1.87$ times \u2014 less than double."}, {"cat": "Partial Derivatives & Homogeneity", "q": "Is the function $z=\\sin x\\sin y$ harmonic?", "hint": "Compute $z_{xx}$ and $z_{yy}$ and check whether they sum to zero.", "ans": "**Step 1 \u2014 find the first partial derivatives.** Treat the other variable as a constant multiplier in each case:\n$$z_x = \\cos x\\sin y \\qquad\\qquad z_y = \\sin x\\cos y$$\n\n**Step 2 \u2014 find the pure second-order partials** (differentiate each one *again*, with respect to the *same* variable as before):\n- $z_{xx}$: differentiate $z_x=\\cos x\\sin y$ w.r.t. $x$ again (only the $\\cos x$ part changes, since $\\sin y$ is constant here): $z_{xx} = -\\sin x\\sin y$.\n- $z_{yy}$: differentiate $z_y=\\sin x\\cos y$ w.r.t. $y$ again (only $\\cos y$ changes): $z_{yy}=-\\sin x\\sin y$.\n\n**Step 3 \u2014 check the harmonic condition**, $z_{xx}+z_{yy}=0$:\n$$z_{xx}+z_{yy} = -\\sin x\\sin y + (-\\sin x\\sin y) = -2\\sin x\\sin y$$\n\n**Step 4 \u2014 interpret the result.** This expression is *not* identically zero for all $x$ and $y$ \u2014 it only equals zero at special points where $\\sin x=0$ or $\\sin y=0$ (e.g. $x=0$), but not as a general rule. Since the harmonic condition must hold for *all* $x,y$ to qualify, **the function is NOT harmonic.**"}, {"cat": "Partial Derivatives & Homogeneity", "q": "Determine the degree of homogeneity of $f(x,y)=\\log_e\\left(\\dfrac{x}{y}\\right)$.", "hint": "Scale $x,y$ by $\\lambda$ and see what happens inside the log \u2014 logs of ratios behave differently from polynomials.", "ans": "**A useful log property to remember first**: $\\log\\left(\\dfrac{a}{b}\\right)$ depends only on the *ratio* $\\frac{a}{b}$, not on the individual sizes of $a$ and $b$. This has an important consequence when we test homogeneity.\n\n**Step 1 \u2014 apply the scaling test.** Replace $x\\to\\lambda x$ and $y\\to\\lambda y$:\n$$f(\\lambda x,\\lambda y) = \\log_e\\left(\\frac{\\lambda x}{\\lambda y}\\right)$$\n\n**Step 2 \u2014 simplify inside the logarithm.** Since $\\lambda$ appears in both the numerator and denominator of the fraction inside the log, it **cancels out completely**:\n$$\\frac{\\lambda x}{\\lambda y} = \\frac{x}{y}$$\n\n**Step 3 \u2014 substitute back.** This means:\n$$f(\\lambda x,\\lambda y) = \\log_e\\left(\\frac{x}{y}\\right) = f(x,y)$$\n\n**Step 4 \u2014 express this in the standard homogeneity form**, $f(\\lambda x,\\lambda y)=\\lambda^n f(x,y)$. Since the function is completely unchanged after scaling \u2014 i.e. it equals $f(x,y)$ multiplied by $\\lambda^0=1$ (since anything to the power 0 is 1) \u2014 we can write:\n$$f(\\lambda x,\\lambda y) = \\lambda^0 f(x,y)$$\n\n**Conclusion**: the function is **homogeneous of degree 0**. This makes intuitive sense: doubling both $x$ and $y$ leaves their ratio $\\frac{x}{y}$ completely unchanged, so the log of that ratio is also unchanged \u2014 the function simply doesn't respond to *proportional* scaling of its inputs at all."}, {"cat": "Partial Derivatives & Homogeneity", "q": "State Young's theorem and apply it to $Z=x^2-3xy-y^2$.", "hint": "Find $Z_x$ then differentiate w.r.t. $y$; find $Z_y$ then differentiate w.r.t. $x$; they should match.", "ans": "**Young's theorem (recap)**: for a function with continuous second-order partial derivatives, the mixed partials are equal regardless of the order of differentiation: $Z_{xy}=Z_{yx}$.\n\n**Step 1 \u2014 find $Z_x$** (differentiate w.r.t. $x$, treating $y$ as constant): $Z_x = 2x-3y$ (the derivative of $x^2$ is $2x$; the derivative of $-3xy$ w.r.t. $x$ is $-3y$, since $y$ is held constant; the derivative of $-y^2$ w.r.t. $x$ is 0, since it contains no $x$).\n\n**Step 2 \u2014 differentiate $Z_x=2x-3y$ with respect to $y$** to get $Z_{xy}$: the term $2x$ is now constant (no $y$), so its derivative w.r.t. $y$ is 0; the derivative of $-3y$ w.r.t. $y$ is $-3$. So:\n$$Z_{xy} = -3$$\n\n**Step 3 \u2014 find $Z_y$** (differentiate the original function w.r.t. $y$, treating $x$ as constant): $Z_y = -3x-2y$ (derivative of $x^2$ w.r.t. $y$ is 0; derivative of $-3xy$ w.r.t. $y$ is $-3x$; derivative of $-y^2$ w.r.t. $y$ is $-2y$).\n\n**Step 4 \u2014 differentiate $Z_y=-3x-2y$ with respect to $x$** to get $Z_{yx}$: the derivative of $-3x$ w.r.t. $x$ is $-3$; the derivative of $-2y$ w.r.t. $x$ is 0. So:\n$$Z_{yx} = -3$$\n\n**Comparison**: $Z_{xy}=-3=Z_{yx}$. **Young's theorem holds for this function.**"}, {"cat": "Partial Derivatives & Homogeneity", "q": "Test the functional dependence of $y_1=3x_1^2+2x_2^2$ and $y_2=5x_1+1$. What can you conclude?", "hint": "Two functions are functionally dependent if one can be expressed purely in terms of the other (no separate independent variation) \u2014 test via the Jacobian determinant $=0$.", "ans": "**What 'functional dependence' means.** Two functions $y_1$ and $y_2$, both depending on the same underlying variables $x_1,x_2$, are said to be **functionally dependent** if one of them can be written entirely as some function of the other \u2014 meaning they don't really vary independently, they're secretly tied together. If no such relationship exists, they're **functionally independent**.\n\n**The test \u2014 the Jacobian determinant.** Arrange all the first-order partial derivatives of $y_1$ and $y_2$ (with respect to $x_1$ and $x_2$) into a square matrix, and take its determinant, called the **Jacobian**, $J$. The rule is: if $J=0$ everywhere, the functions **are** dependent; if $J\\neq0$ (at least generically), they are **independent**.\n\n**Step 1 \u2014 find all four required partial derivatives.**\n$$\\frac{\\partial y_1}{\\partial x_1}=6x_1 \\qquad \\frac{\\partial y_1}{\\partial x_2}=4x_2 \\qquad \\frac{\\partial y_2}{\\partial x_1}=5 \\qquad \\frac{\\partial y_2}{\\partial x_2}=0$$\n\n**Step 2 \u2014 arrange these into the Jacobian matrix** and compute its determinant:\n$$J = \\begin{vmatrix}6x_1 & 4x_2\\\\5 & 0\\end{vmatrix} = (6x_1)(0) - (4x_2)(5) = 0-20x_2 = -20x_2$$\n\n**Step 3 \u2014 interpret the result.** $J=-20x_2$ is **not identically zero** \u2014 it only becomes zero at the special case $x_2=0$, but for general values of $x_1,x_2$ it is non-zero. Since the Jacobian is not zero across the whole domain, **the two functions are functionally independent** \u2014 $y_1$ cannot be expressed purely as some function of $y_2$ alone; they carry genuinely separate information."}, {"cat": "Partial Derivatives & Homogeneity", "q": "Toyin asserts that $Z_1=3x-y$ and $Z_2=9x^2+6xy+y^2$ are unrelated. Is Toyin correct?", "hint": "Try expressing $Z_2$ as some function of $Z_1$ \u2014 recognise a perfect square pattern first.", "ans": "**The intuition first**: before running the formal Jacobian test, it's worth pattern-spotting \u2014 sometimes $Z_2$ is secretly just $(Z_1)^2$ or something similar in disguise, which would make them dependent.\n\n**Step 1 \u2014 check whether $Z_2$ is a perfect square of some combination of $x,y$.** Recall the algebraic identity $(a+b)^2=a^2+2ab+b^2$. Compare: $Z_2=9x^2+6xy+y^2$. If we let $a=3x$ and $b=y$, then $(3x+y)^2 = 9x^2+6xy+y^2$ \u2014 **this matches $Z_2$ exactly!** So $Z_2=(3x+y)^2$.\n\n**Step 2 \u2014 compare this to $Z_1$.** We're given $Z_1=3x-y$ (note the *minus* sign), but we just found $Z_2=(3x+y)^2$ (with a *plus* sign inside). These don't match \u2014 $Z_2$ is the square of $(3x+y)$, not the square of $(3x-y)=Z_1$. So $Z_2 \\neq Z_1^2$, and there's no obvious direct algebraic relationship.\n\n**Step 3 \u2014 confirm formally using the Jacobian.** $\\dfrac{\\partial Z_1}{\\partial x}=3$, $\\dfrac{\\partial Z_1}{\\partial y}=-1$. $\\dfrac{\\partial Z_2}{\\partial x}=18x+6y$, $\\dfrac{\\partial Z_2}{\\partial y}=6x+2y$.\n$$J = \\begin{vmatrix}3 & -1\\\\18x+6y & 6x+2y\\end{vmatrix} = 3(6x+2y) - (-1)(18x+6y) = 18x+6y+18x+6y = 36x+12y$$\n\nSince $J=36x+12y$ is **not identically zero** (it's only zero along the special line $y=-3x$, not everywhere), the functions are, in general, **functionally independent \u2014 so Toyin's assertion that they are unrelated is correct.**"}, {"cat": "Optimization: Extrema & Lagrangian", "q": "Explain relative extrema using an appropriate diagram description; distinguish maximum and minimum mathematically.", "hint": "First-order condition locates the turning point; second-order condition tells you which type it is.", "ans": "**Picture the graph of a curving function**, like a rollercoaster track. As you move along the $x$-axis, the height $y=f(x)$ rises and falls. A **relative (or local) extremum** is any point where the curve momentarily \"turns around\" \u2014 a peak or a valley \u2014 even if it's not the highest or lowest point on the entire graph, just locally.\n\n**Relative maximum**: a point $x_0$ where the curve rises up to it and then falls away afterward \u2014 like the top of a hill. Formally, $f(x_0)\\geq f(x)$ for all $x$ sufficiently close to $x_0$.\n\n**Relative minimum**: a point $x_0$ where the curve falls down to it and then rises away afterward \u2014 like the bottom of a valley. Formally, $f(x_0)\\leq f(x)$ for all $x$ sufficiently close to $x_0$.\n\n**How we actually find these points \u2014 two stages of conditions:**\n\n**Stage 1 \u2014 the First-Order Condition (necessary condition).** At the very top of a hill or bottom of a valley, the tangent line to the curve is momentarily flat (horizontal) \u2014 the slope is exactly zero. This gives us: $f'(x_0)=0$. This condition is *necessary* \u2014 every relative extremum must satisfy it \u2014 but it's not enough on its own, because $f'(x_0)=0$ can also happen at a point that is neither a max nor a min (like a \"shoulder\" or saddle point where the curve flattens briefly but keeps going the same direction).\n\n**Stage 2 \u2014 the Second-Order Condition (sufficient condition).** To determine *which type* of turning point we have (or confirm it's a genuine extremum at all), we look at the curve's concavity via the second derivative:\n- If $f''(x_0)<0$: the curve is **concave down** (bending like a frown, \u2229) at that point \u2192 it's a **relative maximum**.\n- If $f''(x_0)>0$: the curve is **concave up** (bending like a smile, \u222a) at that point \u2192 it's a **relative minimum**.\n- If $f''(x_0)=0$: the test is inconclusive, and we'd need to check higher derivatives or examine how the sign of $f'(x)$ changes on either side of $x_0$."}, {"cat": "Optimization: Extrema & Lagrangian", "q": "Find the relative optima of $Y=4x-x^2$.", "hint": "Set $Y'=0$, solve for $x$, then use $Y''$ to classify.", "ans": "**Step 1 \u2014 find the first derivative** using the power rule:\n$$Y' = 4-2x$$\n\n**Step 2 \u2014 set $Y'=0$ and solve for $x$** (this locates the critical point, our candidate for a max or min):\n$$4-2x=0 \\implies 2x=4 \\implies x=2$$\n\n**Step 3 \u2014 find the second derivative** to classify the critical point:\n$$Y'' = -2$$\n\n**Step 4 \u2014 apply the second-derivative test.** Since $Y''=-2$ is a constant and it is **negative**, the curve is concave down *everywhere* \u2014 so the critical point we found is a **maximum**.\n\n**Step 5 \u2014 find the maximum value** by substituting $x=2$ back into the *original* function:\n$$Y(2) = 4(2)-(2)^2 = 8-4=4$$\n\n**Final answer**: there is a **relative (in fact, global) maximum at the point $(2,4)$.**"}, {"cat": "Optimization: Extrema & Lagrangian", "q": "Find the relative optimal of $y=4-x^2$.", "hint": "Same method as above \u2014 set derivative to zero.", "ans": "**Step 1 \u2014 differentiate**: $y' = -2x$.\n\n**Step 2 \u2014 set $y'=0$ and solve**: $-2x=0 \\implies x=0$.\n\n**Step 3 \u2014 find the second derivative**: $y''=-2$, which is a negative constant.\n\n**Step 4 \u2014 classify**: since $y''<0$ everywhere (the curve is a downward-opening parabola, concave down at every point), the critical point at $x=0$ is a **maximum**.\n\n**Step 5 \u2014 find the value**: substitute $x=0$ into the original function: $y(0)=4-0=4$.\n\n**Final answer**: **relative (and global) maximum at $(0,4)$.**"}, {"cat": "Optimization: Extrema & Lagrangian", "q": "Find the relative optima, if they exist, of $Y=x^3+3x^2-9x-5$.", "hint": "Set $Y'=0$ \u2014 you'll get a quadratic with two roots; classify each with $Y''$.", "ans": "**Step 1 \u2014 find the first derivative** using the power rule term by term:\n$$Y' = 3x^2+6x-9$$\n\n**Step 2 \u2014 set $Y'=0$ and solve.** First factor out the common factor of 3 to simplify: $3(x^2+2x-3)=0 \\implies x^2+2x-3=0$. Now factor the quadratic: we need two numbers multiplying to $-3$ and adding to $2$ \u2014 those are $3$ and $-1$. So: $(x+3)(x-1)=0$, giving two critical values: $x=-3$ and $x=1$.\n\n**Step 3 \u2014 find the second derivative**, which we'll evaluate at each critical value to classify it:\n$$Y'' = 6x+6$$\n\n**Step 4 \u2014 classify $x=-3$.** $Y''(-3) = 6(-3)+6=-18+6=-12$, which is **negative** \u2192 concave down here \u2192 this is a **relative maximum**.\n\n**Step 5 \u2014 classify $x=1$.** $Y''(1)=6(1)+6=12$, which is **positive** \u2192 concave up here \u2192 this is a **relative minimum**.\n\n**Step 6 \u2014 find the actual $Y$-values** by substituting back into the *original* function.\n\nAt $x=-3$: $Y(-3) = (-3)^3+3(-3)^2-9(-3)-5 = -27+27+27-5 = 22$.\n\nAt $x=1$: $Y(1) = (1)^3+3(1)^2-9(1)-5 = 1+3-9-5 = -10$.\n\n**Final summary**: relative maximum at $(-3,22)$; relative minimum at $(1,-10)$. This makes sense for a cubic function \u2014 it rises, turns over into a local peak, dips down to a local trough, then rises again forever, which is exactly the \"S-curve-with-a-wiggle\" shape a cubic with a positive leading coefficient always has."}, {"cat": "Optimization: Extrema & Lagrangian", "q": "Given $f(X_1,X_2)=X_1X_2$ subject to $X_1+4X_2=16$: use the Lagrangian method to find $X_1$, $X_2$, and the multiplier $\\lambda$. Then form the Bordered Hessian, find its determinant, and comment on the nature of the optimum.", "hint": "Form $\\mathcal{L}=X_1X_2+\\lambda(16-X_1-4X_2)$; take partials w.r.t. $X_1,X_2,\\lambda$ and set to zero.", "ans": "**Why we need Lagrangian multipliers at all.** When you want to maximize (or minimize) a function but the choice variables are *restricted* by a constraint (here, $X_1+4X_2=16$ \u2014 you can't pick $X_1,X_2$ completely freely), ordinary unconstrained calculus doesn't directly apply. The **Lagrangian method** handles this by building a new, augmented function that incorporates the constraint using a new variable $\\lambda$ (the \"Lagrange multiplier\"), turning a constrained problem into something we can differentiate normally.\n\n**Step 1 \u2014 set up the Lagrangian function.** The general recipe is: $\\mathcal{L} = (\\text{objective function}) + \\lambda\\times[(\\text{constraint written as} = 0)]$. Here the constraint $X_1+4X_2=16$ is rewritten as $16-X_1-4X_2=0$, so:\n$$\\mathcal{L} = X_1X_2 + \\lambda(16-X_1-4X_2)$$\n\n**Step 2 \u2014 find the first-order conditions (FOCs)** by taking the partial derivative of $\\mathcal{L}$ with respect to *each* variable \u2014 $X_1$, $X_2$, and $\\lambda$ \u2014 and setting each equal to zero. (Setting the derivative w.r.t. $\\lambda$ to zero simply hands back the original constraint \u2014 this is intentional, it's how the constraint re-enters the system.)\n\n$$\\mathcal{L}_{X_1} = X_2 - \\lambda = 0 \\quad \\Rightarrow \\quad \\lambda = X_2 \\quad \\text{...(i)}$$\n$$\\mathcal{L}_{X_2} = X_1 - 4\\lambda = 0 \\quad \\Rightarrow \\quad X_1 = 4\\lambda \\quad \\text{...(ii)}$$\n$$\\mathcal{L}_{\\lambda} = 16-X_1-4X_2 = 0 \\quad \\text{...(iii), this is just the original constraint}$$\n\n**Step 3 \u2014 solve the three equations simultaneously.** From (i), $\\lambda=X_2$. Substitute this into (ii): $X_1=4X_2$. Now substitute $X_1=4X_2$ into the constraint (iii): $16-4X_2-4X_2=0 \\implies 16-8X_2=0 \\implies X_2=2$. Then $X_1=4(2)=8$, and $\\lambda=X_2=2$.\n\n**Result so far**: $X_1=8$, $X_2=2$, $\\lambda=2$.\n\n**Step 4 \u2014 build the Bordered Hessian.** This is a special matrix used to check the *second-order condition* for constrained optimization \u2014 it tells us whether the critical point we found is genuinely a max, a min, or neither. It's built from: the constraint's partial derivatives, called $g_1=\\frac{\\partial g}{\\partial X_1}$ and $g_2=\\frac{\\partial g}{\\partial X_2}$ (where $g=X_1+4X_2$, so $g_1=1$ and $g_2=4$), plus the second-order partials of $\\mathcal{L}$: $\\mathcal{L}_{11}=\\frac{\\partial^2\\mathcal{L}}{\\partial X_1^2}=0$ (since $X_1X_2$ differentiated twice w.r.t. $X_1$ gives 0), $\\mathcal{L}_{12}=\\frac{\\partial^2\\mathcal{L}}{\\partial X_1\\partial X_2}=1$, $\\mathcal{L}_{22}=0$. The Bor
