}{dx^2}\\right)^5+\\dfrac{y}{x^2+1}=e^x$.** The derivatives present are $\\dfrac{d^3y}{dx^3}$ (third order) and $\\dfrac{d^2y}{dx^2}$ (second order). The highest is the third derivative, so **order = 3**. That highest-order term, $\\dfrac{d^3y}{dx^3}$, is raised to the power **2** (as explicitly shown). **Order = 3, Degree = 2.** (Note: the presence of $\\left(\\dfrac{d^2y}{dx^2}\\right)^5$ \u2014 power 5 \u2014 does NOT affect the degree, since degree is defined by the power of the *highest-order* derivative only, not any lower-order one, however large its own exponent might be.)"}, {"cat": "Differential Equations", "q": "Form the differential equation from $x^2-e^y=a$ (where $a$ is a constant).", "hint": "Differentiate implicitly with respect to $x$ to eliminate the arbitrary constant $a$.", "ans": "**The general idea behind 'forming' a differential equation.** We're given a family of curves, all sharing the same general shape but differing by the value of an arbitrary constant $a$ (different values of $a$ give different specific curves in the family). \"Forming the differential equation\" means finding an equation involving derivatives that is satisfied by *every* member of this family, regardless of which specific value $a$ takes \u2014 we achieve this by differentiating to eliminate $a$ entirely.\n\n**Step 1 \u2014 differentiate both sides of $x^2-e^y=a$ with respect to $x$.** Remember: since $y$ is itself a function of $x$ (even though it's not written explicitly as $y=f(x)$), differentiating any term containing $y$ requires the chain rule, introducing a factor of $\\dfrac{dy}{dx}$.\n\nDifferentiating $x^2$ w.r.t. $x$: gives $2x$.\n\nDifferentiating $-e^y$ w.r.t. $x$: using the chain rule, this is $-e^y\\cdot\\dfrac{dy}{dx}$ (derivative of $e^y$ w.r.t. $y$ is $e^y$, then multiply by $\\dfrac{dy}{dx}$ since $y$ depends on $x$).\n\nDifferentiating the constant $a$ w.r.t. $x$: since $a$ doesn't depend on $x$ at all, its derivative is simply $0$.\n\n**Step 2 \u2014 write out the differentiated equation:**\n$$2x - e^y\\frac{dy}{dx} = 0$$\n\nNotice that the constant $a$ has completely disappeared \u2014 this is exactly the goal, since it confirms this equation holds true regardless of which specific value $a$ originally had.\n\n**Step 3 \u2014 rearrange into a cleaner standard form** (optional, but often expected):\n$$e^y\\frac{dy}{dx} = 2x \\qquad \\text{or equivalently} \\qquad \\frac{dy}{dx}=\\frac{2x}{e^y}$$\n\nThis is the required differential equation."}, {"cat": "Differential Equations", "q": "Form the differential equation from $y^2-ax+a^2=0$ (where $a$ is a constant).", "hint": "This has one arbitrary constant $a$; differentiate once to eliminate it (you may need to solve for $a$ from the derivative first).", "ans": "**Step 1 \u2014 differentiate the given equation with respect to $x$**, remembering that $y$ depends on $x$ (so any term with $y$ needs the chain rule), while $a$ is treated as a genuine constant.\n\nDifferentiating $y^2$ w.r.t. $x$: chain rule gives $2y\\dfrac{dy}{dx}$.\n\nDifferentiating $-ax$ w.r.t. $x$: since $a$ is just a constant multiplier here, this gives $-a$.\n\nDifferentiating $a^2$ w.r.t. $x$: since $a$ is constant, $a^2$ is also constant, so its derivative is $0$.\n\n**Step 2 \u2014 write out the differentiated equation:**\n$$2y\\frac{dy}{dx} - a = 0$$\n\n**Step 3 \u2014 solve this equation for $a$ directly** (since it's now isolated nicely):\n$$a = 2y\\frac{dy}{dx}$$\n\nFor brevity, let's write $y' = \\dfrac{dy}{dx}$, so $a=2yy'$.\n\n**Step 4 \u2014 substitute this expression for $a$ back into the *original* equation**, to eliminate $a$ completely from the system (this is the crucial step \u2014 we now have one equation with no arbitrary constant left, only $x$, $y$, and $y'$):\n$$y^2 - (2yy')x + (2yy')^2 = 0$$\n\n**Step 5 \u2014 simplify.** Expand $(2yy')^2 = 4y^2(y')^2$:\n$$y^2 - 2xyy' + 4y^2(y')^2 = 0$$\n\nThis is the required differential equation \u2014 every specific curve in the original family (for any choice of $a$) satisfies this equation."}, {"cat": "Differential Equations", "q": "Solve the differential equation $\\dfrac{dy}{dx}=e^{x-y}$.", "hint": "This is separable: rewrite $e^{x-y}=e^x\\cdot e^{-y}$ and separate variables.", "ans": "**What 'separable' means, and why it's useful.** A differential equation is called **separable** if it can be rearranged so that all the terms involving $y$ (including $dy$) sit on one side, and all the terms involving $x$ (including $dx$) sit on the other side. Once separated, you can integrate each side independently \u2014 this turns a differential equation into an ordinary integration problem.\n\n**Step 1 \u2014 use the law of exponents to split $e^{x-y}$.** Recall that $e^{a-b}=e^a\\cdot e^{-b}$ (subtracting exponents corresponds to dividing, so this is really $\\frac{e^x}{e^y}=e^x\\cdot e^{-y}$). Applying this:\n$$\\frac{dy}{dx} = e^x\\cdot e^{-y}$$\n\n**Step 2 \u2014 separate the variables.** We want all $y$-terms (including $e^{-y}$) on one side with $dy$, and all $x$-terms on the other with $dx$. Divide both sides by $e^{-y}$ (equivalently, multiply by $e^y$):\n$$e^y\\,dy = e^x\\,dx$$\n\n**Step 3 \u2014 integrate both sides independently.** On the left, integrate with respect to $y$; on the right, with respect to $x$. Only one constant of integration is needed overall (since two arbitrary constants on either side would just combine into one):\n$$\\int e^y\\,dy = \\int e^x\\,dx$$\n$$e^y = e^x + C$$\n\n**Step 4 \u2014 solve explicitly for $y$**, if a clean explicit solution is wanted, by taking the natural log of both sides:\n$$y = \\ln(e^x+C)$$\n\nThis is the **general solution** to the differential equation (the constant $C$ can take any value, representing a whole family of solution curves)."}, {"cat": "Differential Equations", "q": "Solve $\\dfrac{dy}{dx}=\\dfrac{y+1}{x-1}$ given $y=4$ when $x=2$.", "hint": "Separable equation: get all $y$ terms on one side, all $x$ terms on the other, then integrate and use the initial condition.", "ans": "**Step 1 \u2014 separate the variables.** We want $y$-terms with $dy$ on one side, $x$-terms with $dx$ on the other. Starting from $\\dfrac{dy}{dx}=\\dfrac{y+1}{x-1}$, cross-multiply by dividing both sides by $(y+1)$ and multiplying by $dx$:\n$$\\frac{dy}{y+1} = \\frac{dx}{x-1}$$\n\n**Step 2 \u2014 integrate both sides.** Recall the standard result $\\int\\dfrac{1}{u+k}du=\\ln|u+k|+C$ (a straightforward log-rule application, treating $y+1$ and $x-1$ as the \"inner\" expressions):\n$$\\int\\frac{dy}{y+1} = \\int\\frac{dx}{x-1}$$\n$$\\ln|y+1| = \\ln|x-1| + C_1$$\n\n**Step 3 \u2014 simplify by exponentiating both sides** (to remove the logs and get a cleaner relationship). Rearranging first: $\\ln|y+1|-\\ln|x-1|=C_1$, which by log rules is $\\ln\\left|\\dfrac{y+1}{x-1}\\right|=C_1$. Exponentiating both sides (raise $e$ to the power of each side):\n$$\\frac{y+1}{x-1} = e^{C_1} = k \\qquad \\text{(let } k=e^{C_1}\\text{, just a renamed constant)}$$\n\nSo: $y+1 = k(x-1)$.\n\n**Step 4 \u2014 apply the initial condition, $y=4$ when $x=2$, to find the specific value of $k$.** Substitute:\n$$4+1 = k(2-1) \\implies 5 = k(1) \\implies k=5$$\n\n**Step 5 \u2014 write out the final, specific solution**, now that $k$ is known:\n$$y+1 = 5(x-1)$$\n\n**Step 6 \u2014 solve explicitly for $y$**, if desired:\n$$y = 5(x-1)-1 = 5x-5-1 = 5x-6$$\n\n**Final answer**: $y=5x-6$. (Quick check: at $x=2$, $y=5(2)-6=10-6=4$ \u2713, matching the given initial condition.)"}, {"cat": "Differential Equations", "q": "Show that the order and degree of $\\dfrac{d^3y}{dx^3}=6\\sqrt{\\left(\\dfrac{dy}{dx}\\right)^2+y^2}$ requires squaring first before you can state the degree.", "hint": "Square both sides first to clear the square root, then identify order/degree from a polynomial-in-derivatives form.", "ans": "**Why we can't just read off the degree immediately.** Recall the technical requirement for \"degree\" to make sense: the equation must first be written as a **polynomial in its derivatives** \u2014 meaning no derivatives should be trapped inside square roots, fractional powers, or denominators. As given, this equation has a square root wrapped around expressions containing $\\dfrac{dy}{dx}$ and $y$, so we cannot directly read off the degree yet \u2014 we must first clear that square root.\n\n**Step 1 \u2014 square both sides of the equation** to eliminate the square root (a square root and squaring are inverse operations, so this removes the radical cleanly):\n$$\\left(\\frac{d^3y}{dx^3}\\right)^2 = \\left[6\\sqrt{\\left(\\frac{dy}{dx}\\right)^2+y^2}\\right]^2$$\n\n**Step 2 \u2014 simplify the right-hand side.** Squaring $6\\sqrt{\\cdots}$ gives $6^2\\times\\left[\\left(\\dfrac{dy}{dx}\\right)^2+y^2\\right] = 36\\left[\\left(\\dfrac{dy}{dx}\\right)^2+y^2\\right]$ (the square and the square root cancel exactly, leaving just the expression that was inside).\n\n**Step 3 \u2014 write the fully cleared equation:**\n$$\\left(\\frac{d^3y}{dx^3}\\right)^2 = 36\\left(\\frac{dy}{dx}\\right)^2 + 36y^2$$\n\n**Step 4 \u2014 now that the equation is a genuine polynomial in derivatives (no roots or fractions involving derivatives remain), identify the order and degree.** The derivatives present are $\\dfrac{d^3y}{dx^3}$ (third order) and $\\dfrac{dy}{dx}$ (first order). The highest is the third-order derivative, so **order = 3**. That highest-order derivative, $\\dfrac{d^3y}{dx^3}$, is raised to the power **2**, so **degree = 2**.\n\n**Final answer**: order 3, degree 2. This example illustrates precisely *why* the rule \"clear roots and fractions involving derivatives before reading off the degree\" exists \u2014 reading the degree straight from the un-squared, radical form would have been ambiguous or misleading."}, {"cat": "Applied Economics", "q": "Given $TC=3Q^2+7Q+12$: find the marginal cost (MC) and average cost (AC) functions, and evaluate both at $Q=3$ and $Q=5$.", "hint": "$MC=\\frac{d(TC)}{dQ}$; $AC=\\frac{TC}{Q}$.", "ans": "**Two key economic definitions to start with.** **Marginal cost (MC)** is the extra cost of producing one more unit \u2014 mathematically, it's the derivative of total cost with respect to output, $MC=\\dfrac{d(TC)}{dQ}$. **Average cost (AC)** is the total cost spread evenly across all units produced \u2014 mathematically, $AC=\\dfrac{TC}{Q}$ (just divide total cost by the number of units).\n\n**Step 1 \u2014 find $MC$ by differentiating $TC$** using the power rule term by term:\n$$MC = \\frac{d}{dQ}(3Q^2+7Q+12) = 6Q+7$$\n(Derivative of $3Q^2$ is $6Q$; derivative of $7Q$ is $7$; derivative of the constant $12$ is $0$.)\n\n**Step 2 \u2014 find $AC$ by dividing every term of $TC$ by $Q$:**\n$$AC = \\frac{3Q^2+7Q+12}{Q} = \\frac{3Q^2}{Q}+\\frac{7Q}{Q}+\\frac{12}{Q} = 3Q+7+\\frac{12}{Q}$$\n\n**Step 3 \u2014 evaluate both functions at $Q=3$.**\n\n$MC(3) = 6(3)+7 = 18+7=25$.\n\n$AC(3) = 3(3)+7+\\dfrac{12}{3} = 9+7+4=20$.\n\n**Step 4 \u2014 evaluate both functions at $Q=5$.**\n\n$MC(5) = 6(5)+7=30+7=37$.\n\n$AC(5) = 3(5)+7+\\dfrac{12}{5} = 15+7+2.4=24.4$.\n\n**Summary table**: at $Q=3$: $MC=25$, $AC=20$. At $Q=5$: $MC=37$, $AC=24.4$. (Notice $MC>AC$ at both output levels \u2014 economically, this tells us average cost is currently *rising* as output increases, since whenever marginal cost exceeds average cost, it \"pulls the average up\".)"}, {"cat": "Applied Economics", "q": "If the demand function of a monopolist is $P=120-3Q$: (i) find $TR$ in terms of $Q$, (ii) find the value of $MR$ at $Q=10$.", "hint": "$TR=P\\times Q$; then $MR=\\frac{d(TR)}{dQ}$.", "ans": "**Two definitions to recall.** **Total revenue (TR)** is simply price multiplied by quantity sold: $TR=P\\times Q$. **Marginal revenue (MR)** is the extra revenue earned from selling one more unit \u2014 mathematically, the derivative of total revenue with respect to quantity, $MR=\\dfrac{d(TR)}{dQ}$.\n\n**Step 1 \u2014 find $TR$ by multiplying the demand function by $Q$.** We're given $P=120-3Q$, so:\n$$TR = P\\cdot Q = (120-3Q)\\cdot Q$$\n\n**Step 2 \u2014 expand this product** (distribute $Q$ across both terms in the bracket):\n$$TR = 120Q - 3Q^2$$\n\n**Step 3 \u2014 find $MR$ by differentiating $TR$** with respect to $Q$, using the power rule:\n$$MR = \\frac{d(TR)}{dQ} = 120-6Q$$\n(Derivative of $120Q$ is $120$; derivative of $-3Q^2$ is $-6Q$.)\n\n**Step 4 \u2014 evaluate $MR$ at $Q=10$**, by substituting directly:\n$$MR(10) = 120-6(10) = 120-60=60$$\n\n**Final answers**: $TR=120Q-3Q^2$, and $MR$ at $Q=10$ is $\\bold{60}$.\n\n**A useful pattern to notice for the future**: whenever the demand function is linear ($P=a-bQ$), the marginal revenue function is *always* also linear, with the same intercept $a$ but *twice* the slope: $MR=a-2bQ$. Here $a=120,b=3$, giving $MR=120-6Q$ \u2014 exactly matching what we derived from first principles, confirming the shortcut."}, {"cat": "Applied Economics", "q": "The marginal revenue function of a monopolist is $MR=10-4Q$. Find the total revenue function and deduce the corresponding demand equation.", "hint": "Integrate $MR$ to get $TR$ (constant of integration is 0 since $TR=0$ at $Q=0$); then $P=TR/Q$.", "ans": "**The reverse process of the previous problem**: here we're given marginal revenue and must work *backwards* to find total revenue \u2014 this requires **integration** (the reverse of differentiation), and then further working to find the demand equation itself.\n\n**Step 1 \u2014 integrate $MR$ to recover $TR$**, remembering to include a constant of integration for now:\n$$TR = \\int MR\\,dQ = \\int(10-4Q)\\,dQ = 10Q - 2Q^2 + C$$\n(Using the power rule: $\\int10\\,dQ=10Q$; $\\int(-4Q)\\,dQ=-4\\cdot\\dfrac{Q^2}{2}=-2Q^2$.)\n\n**Step 2 \u2014 determine the constant $C$ using an economic boundary condition.** Here's the key economic insight: if a firm sells **zero** units ($Q=0$), it must earn **zero** total revenue ($TR=0$) \u2014 you can't earn revenue without selling anything. Use this fact:\n$$TR(0) = 10(0)-2(0)^2+C = C$$\nSince $TR(0)$ must equal 0, we conclude $C=0$.\n\n**Step 3 \u2014 write the complete total revenue function:**\n$$TR = 10Q-2Q^2$$\n\n**Step 4 \u2014 deduce the demand equation, using the relationship $TR=P\\times Q$, which means $P=\\dfrac{TR}{Q}$** (divide total revenue by quantity to recover price per unit):\n$$P = \\frac{TR}{Q} = \\frac{10Q-2Q^2}{Q} = \\frac{10Q}{Q}-\\frac{2Q^2}{Q} = 10-2Q$$\n\n**Final answer**: $TR=10Q-2Q^2$, and the demand equation is $P=10-2Q$."}, {"cat": "Applied Economics", "q": "A manufacturer's marginal cost is $M(x)=x^2+3x$. Find the cost function $C(x)$, assuming fixed costs (cost at $x=0$) are zero.", "hint": "Integrate the marginal cost function; use the fixed-cost condition to find the constant.", "ans": "**Step 1 \u2014 integrate the marginal cost function to recover total cost**, keeping the constant of integration for now:\n$$C(x) = \\int M(x)\\,dx = \\int(x^2+3x)\\,dx$$\nUsing the power rule on each term: $\\int x^2\\,dx=\\dfrac{x^3}{3}$, and $\\int 3x\\,dx = 3\\cdot\\dfrac{x^2}{2}=\\dfrac{3x^2}{2}$.\n$$C(x) = \\frac{x^3}{3}+\\frac{3x^2}{2}+C$$\n\n**Step 2 \u2014 use the given \"fixed cost\" condition to find $C$.** In economics, \"fixed cost\" means the cost incurred even at zero output \u2014 i.e. $C(0)$. We're told this is zero:\n$$C(0) = \\frac{(0)^3}{3}+\\frac{3(0)^2}{2}+C = C$$\nSince $C(0)$ must equal $0$, we get $C=0$.\n\n**Final answer**:\n$$C(x) = \\frac{x^3}{3}+\\frac{3x^2}{2}$$"}, {"cat": "Applied Economics", "q": "A company's marginal cost is $C'(x)=x^2-3x$. Find the cost function $C(x)$ if the fixed cost (cost at $x=0$) is 1,000 naira.", "hint": "Integrate, then use $C(0)=1000$ to find the constant.", "ans": "**Step 1 \u2014 integrate the marginal cost function**, keeping the constant of integration:\n$$C(x) = \\int(x^2-3x)\\,dx = \\frac{x^3}{3} - \\frac{3x^2}{2} + K$$\n\n(Using a different letter, $K$, for the constant here just to avoid confusion with the cost function $C(x)$ itself.)\n\n**Step 2 \u2014 use the given fixed-cost condition, $C(0)=1000$, to find $K$:**\n$$C(0) = \\frac{(0)^3}{3} - \\frac{3(0)^2}{2} + K = K$$\nSince $C(0)=1000$, we get $K=1000$.\n\n**Final answer**:\n$$C(x) = \\frac{x^3}{3} - \\frac{3x^2}{2} + 1000$$"}, {"cat": "Applied Economics", "q": "Given the demand function $P=10-Q$ and total cost $TC=12+2Q$: find (i) the total revenue function, (ii) the equilibrium price and quantity, (iii) the profit of the firm.", "hint": "TR = P\u00d7Q. Equilibrium here likely refers to profit maximization: set MR = MC.", "ans": "**(i) Find the total revenue function.** $TR=P\\times Q$, so substitute the demand equation:\n$$TR = (10-Q)Q = 10Q-Q^2$$\n\n**(ii) Find the \"equilibrium\" \u2014 here this means the profit-maximizing output and its corresponding price.** The standard profit-maximization rule from microeconomics is: a firm maximizes profit where marginal revenue equals marginal cost, $MR=MC$.\n\n**Step 1 \u2014 find $MR$** by differentiating $TR$: $MR = \\dfrac{d(TR)}{dQ} = 10-2Q$.\n\n**Step 2 \u2014 find $MC$** by differentiating $TC=12+2Q$: $MC = \\dfrac{d(TC)}{dQ}=2$ (a constant \u2014 since $TC$ is linear in $Q$, its slope, the marginal cost, never changes).\n\n**Step 3 \u2014 set $MR=MC$ and solve for $Q$:**\n$$10-2Q = 2 \\implies -2Q=2-10=-8 \\implies Q=4$$\n\n**Step 4 \u2014 find the corresponding price**, substituting $Q=4$ into the demand equation:\n$$P = 10-4=6$$\n\n**Result**: equilibrium output $Q=4$, equilibrium price $P=6$.\n\n**(iii) Find the profit of the firm.** Profit $\\pi = TR-TC$. First find each piece at $Q=4$: $TR(4) = 10(4)-(4)^2 = 40-16=24$. $TC(4) = 12+2(4)=12+8=20$.\n\n$$\\pi = TR-TC = 24-20 = 4$$\n\n**Final answer**: equilibrium $Q=4$, $P=6$; profit $=4$."}, {"cat": "Applied Economics", "q": "If $Q_d=18-2p$ and $Q_s=-2+2p$ are the demand and supply functions, compute the equilibrium price, quantity, and the point elasticities of demand and supply at that price.", "hint": "Equilibrium: set $Q_d=Q_s$. Elasticity: $E=\\frac{dQ}{dp}\\cdot\\frac{p}{Q}$.", "ans": "**Finding market equilibrium.** In a competitive market, equilibrium occurs where the quantity demanded exactly equals the quantity supplied \u2014 i.e. where the two curves intersect. Mathematically, we set $Q_d=Q_s$ and solve for the common price $p$.\n\n**Step 1 \u2014 set $Q_d=Q_s$:**\n$$18-2p = -2+2p$$\n\n**Step 2 \u2014 solve for $p$.** Move all $p$-terms to one side and constants to the other: add $2p$ to both sides and add $2$ to both sides:\n$$18+2 = 2p+2p \\implies 20=4p \\implies p=5$$\n\n**Step 3 \u2014 find the equilibrium quantity** by substituting $p=5$ into either equation (both should give the same answer, since they're equal at equilibrium \u2014 a good check):\n$$Q_d = 18-2(5) = 18-10=8 \\qquad\\qquad Q_s = -2+2(5)=-2+10=8$$\nBoth give $Q=8$ \u2713 \u2014 **equilibrium: $p=5$, $Q=8$.**\n\n**Step 4 \u2014 recall the elasticity formula.** **Price elasticity** measures how responsive quantity is to a change in price, and is calculated as: $E = \\dfrac{dQ}{dp}\\times\\dfrac{p}{Q}$ \u2014 the \"instantaneous slope\" of the curve, multiplied by the ratio of price to quantity at the point of interest.\n\n**Step 5 \u2014 compute the elasticity of demand at the equilibrium point.** First find $\\dfrac{dQ_d}{dp}$ (the slope of the demand curve \u2014 just differentiate $Q_d=18-2p$ with respect to $p$): $\\dfrac{dQ_d}{dp}=-2$. Now apply the formula, using the equilibrium values $p=5$, $Q=8$:\n$$E_d = -2 \\times \\frac{5}{8} = -\\frac{10}{8} = -1.25$$\nSince $|E_d|=1.25>1$, demand is **elastic** at this point (quantity demanded is proportionally more responsive than the price change).\n\n**Step 6 \u2014 compute the elasticity of supply.** $\\dfrac{dQ_s}{dp}=2$ (differentiate $Q_s=-2+2p$). Apply the formula:\n$$E_s = 2 \\times \\frac{5}{8} = \\frac{10}{8} = 1.25$$\nSince $E_s=1.25>1$, supply is also **elastic** at this point.\n\n**Final answer**: equilibrium $p=5$, $Q=8$; $E_d=-1.25$ (elastic); $E_s=1.25$ (elastic)."}, {"cat": "Applied Economics", "q": "A Cobb-Douglas production function is $f(x,y)=x^{2/3}y^{1/3}$ with budget constraint $100x+100y=400{,}000$ (in naira). If 300,000 naira is spent on $x$, (i) how much can be spent on $y$, (ii) what is total production, (iii) what if spending on $x$ changes to 350,000 naira?", "hint": "From the budget constraint, spending on $y$ = total budget \u2212 spending on $x$; then convert naira spent into units $x,y$ by dividing by the unit price (100).", "ans": "**(i) How much can be spent on $y$.** The total budget is $400{,}000$, and $300{,}000$ has already been allocated to $x$. The remaining budget simply goes to $y$:\n$$\\text{Spending on } y = 400{,}000 - 300{,}000 = 100{,}000$$\n\n**(ii) Find total production.** We first need to convert the amount of *money spent* into actual *units* of $x$ and $y$, since the production function requires quantities, not naira amounts. Since each unit costs 100 (from the constraint $100x+100y=\\ldots$, the \"100\" is the price per unit of each input), divide the spending by 100 to get the quantity:\n$$x = \\frac{300{,}000}{100} = 3000 \\qquad\\qquad y = \\frac{100{,}000}{100} = 1000$$\n\nNow substitute these quantities into the production function $f(x,y)=x^{2/3}y^{1/3}$:\n$$f = (3000)^{2/3}\\times(1000)^{1/3}$$\n\nCompute $1000^{1/3}$: since $10^3=1000$, we have $1000^{1/3}=10$.\n\nCompute $3000^{2/3}$: this means $(3000^{1/3})^2$. Since $3000^{1/3}\\approx14.42$ (as $14.42^3\\approx3000$), squaring gives $14.42^2\\approx208.0$.\n\nMultiply: $f \\approx 208.0 \\times 10 = 2080$.\n\n**Total production $\\approx 2080$ units.**\n\n**(iii) What if spending on $x$ changes to 350,000 naira?** Recompute with the new allocation. Remaining budget for $y$: $400{,}000-350{,}000=50{,}000$.\n\nConvert to units: $x=\\dfrac{350{,}000}{100}=3500$, $y=\\dfrac{50{,}000}{100}=500$.\n\nNew production: $f=(3500)^{2/3}\\times(500)^{1/3}$.\n\nCompute $500^{1/3}\\approx7.94$ (since $7.94^3\\approx500$).\n\nCompute $3500^{2/3}=(3500^{1/3})^2$: $3500^{1/3}\\approx15.18$, so $3500^{2/3}\\approx15.18^2\\approx230.4$.\n\nMultiply: $f\\approx230.4\\times7.94\\approx1829.4$.\n\n**New production $\\approx 1829$ units.**\n\n**Change in production**: $1829-2080 = -251$ (approximately), a **decrease**. This shows that shifting more spending toward $x$ (away from the more output-sensitive $y$, whose exponent contribution matters relatively more at this input mix) actually *reduced* total output here \u2014 illustrating that with a Cobb-Douglas function, there is generally an optimal balance between inputs for a given budget, and moving away from that balance (even toward the input with the larger exponent) can lower output if it pushes the input ratio too far from the cost-minimizing mix."}, {"cat": "Applied Economics", "q": "If a firm's average product function is $AP_L=\\dfrac{200}{L}+5L-\\dfrac{L^2}{4}$, derive the firm's production function and compute its marginal product when $L=10$.", "hint": "Production function $Q = AP_L \\times L$; marginal product $MP_L = \\frac{dQ}{dL}$.", "ans": "**Key economic relationship**: **average product** ($AP_L$) is defined as total output divided by the amount of labour used: $AP_L=\\dfrac{Q}{L}$. To go backwards from average product to the total production function $Q$, we simply reverse this relationship by multiplying both sides by $L$: $Q=AP_L\\times L$.\n\n**Step 1 \u2014 find $Q$ by multiplying $AP_L$ by $L$:**\n$$Q = AP_L\\cdot L = \\left(\\frac{200}{L}+5L-\\frac{L^2}{4}\\right)\\times L$$\n\n**Step 2 \u2014 distribute $L$ across each term inside the brackets** carefully:\n\n$\\dfrac{200}{L}\\times L = 200$ (the $L$'s cancel).\n\n$5L\\times L = 5L^2$.\n\n$-\\dfrac{L^2}{4}\\times L = -\\dfrac{L^3}{4}$.\n\n**Step 3 \u2014 combine these into the production function:**\n$$Q = 200+5L^2-\\frac{L^3}{4}$$\n\n**Step 4 \u2014 recall the definition of marginal product**: $MP_L=\\dfrac{dQ}{dL}$ (the extra output from one more unit of labour \u2014 the derivative of the production function with respect to labour).\n\n**Step 5 \u2014 differentiate $Q$ with respect to $L$** using the power rule:\n$$MP_L = \\frac{d}{dL}\\left(200+5L^2-\\frac{L^3}{4}\\right) = 10L - \\frac{3L^2}{4}$$\n(Derivative of the constant 200 is 0; derivative of $5L^2$ is $10L$; derivative of $-\\dfrac{L^3}{4}$ is $-\\dfrac{3L^2}{4}$.)\n\n**Step 6 \u2014 evaluate $MP_L$ at $L=10$:**\n$$MP_L(10) = 10(10) - \\frac{3(10)^2}{4} = 100 - \\frac{300}{4} = 100-75=25$$\n\n**Final answer**: production function $Q=200+5L^2-\\dfrac{L^3}{4}$; marginal product at $L=10$ is $\\bold{25}$."}, {"cat": "Applied Economics", "q": "A monopolist's demand function is $P=200-4q$. Find the marginal revenue (MR) and average revenue (AR) functions.", "hint": "$TR=P\\times q$, $MR=\\frac{d(TR)}{dq}$; $AR=P$ itself (i.e. $TR/q$).", "ans": "**Step 1 \u2014 find $TR$**, using $TR=P\\times q$:\n$$TR = (200-4q)\\times q = 200q-4q^2$$\n\n**Step 2 \u2014 find $MR$** by differentiating $TR$ with respect to $q$, using the power rule:\n$$MR = \\frac{d(TR)}{dq} = 200-8q$$\n\n**Step 3 \u2014 find $AR$**, using the definition $AR=\\dfrac{TR}{q}$:\n$$AR = \\frac{200q-4q^2}{q} = \\frac{200q}{q}-\\frac{4q^2}{q} = 200-4q$$\n\n**An important observation worth understanding**: $AR = 200-4q$ turns out to be *identical* to the original demand function $P=200-4q$. This is not a coincidence \u2014 it is a **general rule** that holds for any demand curve: since $TR=P\\times q$, dividing back by $q$ to get $AR$ always just recovers $P$ again: $AR=\\dfrac{TR}{q}=\\dfrac{P\\times q}{q}=P$. In other words, **the average revenue curve and the demand curve are always exactly the same curve** \u2014 this is why economists often draw them as one single line in diagrams.\n\n**Final answer**: $MR = 200-8q$; $AR = 200-4q$ (which is the same as the demand curve $P$)."}, {"cat": "Functions & Basic Concepts", "q": "Distinguish between increasing and decreasing functions.", "hint": "Does $y$ rise or fall as $x$ increases?", "ans": "**Increasing function.** A function $f(x)$ is **increasing** over an interval if, as $x$ gets larger, $y=f(x)$ also gets larger \u2014 formally, for any $x_1 < x_2$ in the interval, $f(x_1) < f(x_2)$. Graphically, the curve climbs as you move left to right. Example: $y=2x+3$ is increasing everywhere, since its slope (2) is always positive.\n\n**Decreasing function.** A function $f(x)$ is **decreasing** over an interval if, as $x$ gets larger, $y=f(x)$ gets smaller \u2014 for any $x_1<x_2$, $f(x_1) > f(x_2)$. Graphically, the curve falls as you move left to right. Example: $y=-3x+5$ is decreasing everywhere, since its slope ($-3$) is always negative.\n\n**How to test which one a function is**: look at the sign of the first derivative, $f'(x)$. If $f'(x)>0$ over an interval, the function is increasing there; if $f'(x)<0$, it's decreasing there. Many functions (like $y=x^2$) are increasing over part of their domain and decreasing over another part \u2014 $y=x^2$ decreases for $x<0$ and increases for $x>0$, since $f'(x)=2x$ changes sign at $x=0$."}, {"cat": "Functions & Basic Concepts", "q": "Distinguish between linear and non-linear functions.", "hint": "Does the graph form a straight line, or does it curve?", "ans": "**Linear function.** A function is **linear** if it can be written in the form $y=mx+c$, where $m$ (the slope) and $c$ (the intercept) are constants, and $x$ appears only to the first power. Its graph is always a straight line, and its slope (rate of change) is constant everywhere. Example: $y=3x+2$ \u2014 every extra unit of $x$ always adds exactly 3 to $y$, no matter where you are on the line.\n\n**Non-linear function.** A function is **non-linear** if it cannot be written in that straight-line form \u2014 this includes any function involving $x^2$, $x^3$, $\\sqrt{x}$, $e^x$, $\\log x$, trig functions, etc. Its graph is a curve, and its rate of change (slope) varies from point to point. Example: $y=x^2+3$ \u2014 the slope here is $2x$, which is different at every value of $x$ (e.g. the curve is much steeper at $x=10$ than at $x=1$).\n\n**Why the distinction matters in economics**: many simple economic models start with linear assumptions (e.g. a linear demand curve $P=a-bQ$) because they're easy to analyse, but real-world relationships (diminishing marginal utility, diminishing returns) are often genuinely non-linear, requiring calculus tools like the ones used throughout this course."}, {"cat": "Functions & Basic Concepts", "q": "Give four economic examples of a monotonic function.", "hint": "Think of relationships in economics that only ever move in one direction.", "ans": "Recall a **monotonic function** is one that is always increasing (or always decreasing) throughout its domain \u2014 it never changes direction. Several standard economic relationships fit this description:\n\n1. **A simple linear supply curve**, $Q_s = c+dP$ (with $d>0$): as price rises, quantity supplied always rises \u2014 monotonically increasing.\n\n2. **A simple linear demand curve**, $Q_d = a-bP$ (with $b>0$): as price rises, quantity demanded always falls \u2014 monotonically decreasing.\n\n3. **Total cost as a function of output** for a firm with constant or rising marginal cost, e.g. $TC = 50+10Q$: total cost always rises as output rises \u2014 monotonically increasing.\n\n4. **Cumulative savings over time** under a fixed positive savings rate, $S(t) = S_0 + rt$ (r > 0 constant): total accumulated savings only ever grows, never falls, as time passes \u2014 monotonically increasing.\n\nThe common thread: in each case, the dependent variable moves consistently in one direction as the independent variable increases \u2014 there's no \"turning point\" or reversal anywhere in the relevant range."}, {"cat": "Functions & Basic Concepts", "q": "Identify the type of each function: (i) $y=-5x+4$ (ii) $y=\\dfrac{2x^2+5}{2x+1}$ (iii) $x^2+y^2=74$ (iv) $y=ax^2+bx+c$ (constants $a,b,c$).", "hint": "Check the highest power of $x$, whether it's a ratio of polynomials, and whether $y$ is isolated.", "ans": "**(i) $y=-5x+4$.** This is $x$ to the first power only, with constant slope $-5$ and intercept $4$ \u2014 a **linear function**.\n\n**(ii) $y=\\dfrac{2x^2+5}{2x+1}$.** This is one polynomial ($2x^2+5$) divided by another ($2x+1$) \u2014 a **rational function**.\n\n**(iii) $x^2+y^2=74$.** Here $x$ and $y$ are mixed together with no isolation of $y$ (and in fact, solving for $y$ gives two possible values, $y=\\pm\\sqrt{74-x^2}$) \u2014 this is an **implicit function** (specifically, the equation of a circle of radius $\\sqrt{74}$).\n\n**(iv) $y=ax^2+bx+c$.** This has $x$ raised to whole-number powers (2, 1, 0) summed together \u2014 a **polynomial function** (specifically, a *quadratic* function, since the highest power is 2)."}, {"cat": "Functions & Basic Concepts", "q": "Distinguish between a single-value function and a multi-value function.", "hint": "Does one input ever produce more than one output?", "ans": "**Single-value function.** This is what mathematicians normally just call a \"function\" \u2014 for every input $x$, there is **exactly one** corresponding output $y$. This is the standard requirement built into the very definition of a function (as covered earlier: each input maps to one and only one output). Example: $y=x^2+1$ \u2014 for any given $x$, there's exactly one value of $y$.\n\n**Multi-value function** (also called a multi-valued relation). This is a relation where a single input $x$ can correspond to **more than one** output $y$ \u2014 technically, this violates the strict definition of a function, but the term is still used descriptively for such relations. Example: $x^2+y^2=25$ (a circle) \u2014 for $x=3$, there are *two* possible values, $y=4$ and $y=-4$. Another classic example is $y=\\pm\\sqrt{x}$, where each positive $x$ gives two square roots.\n\n**Why this matters**: when working with multi-valued relations in calculus (like implicit differentiation), you typically have to restrict attention to one \"branch\" (e.g. just the positive square root) to treat it as an ordinary single-value function before applying standard differentiation rules."}, {"cat": "Functions & Basic Concepts", "q": "If $f(x) = x + x^3 + x^5$, show that $f(-a) = -f(a)$ for all values of $a$.", "hint": "Substitute $-a$ for every $x$; every power here is odd, so every term flips sign.", "ans": "**Recall the sign rule**: a negative number raised to an **odd** power stays negative (e.g. $(-2)^3=-8$, $(-2)^5=-32$), since the negative signs don't fully cancel \u2014 one is always left over.\n\n**Step 1 \u2014 substitute $-a$ for $x$ everywhere in $f(x)=x+x^3+x^5$:**\n$$f(-a) = (-a) + (-a)^3 + (-a)^5$$\n\n**Step 2 \u2014 evaluate each power of $(-a)$ separately, using the odd-power sign rule:**\n- $(-a)^1 = -a$\n- $(-a)^3 = -a^3$\n- $(-a)^5 = -a^5$\n\n**Step 3 \u2014 substitute these back in:**\n$$f(-a) = -a - a^3 - a^5$$\n\n**Step 4 \u2014 factor out the common minus sign** to compare with $f(a)$:\n$$f(-a) = -(a+a^3+a^5) = -f(a)$$\n\n**Conclusion**: $f(-a) = -f(a)$ for all values of $a$. **This confirms $f(x)$ is an odd function** \u2014 every power of $x$ appearing in it (1, 3, 5) is odd, and whenever a function consists entirely of odd powers of $x$, it will always be an odd function, satisfying this property automatically for any $a$."}, {"cat": "Functions & Basic Concepts", "q": "Given $Y=f(X_1,X_2,X_3,X_4)=X_1^2-2X_1X_2+X_3^2X_4-25$, determine $f(-2,0,1,4)$. Also, given $f(X)=X^2-2X+9$, determine $f(a+b)$, $f(2)$, and $f(p)$.", "hint": "Plug the given values in for each variable, in order, being careful with signs.", "ans": "**Part 1 \u2014 evaluate $f(-2,0,1,4)$.** This notation means: substitute $X_1=-2$, $X_2=0$, $X_3=1$, $X_4=4$ into the function, in that specific order.\n$$f(-2,0,1,4) = (-2)^2 - 2(-2)(0) + (1)^2(4) - 25$$\n\nEvaluate term by term: $(-2)^2=4$; $-2(-2)(0) = 0$ (since anything times $0$ is $0$); $(1)^2(4)=4$; the constant is $-25$.\n$$f(-2,0,1,4) = 4 - 0 + 4 - 25 = -17$$\n\n**Part 2 \u2014 evaluate $f(X)=X^2-2X+9$ at three different inputs.** In each case, replace every occurrence of $X$ in the formula with the given input.\n\n**$f(a+b)$**: substitute $X=(a+b)$ throughout:\n$$f(a+b) = (a+b)^2 - 2(a+b) + 9$$\nExpand $(a+b)^2=a^2+2ab+b^2$ (the standard binomial expansion), and distribute the $-2$ across $(a+b)$:\n$$f(a+b) = a^2+2ab+b^2 - 2a-2b+9$$\n\n**$f(2)$**: substitute $X=2$:\n$$f(2) = (2)^2-2(2)+9 = 4-4+9 = 9$$\n\n**$f(p)$**: substitute $X=p$ (this is simply replacing the variable name, since $p$ is just another symbol standing for a number):\n$$f(p) = p^2-2p+9$$"}, {"cat": "Differentiation", "q": "Differentiate the following functions, giving your answer in a similar form: (i) $\\dfrac{1}{x^2}$ (ii) $x\\sqrt{x}$.", "hint": "Rewrite each as a power of $x$ first, then apply the power rule.", "ans": "**(i) $\\dfrac{1}{x^2}$.** First rewrite using a negative exponent, since the power rule is easiest to apply once everything is in the form $x^n$: $\\dfrac{1}{x^2}=x^{-2}$. Now apply the power rule (bring the exponent down, reduce it by 1):\n$$\\frac{d}{dx}(x^{-2}) = -2x^{-2-1} = -2x^{-3}$$\nConverting back to fraction form (matching the \"similar form\" the question asks for):\n$$= -\\frac{2}{x^3}$$\n\n**(ii) $x\\sqrt{x}$.** First rewrite the square root as a fractional exponent: $\\sqrt{x}=x^{1/2}$, so $x\\sqrt{x} = x^1 \\cdot x^{1/2}$. Using the exponent rule $x^a\\cdot x^b = x^{a+b}$, combine the powers: $x^1\\cdot x^{1/2} = x^{1+1/2}=x^{3/2}$.\n\nNow apply the power rule (bring down $\\frac32$, reduce the power by 1):\n$$\\frac{d}{dx}\\left(x^{3/2}\\right) = \\frac32 x^{3/2-1} = \\frac32 x^{1/2}$$\n\nConverting back to a similar (root) form:\n$$= \\frac{3}{2}\\sqrt{x}$$"}, {"cat": "Differentiation", "q": "If $y=e^x+e^{-x}$, show that $y=y''$.", "hint": "Differentiate twice and compare the result to the original function.", "ans": "**Step 1 \u2014 find the first derivative.** Recall $\\dfrac{d}{dx}(e^x)=e^x$, and $\\dfrac{d}{dx}(e^{-x})=-e^{-x}$ (chain rule, since the derivative of the exponent $-x$ is $-1$):\n$$y' = e^x - e^{-x}$$\n\n**Step 2 \u2014 find the second derivative** by differentiating $y'$ again, using the same two rules:\n$$y'' = e^x - (-e^{-x}) = e^x + e^{-x}$$\n(Subtracting a negative becomes addition.)\n\n**Step 3 \u2014 compare $y''$ to the original $y$.** We were given $y = e^x+e^{-x}$, and we've just found $y'' = e^x+e^{-x}$ \u2014 these are identical expressions.\n\n**Conclusion**: $y = y''$. **Verified.** (This is a hallmark property of the hyperbolic cosine function, since $y=e^x+e^{-x}=2\\cosh x$ \u2014 functions built from $e^x$ and $e^{-x}$ in this symmetric way reproduce themselves after two differentiations.)"}, {"cat": "Differentiation", "q": "If $y=\\log_e(at^c)$, find $\\dfrac{dy}{dt}$.", "hint": "Use log properties to split the expression before differentiating \u2014 it's much simpler than applying the chain rule directly to the product inside the log.", "ans": "**Step 1 \u2014 simplify using log properties before differentiating.** Recall the logarithm rule $\\log(AB) = \\log A + \\log B$, and $\\log(t^c) = c\\log t$. Applying both to $y=\\log_e(at^c)$:\n$$y = \\log_e(a) + \\log_e(t^c) = \\log_e(a) + c\\log_e(t)$$\n\n**Step 2 \u2014 differentiate with respect to $t$.** Since $a$ is a constant, $\\log_e(a)$ is also just a constant number, so its derivative is $0$. For the second term, recall $\\dfrac{d}{dt}(\\log_e t) = \\dfrac1t$, and $c$ is a constant multiplier that carries straight through:\n$$\\frac{dy}{dt} = 0 + c\\cdot\\frac{1}{t} = \\frac{c}{t}$$\n\n**Final answer**: $\\dfrac{dy}{dt} = \\dfrac{c}{t}$. Notice how much simpler this became by splitting the log *before* differentiating, rather than trying to apply the chain rule directly to $\\log(at^c)$ as one messy block."}, {"cat": "Differentiation", "q": "If $Y=e^{5x}$, find the first two derivatives.", "hint": "Apply the exponential chain rule repeatedly.", "ans": "**Recall the rule**: for $y=e^{kx}$ (a constant $k$ in the exponent), the chain rule gives $\\dfrac{dy}{dx} = k\\,e^{kx}$ \u2014 the derivative of $e^{\\text{anything}}$ is itself, multiplied by the derivative of that \"anything\" (here, the derivative of $5x$ is simply $5$).\n\n**Step 1 \u2014 find the first derivative**, with $k=5$:\n$$Y' = 5e^{5x}$$\n\n**Step 2 \u2014 find the second derivative**, by differentiating $Y'=5e^{5x}$ again using the same rule (the constant $5$ out front just carries through unchanged):\n$$Y'' = 5\\times5\\,e^{5x} = 25e^{5x}$$\n\n**Final answer**: $Y' = 5e^{5x}$, and $Y'' = 25e^{5x}$. (Notice the pattern: each further derivative of $e^{kx}$ picks up another factor of $k$ \u2014 the $n$-th derivative would be $k^ne^{kx}$.)"}, {"cat": "Differentiation", "q": "Given that $c(x)=180x+200$: (i) obtain the marginal cost function, (ii) find the change in cost as production increases from $x=5$ units to $x=10$ units.", "hint": "$MC=c'(x)$. For a linear cost function, the change in cost is just $MC$ times the change in output.", "ans": "**(i) Find the marginal cost function.** Marginal cost is the derivative of total cost with respect to output: $MC=c'(x)$. Differentiate $c(x)=180x+200$ using the power rule (the derivative of $180x$ is $180$; the derivative of the constant $200$ is $0$):\n$$MC = c'(x) = 180$$\nNotice this is a **constant** \u2014 since the original cost function is linear, its slope (marginal cost) never changes, regardless of the output level.\n\n**(ii) Find the change in cost as production increases from $x=5$ to $x=10$.** There are two equivalent ways to find this:\n\n**Method A (direct substitution)**: compute $c(10)$ and $c(5)$ separately, then subtract. $c(10) = 180(10)+200 = 1800+200=2000$. $c(5) = 180(5)+200=900+200=1100$. Change in cost $= c(10)-c(5) = 2000-1100 = 900$.\n\n**Method B (using marginal cost directly)**: since $MC$ is constant at $180$ for every unit, the total change in cost over 5 additional units ($10-5=5$) is simply $MC \\times \\Delta x = 180 \\times 5 = 900$ \u2014 matching Method A exactly (as it always will for a linear cost function).\n\n**Final answer**: $MC=180$; the change in cost from $x=5$ to $x=10$ is **900**."}, {"cat": "Differentiation", "q": "The profits of a firm are determined by the function $\\pi = 60x - 3x^2$. Determine the marginal profit when $x=4$.", "hint": "Marginal profit is the derivative of the profit function.", "ans": "**Step 1 \u2014 recall the definition.** **Marginal profit** is the extra profit earned from producing one more unit \u2014 mathematically, $\\dfrac{d\\pi}{dx}$.\n\n**Step 2 \u2014 differentiate $\\pi=60x-3x^2$** using the power rule (derivative of $60x$ is $60$; derivative of $-3x^2$ is $-6x$):\n$$\\frac{d\\pi}{dx} = 60-6x$$\n\n**Step 3 \u2014 evaluate at $x=4$:**\n$$\\frac{d\\pi}{dx}\\bigg|_{x=4} = 60-6(4) = 60-24 = 36$$\n\n**Final answer**: the marginal profit at $x=4$ is **36** \u2014 meaning producing one additional unit near $x=4$ would add approximately 36 to total profit."}, {"cat": "Differentiation", "q": "Given the sales of an automobile as $s(t)=200e^{-0.5t}$, obtain the marginal sales at $t=4$.", "hint": "Marginal sales is the derivative of the sales function w.r.t. time.", "ans": "**Step 1 \u2014 differentiate $s(t)=200e^{-0.5t}$** using the chain rule for exponentials (derivative of $e^{kt}$ is $k\\,e^{kt}$; here $k=-0.5$):\n$$s'(t) = 200\\times(-0.5)\\,e^{-0.5t} = -100e^{-0.5t}$$\n\n**Step 2 \u2014 evaluate at $t=4$:**\n$$s'(4) = -100e^{-0.5(4)} = -100e^{-2}$$\n\n**Step 3 \u2014 compute the numerical value.** Recall $e^{-2} \\approx 0.1353$:\n$$s'(4) \\approx -100 \\times 0.1353 = -13.53$$\n\n**Final answer**: marginal sales at $t=4$ is approximately **$-13.53$**. The negative sign tells us that, at this point in time, sales are *declining* \u2014 consistent with the fact that $s(t)=200e^{-0.5t}$ is a decaying exponential (sales start at $200$ when $t=0$ and steadily fall off toward zero as time passes, which is why every derivative of this function is negative)."}, {"cat": "Differentiation", "q": "For what value(s) of $x$ are the derivatives of $\\frac{1}{3}x^3$ and $x^2+3x$ equal?", "hint": "Differentiate both expressions separately, then set the two derivatives equal to each other and solve.", "ans": "**Step 1 \u2014 differentiate the first expression**, $\\frac13x^3$, using the power rule:\n$$\\frac{d}{dx}\\left(\\frac13x^3\\right) = \\frac13\\times3\\,x^2 = x^2$$\n\n**Step 2 \u2014 differentiate the second expression**, $x^2+3x$:\n$$\\frac{d}{dx}(x^2+3x) = 2x+3$$\n\n**Step 3 \u2014 set the two derivatives equal to each other**, since we want to find where they match:\n$$x^2 = 2x+3$$\n\n**Step 4 \u2014 rearrange into standard quadratic form** (move everything to one side):\n$$x^2-2x-3=0$$\n\n**Step 5 \u2014 factor the quadratic.** We need two numbers that multiply to $-3$ and add to $-2$: those are $-3$ and $1$. So:\n$$(x-3)(x+1)=0$$\n\n**Step 6 \u2014 solve for $x$:**\n$$x=3 \\qquad \\text{or} \\qquad x=-1$$\n\n**Final answer**: the two derivatives are equal at $x=3$ and $x=-1$."}, {"cat": "Partial Derivatives & Homogeneity", "q": "If $Z=x^3+2x^2y+3y^2$, compute $Z_{xx}$, $Z_{xy}$, and $Z_{yy}$.", "hint": "Find the first partials, then differentiate each one again.", "ans": "**Step 1 \u2014 find the first-order partial derivatives.**\n\n$Z_x$ (differentiate w.r.t. $x$, treating $y$ as constant): the derivative of $x^3$ is $3x^2$; the derivative of $2x^2y$ w.r.t. $x$ is $4xy$ (treating $2y$ as a constant multiplier of $x^2$); the derivative of $3y^2$ w.r.t. $x$ is $0$ (no $x$ present).\n$$Z_x = 3x^2+4xy$$\n\n$Z_y$ (differentiate w.r.t. $y$, treating $x$ as constant): the derivative of $x^3$ w.r.t. $y$ is $0$; the derivative of $2x^2y$ w.r.t. $y$ is $2x^2$; the derivative of $3y^2$ w.r.t. $y$ is $6y$.\n$$Z_y = 2x^2+6y$$\n\n**Step 2 \u2014 find $Z_{xx}$** by differentiating $Z_x=3x^2+4xy$ again with respect to $x$:\n$$Z_{xx} = 6x+4y$$\n\n**Step 3 \u2014 find $Z_{xy}$** by differentiating $Z_x=3x^2+4xy$ with respect to $y$ instead:\n$$Z_{xy} = 4x$$\n\n**Step 4 \u2014 find $Z_{yy}$** by differentiating $Z_y=2x^2+6y$ again with respect to $y$:\n$$Z_{yy} = 6$$\n\n**Final answer**: $Z_{xx}=6x+4y$, $Z_{xy}=4x$, $Z_{yy}=6$. (As a bonus check, differentiating $Z_y=2x^2+6y$ w.r.t. $x$ gives $Z_{yx}=4x$, matching $Z_{xy}$ exactly \u2014 consistent with Young's theorem.)"}, {"cat": "Partial Derivatives & Homogeneity", "q": "Compute the mixed partial derivatives of $f(x,y)=\\log_e\\left(\\dfrac{y}{x}\\right)$, and verify both Young's theorem and Euler's theorem for this function.", "hint": "Split the log first ($\\log y - \\log x$), then differentiate.", "ans": "**Step 1 \u2014 simplify using log properties before differentiating.** Recall $\\log\\left(\\dfrac{y}{x}\\right) = \\log y - \\log x$:\n$$f(x,y) = \\log_e y - \\log_e x$$\n\n**Step 2 \u2014 find the first partial derivatives.** $f_x$ (treat $y$ as constant, so $\\log y$ contributes $0$; the derivative of $-\\log x$ is $-\\frac1x$):\n$$f_x = -\\frac1x$$\n$f_y$ (treat $x$ as constant, so $-\\log x$ contributes $0$; the derivative of $\\log y$ is $\\frac1y$):\n$$f_y = \\frac1y$$\n\n**Step 3 \u2014 verify Young's theorem by finding both mixed partials.** $f_{xy}$ (differentiate $f_x=-\\frac1x$ w.r.t. $y$ \u2014 since $-\\frac1x$ has no $y$ in it at all, this is $0$):\n$$f_{xy} = 0$$\n$f_{yx}$ (differentiate $f_y=\\frac1y$ w.r.t. $x$ \u2014 since $\\frac1y$ has no $x$ in it, this is also $0$):\n$$f_{yx} = 0$$\nSince $f_{xy}=f_{yx}=0$, **Young's theorem is verified.**\n\n**Step 4 \u2014 verify Euler's theorem, first by finding the degree of homogeneity via the scaling test.** Replace $x\\to\\lambda x$, $y\\to\\lambda y$: $f(\\lambda x,\\lambda y) = \\log\\left(\\dfrac{\\lambda y}{\\lambda x}\\right) = \\log\\left(\\dfrac{y}{x}\\right) = f(x,y)$, since the $\\lambda$'s cancel. This means $f(\\lambda x,\\lambda y) = \\lambda^0 f(x,y)$, so **the function is homogeneous of degree 0**.\n\n**Step 5 \u2014 check Euler's theorem, $xf_x+yf_y = nf$, using $n=0$:**\n$$xf_x+yf_y = x\\left(-\\frac1x\\right) + y\\left(\\frac1y\\right) = -1+1 = 0$$\n\nSince this equals $0 = 0\\times f(x,y)$, **Euler's theorem is confirmed** with $n=0$, exactly matching the degree of homogeneity found by direct scaling."}, {"cat": "Partial Derivatives & Homogeneity", "q": "Verify that $Z=e^{x^2}+8xy+7y^2$ satisfies Young's theorem.", "hint": "Find $Z_{xy}$ and $Z_{yx}$ separately and confirm they match.", "ans": "**Step 1 \u2014 find $Z_x$** (differentiate w.r.t. $x$, treating $y$ as constant). For $e^{x^2}$, use the chain rule: derivative of the exponent $x^2$ is $2x$, so $\\dfrac{d}{dx}(e^{x^2})=2xe^{x^2}$. For $8xy$, treating $y$ as constant, the derivative is $8y$. For $7y^2$, there's no $x$, so the derivative is $0$.\n$$Z_x = 2xe^{x^2}+8y$$\n\n**Step 2 \u2014 find $Z_{xy}$** by differentiating $Z_x$ with respect to $y$. The term $2xe^{x^2}$ has no $y$ in it, so its derivative w.r.t. $y$ is $0$; the derivative of $8y$ w.r.t. $y$ is $8$:\n$$Z_{xy} = 8$$\n\n**Step 3 \u2014 find $Z_y$** (differentiate the original function w.r.t. $y$, treating $x$ as constant). $e^{x^2}$ has no $y$, so contributes $0$; the derivative of $8xy$ w.r.t. $y$ is $8x$; the derivative of $7y^2$ is $14y$.\n$$Z_y = 8x+14y$$\n\n**Step 4 \u2014 find $Z_{yx}$** by differentiating $Z_y$ with respect to $x$. The derivative of $8x$ w.r.t. $x$ is $8$; the derivative of $14y$ w.r.t. $x$ is $0$ (no $x$):\n$$Z_{yx} = 8$$\n\n**Comparison**: $Z_{xy}=8=Z_{yx}$. **Young's theorem is confirmed** for this function."}, {"cat": "Partial Derivatives & Homogeneity", "q": "Using Euler's theorem, determine the degree of homogeneity of: (i) $F(x,y)=x^3+2x^2y+y^3$ (ii) $f(L,K)=AL^\\alpha K^\\beta$ (iii) $f(x_1,x_2,x_3)=12x_1^{0.2}x_2^{0.3}x_3^{0.5}$.", "hint": "For a sum of terms, check whether every term has the same total power of the variables combined. For a product of powers, just add the exponents.", "ans": "**(i) $F(x,y)=x^3+2x^2y+y^3$.** Check the *total* power of $x$ and $y$ combined in each term: $x^3$ has total power $3$; $2x^2y$ has total power $2+1=3$; $y^3$ has total power $3$. Every term has the same total power, $3$, so this function is **homogeneous of degree 3**. Confirm via the scaling test: $F(\\lambda x,\\lambda y) = \\lambda^3x^3+2\\lambda^3x^2y+\\lambda^3y^3 = \\lambda^3F(x,y)$ \u2713.\n\n**(ii) $f(L,K)=AL^\\alpha K^\\beta$.** This is a classic Cobb-Douglas production function. Scale $L\\to\\lambda L$, $K\\to\\lambda K$:\n$$f(\\lambda L,\\lambda K) = A(\\lambda L)^\\alpha(\\lambda K)^\\beta = A\\lambda^\\alpha L^\\alpha\\lambda^\\beta K^\\beta = \\lambda^{\\alpha+\\beta}\\left(AL^\\alpha K^\\beta\\right) = \\lambda^{\\alpha+\\beta}f(L,K)$$\nSo the function is **homogeneous of degree $\\alpha+\\beta$** \u2014 for functions of this multiplicative \"power\" form, the degree of homogeneity is simply the sum of the exponents.\n\n**(iii) $f(x_1,x_2,x_3)=12x_1^{0.2}x_2^{0.3}x_3^{0.5}$.** By the same logic as (ii), the degree of homogeneity is the sum of the exponents: $0.2+0.3+0.5 = 1.0$. **This function is homogeneous of degree 1** (constant returns to scale) \u2014 doubling all three inputs exactly doubles output."}, {"cat": "Partial Derivatives & Homogeneity", "q": "Is the function $Q=x^2-6xy+7y^3$ homogeneous? Explain.", "hint": "Check the total power of $x,y$ combined in each separate term \u2014 they need to all match for homogeneity to hold.", "ans": "**The key test for homogeneity of a sum of terms**: every single term in the expression must have the *same* total combined power of the variables. If even one term differs, the function is **not** homogeneous of any degree.\n\n**Step 1 \u2014 check the total power of each term in $Q=x^2-6xy+7y^3$.**\n- $x^2$: total power $= 2$.\n- $-6xy$: total power $= 1+1 = 2$.\n- $7y^3$: total power $= 3$.\n\n**Step 2 \u2014 compare.** The first two terms have total power $2$, but the third term, $7y^3$, has total power $3$ \u2014 this is *different* from the other two.\n\n**Step 3 \u2014 confirm with the direct scaling test.** Replace $x\\to\\lambda x$, $y\\to\\lambda y$:\n$$Q(\\lambda x,\\lambda y) = (\\lambda x)^2-6(\\lambda x)(\\lambda y)+7(\\lambda y)^3 = \\lambda^2x^2-6\\lambda^2xy+7\\lambda^3y^3$$\n\nNotice we cannot factor out a *single* common power of $\\lambda$ from all three terms \u2014 the first two terms carry $\\lambda^2$, but the last term carries $\\lambda^3$. Since the expression cannot be written as $\\lambda^n Q(x,y)$ for any single $n$, **this function is NOT homogeneous** (of any degree). This is a useful example showing that not every polynomial function in $x$ and $y$ is homogeneous \u2014 only ones where every term shares the same total degree."}, {"cat": "Partial Derivatives & Homogeneity", "q": "Tomi claims that the general result $Z_{xy}=Z_{yx}$ holds for $Z=\\log(\\sin x) - \\log(\\cos y)$. Is Tomi correct?", "hint": "Compute both mixed partials directly and compare \u2014 this is a direct application of Young's theorem.", "ans": "**Step 1 \u2014 find $Z_x$** (differentiate w.r.t. $x$, treating $y$ as constant). The derivative of $\\log(\\sin x)$ w.r.t. $x$ is $\\dfrac{\\cos x}{\\sin x} = \\cot x$ (chain rule: $\\frac{u'}{u}$ with $u=\\sin x$, $u'=\\cos x$). The term $-\\log(\\cos y)$ has no $x$ in it, so contributes $0$.\n$$Z_x = \\cot x$$\n\n**Step 2 \u2014 find $Z_{xy}$** by differentiating $Z_x=\\cot x$ with respect to $y$. Since $\\cot x$ contains no $y$ at all, its derivative with respect to $y$ is simply $0$:\n$$Z_{xy} = 0$$\n\n**Step 3 \u2014 find $Z_y$** (differentiate the original function w.r.t. $y$, treating $x$ as constant). The term $\\log(\\sin x)$ has no $y$, contributing $0$. The derivative of $-\\log(\\cos y)$ w.r.t. $y$ is $-\\dfrac{-\\sin y}{\\cos y} = \\dfrac{\\sin y}{\\cos y} = \\tan y$ (chain rule: derivative of $\\log(\\cos y)$ is $\\frac{-\\sin y}{\\cos y}$, and there's an overall minus sign in front of the whole term, so the two negatives cancel).\n$$Z_y = \\tan y$$\n\n**Step 4 \u2014 find $Z_{yx}$** by differentiating $Z_y=\\tan y$ with respect to $x$. Since $\\tan y$ contains no $x$ at all, its derivative with respect to $x$ is $0$:\n$$Z_{yx} = 0$$\n\n**Comparison**: $Z_{xy}=0=Z_{yx}$. **Yes, Tomi is correct** \u2014 the result holds for this function. This should come as no surprise: Young's theorem guarantees $Z_{xy}=Z_{yx}$ for *any* function with continuous second-order partial derivatives, and this function easily satisfies that condition, so the equality was essentially guaranteed to hold before we even calculated it."}, {"cat": "Partial Derivatives & Homogeneity", "q": "If $z=e^{\\log x + \\log y}$, evaluate $\\dfrac{\\partial^2 z}{\\partial x\\partial y}$ and $\\dfrac{\\partial^2 z}{\\partial y\\partial x}$.", "hint": "Simplify $z$ using the property $e^{\\log a}=a$ before differentiating \u2014 the expression collapses to something very simple.", "ans": "**Step 1 \u2014 simplify $z$ before differentiating at all.** Recall the fundamental inverse relationship between $e^x$ and $\\log x$: $e^{\\log a}=a$ for any $a>0$. Also recall $\\log x+\\log y = \\log(xy)$. So:\n$$z = e^{\\log x+\\log y} = e^{\\log(xy)} = xy$$\n\nThe whole complicated-looking expression collapses to simply $z=xy$ \u2014 a huge simplification that makes the rest of the problem trivial.\n\n**Step 2 \u2014 find the first partial derivatives** of $z=xy$: $z_x = y$ (treating $y$ as a constant multiplier of $x$); $z_y = x$ (treating $x$ as a constant multiplier of $y$).\n\n**Step 3 \u2014 find $\\dfrac{\\partial^2z}{\\partial x\\partial y}$** by differentiating $z_y=x$ with respect to... wait, let's be precise about notation: $\\dfrac{\\partial^2z}{\\partial x\\partial y}$ means differentiate first w.r.t. $y$, then w.r.t. $x$ (right-to-left order in this notation), which equals $z_{yx}$. Starting from $z_y=x$, differentiate w.r.t. $x$: \n$$\\frac{\\partial^2z}{\\partial x\\partial y} = \\frac{\\partial}{\\partial x}(x) = 1$$\n\n**Step 4 \u2014 find $\\dfrac{\\partial^2z}{\\partial y\\partial x}$**, meaning differentiate first w.r.t. $x$, then w.r.t. $y$, i.e. $z_{xy}$. Starting from $z_x=y$, differentiate w.r.t. $y$:\n$$\\frac{\\partial^2z}{\\partial y\\partial x} = \\frac{\\partial}{\\partial y}(y) = 1$$\n\n**Final answer**: both mixed partials equal $\\mathbf{1}$ \u2014 as expected, they are equal, consistent with Young's theorem."}, {"cat": "Partial Derivatives & Homogeneity", "q": "Given $f(x,y)=x^\\alpha + xy^\\beta$ (where $\\alpha,\\beta$ are constants), evaluate $f_{xx}$, $f_{yy}$, and $f_{xy}$.", "hint": "Find the first partials first, using the power rule on each term, then differentiate again.", "ans": "**Step 1 \u2014 find $f_x$** (differentiate w.r.t. $x$, treating $y$ as constant). The derivative of $x^\\alpha$ is $\\alpha x^{\\alpha-1}$ (power rule). The derivative of $xy^\\beta$ w.r.t. $x$ is $y^\\beta$ (since $y^\\beta$ is just a constant multiplier of $x$ here).\n$$f_x = \\alpha x^{\\alpha-1} + y^\\beta$$\n\n**Step 2 \u2014 find $f_{xx}$** by differentiating $f_x$ again with respect to $x$: the derivative of $\\alpha x^{\\alpha-1}$ is $\\alpha(\\alpha-1)x^{\\alpha-2}$ (power rule again); the derivative of $y^\\beta$ w.r.t. $x$ is $0$ (no $x$ present).\n$$f_{xx} = \\alpha(\\alpha-1)x^{\\alpha-2}$$\n\n**Step 3 \u2014 find $f_y$** (differentiate the original function w.r.t. $y$, treating $x$ as constant). The term $x^\\alpha$ has no $y$, contributing $0$. The derivative of $xy^\\beta$ w.r.t. $y$ is $\\beta xy^{\\beta-1}$ (power rule, with $x$ as the constant multiplier).\n$$f_y = \\beta xy^{\\beta-1}$$\n\n**Step 4 \u2014 find $f_{yy}$** by differentiating $f_y$ again with respect to $y$:\n$$f_{yy} = \\beta(\\beta-1)xy^{\\beta-2}$$\n\n**Step 5 \u2014 find $f_{xy}$** by differentiating $f_x = \\alpha x^{\\alpha-1}+y^\\beta$ with respect to $y$: the first term has no $y$, contributing $0$; the derivative of $y^\\beta$ is $\\beta y^{\\beta-1}$.\n$$f_{xy} = \\beta y^{\\beta-1}$$\n\n**Final answer**: $f_{xx}=\\alpha(\\alpha-1)x^{\\alpha-2}$, $f_{yy}=\\beta(\\beta-1)xy^{\\beta-2}$, $f_{xy}=\\beta y^{\\beta-1}$."}, {"cat": "Optimization: Extrema & Lagrangian", "q": "Given $Y=\\ln x_1+2\\ln x_2$ subject to $2x_1+3x_2=18$, obtain the value of $x_1$ and $x_2$ at the stationary point, given that the second-order condition is checked.", "hint": "Set up the Lagrangian, solve the FOCs, then check the bordered Hessian to classify the point.", "ans": "**Step 1 \u2014 set up the Lagrangian:**\n$$\\mathcal{L} = \\ln x_1+2\\ln x_2+\\lambda(18-2x_1-3x_2)$$\n\n**Step 2 \u2014 find the FOCs.** Recall $\\dfrac{d}{dx}(\\ln x)=\\dfrac1x$:\n$$\\mathcal{L}_{x_1} = \\frac{1}{x_1}-2\\lambda=0 \\quad\\Rightarrow\\quad x_1=\\frac{1}{2\\lambda} \\quad\\text{...(i)}$$\n$$\\mathcal{L}_{x_2} = \\frac{2}{x_2}-3\\lambda=0 \\quad\\Rightarrow\\quad x_2=\\frac{2}{3\\lambda} \\quad\\text{...(ii)}$$\n$$\\mathcal{L}_\\lambda = 18-2x_1-3x_2=0 \\quad\\text{...(iii)}$$\n\n**Step 3 \u2014 substitute (i) and (ii) into the constraint (iii):**\n$$18 - 2\\left(\\frac{1}{2\\lambda}\\right) - 3\\left(\\frac{2}{3\\lambda}\\right) = 0$$\n$$18 - \\frac1\\lambda - \\frac2\\lambda = 0 \\implies 18 = \\frac3\\lambda \\implies \\lambda = \\frac{3}{18}=\\frac16$$\n\n**Step 4 \u2014 back-substitute to find $x_1$ and $x_2$.** From (i): $x_1 = \\dfrac{1}{2(1/6)} = \\dfrac{1}{1/3} = 3$. From (ii): $x_2 = \\dfrac{2}{3(1/6)} = \\dfrac{2}{1/2} = 4$.\n\n**Result**: $x_1=3$, $x_2=4$, $\\lambda=\\dfrac16$.\n\n**Step 5 \u2014 check the second-order condition via the Bordered Hessian.** We need $g_1=2$, $g_2=3$ (partials of the constraint $g=2x_1+3x_2$), and the second partials of $\\mathcal{L}$: $\\mathcal{L}_{11}=-\\dfrac{1}{x_1^2}$, $\\mathcal{L}_{22}=-\\dfrac{2}{x_2^2}$, $\\mathcal{L}_{12}=0$. At $x_1=3,x_2=4$: $\\mathcal{L}_{11}=-\\dfrac19$, $\\mathcal{L}_{22}=-\\dfrac{2}{16}=-\\dfrac18$.\n$$H = \\begin{bmatrix}0&2&3\\\\2&-\\frac19&0\\\\3&0&-\\frac18\\end{bmatrix}$$\n\n**Step 6 \u2014 compute the determinant**, expanding along the first row:\n$$|H| = 0\\left[\\left(-\\frac19\\right)\\left(-\\frac18\\right)-0\\right] - 2\\left[2\\left(-\\frac18\\right)-0\\right] + 3\\left[0-\\left(-\\frac19\\right)(3)\\right]$$\n$$= 0 - 2\\left(-\\frac14\\right) + 3\\left(\\frac13\\right) = 0.5+1 = 1.5$$\n\n**Step 7 \u2014 interpret the sign.** Since $|H|=1.5>0$ (for 2 choice variables, 1 constraint), this signals a **constrained maximum**, not a minimum \u2014 note that logarithmic objective functions like this one are typically maximized (this is the standard set-up for a utility-maximization problem in economics), so the outcome here \u2014 a maximum at $x_1=3, x_2=4$ \u2014 is the expected result for this type of function."}, {"cat": "Optimization: Extrema & Lagrangian", "q": "Find the relative optimum value(s) of the function $Z=f(x,y)=x^2+y^2+4x-8y$.", "hint": "This is unconstrained: set both partial derivatives to zero, solve simultaneously, then use the Hessian to classify.", "ans": "**Step 1 \u2014 find the first-order partial derivatives** (this is an unconstrained optimization with two choice variables, so both partials must equal zero simultaneously at any extremum):\n$$Z_x = 2x+4 \\qquad\\qquad Z_y = 2y-8$$\n\n**Step 2 \u2014 set both partials to zero and solve.**\n$$Z_x=0 \\implies 2x+4=0 \\implies x=-2$$\n$$Z_y=0 \\implies 2y-8=0 \\implies y=4$$\n\n**Step 3 \u2014 find the second-order partials**, needed to classify the critical point $(-2,4)$:\n$$Z_{xx}=2 \\qquad Z_{yy}=2 \\qquad Z_{xy}=0$$\n\n**Step 4 \u2014 apply the (unconstrained, two-variable) Hessian test.** Compute the Hessian determinant $D = Z_{xx}Z_{yy}-(Z_{xy})^2$:\n$$D = (2)(2)-(0)^2 = 4$$\nSince $D>0$ and $Z_{xx}=2>0$, the point is a **relative minimum** (the rule: $D>0$ and $Z_{xx}>0$ \u2192 minimum; $D>0$ and $Z_{xx}<0$ \u2192 maximum; $D<0$ \u2192 saddle point, neither).\n\n**Step 5 \u2014 find the minimum value** by substituting $x=-2, y=4$ into the original function:\n$$Z(-2,4) = (-2)^2+(4)^2+4(-2)-8(4) = 4+16-8-32 = -20$$\n\n**Final answer**: relative minimum at $(x,y)=(-2,4)$, with minimum value $Z=-20$."}, {"cat": "Optimization: Extrema & Lagrangian", "q": "An assembly plant orders $x$ units of a product each time it places an order. The yearly cost of ordering and holding inventory is $f(x)=4000+4x+\\dfrac{10000}{x}$. What order size minimizes the yearly cost?", "hint": "Set $f'(x)=0$ and solve; confirm it's a minimum with $f''(x)$.", "ans": "**Step 1 \u2014 rewrite $\\dfrac{10000}{x}$ as $10000x^{-1}$**, so the power rule can be applied cleanly:\n$$f(x) = 4000+4x+10000x^{-1}$$\n\n**Step 2 \u2014 differentiate**, using the power rule term by term:\n$$f'(x) = 4 - 10000x^{-2} = 4 - \\frac{10000}{x^2}$$\n\n**Step 3 \u2014 set $f'(x)=0$ and solve for $x$** (the candidate order size that minimizes cost):\n$$4 - \\frac{10000}{x^2} = 0 \\implies \\frac{10000}{x^2}=4 \\implies x^2 = \\frac{10000}{4}=2500$$\n$$x = \\sqrt{2500} = 50$$\n(We take the positive root only, since a negative order size makes no economic sense.)\n\n**Step 4 \u2014 find the second derivative** to confirm this is genuinely a minimum:\n$$f''(x) = \\frac{20000}{x^3}$$\nFor $x=50>0$, $f''(50) = \\dfrac{20000}{125000} > 0$ \u2014 positive, confirming this is a **minimum**.\n\n**Step 5 \u2014 find the minimum yearly cost** (optional, but useful context): $f(50)=4000+4(50)+\\dfrac{10000}{50} = 4000+200+200 = 4400$.\n\n**Final answer**: the plant should order **50 units** each time to minimize yearly cost, giving a minimum yearly cost of $4400$."}, {"cat": "Optimization: Extrema & Lagrangian", "q": "Using the Lagrangean multiplier method, find a rectangular consumption basket which has the largest area for a given perimeter.", "hint": "Let the sides be $x$ and $y$; maximize area $xy$ subject to the perimeter constraint $2x+2y=P$.", "ans": "**Step 1 \u2014 set up the problem.** Let the rectangle have sides $x$ and $y$. Its area is $A=xy$ (the quantity to maximize), and its perimeter is fixed at some given value $P$, giving the constraint $2x+2y=P$.\n\n**Step 2 \u2014 set up the Lagrangian**, writing the constraint as $P-2x-2y=0$:\n$$\\mathcal{L} = xy + \\lambda(P-2x-2y)$$\n\n**Step 3 \u2014 find the FOCs:**\n$$\\mathcal{L}_x = y-2\\lambda = 0 \\quad\\Rightarrow\\quad y=2\\lambda \\quad\\text{...(i)}$$\n$$\\mathcal{L}_y = x-2\\lambda = 0 \\quad\\Rightarrow\\quad x=2\\lambda \\quad\\text{...(ii)}$$\n$$\\mathcal{L}_\\lambda = P-2x-2y=0 \\quad\\text{...(iii)}$$\n\n**Step 4 \u2014 compare (i) and (ii).** Both say the variable equals $2\\lambda$, so:\n$$x = y$$\nThis is the key result: **the rectangle that maximizes area for a fixed perimeter must be a square** (equal sides).\n\n**Step 5 \u2014 find the specific side length** by substituting $x=y$ into the constraint (iii): $P-2x-2x=0 \\implies P=4x \\implies x = \\dfrac{P}{4}$. So $y=\\dfrac{P}{4}$ as well.\n\n**Step 6 \u2014 find the maximum area**:\n$$A = xy = \\left(\\frac{P}{4}\\right)\\left(\\frac{P}{4}\\right) = \\frac{P^2}{16}$$\n\n**Final answer**: the largest-area rectangle for a given perimeter $P$ is a **square with side $\\dfrac{P}{4}$**, giving maximum area $\\dfrac{P^2}{16}$."}, {"cat": "Optimization: Extrema & Lagrangian", "q": "The total cost related to the number of maintenance engineers is $TC=3E^2-18E+4$. Determine the number of engineers $E$ that minimizes the average cost.", "hint": "Form the average cost function $AC=TC/E$, then minimize it with the usual first- and second-derivative tests.", "ans": "**Step 1 \u2014 form the average cost function**, dividing every term of $TC$ by $E$:\n$$AC = \\frac{TC}{E} = \\frac{3E^2-18E+4}{E} = 3E - 18 + \\frac{4}{E}$$\n\n**Step 2 \u2014 rewrite $\\dfrac4E$ as $4E^{-1}$** so the power rule applies cleanly, then differentiate:\n$$AC = 3E-18+4E^{-1}$$\n$$AC' = 3 - 4E^{-2} = 3 - \\frac{4}{E^2}$$\n\n**Step 3 \u2014 set $AC'=0$ and solve for $E$:**\n$$3 - \\frac{4}{E^2}=0 \\implies \\frac{4}{E^2}=3 \\implies E^2 = \\frac43 \\implies E = \\sqrt{\\frac43} = \\frac{2}{\\sqrt3} \\approx 1.15$$\n\n**Step 4 \u2014 find the second derivative** to confirm this is a minimum:\n$$AC'' = \\frac{8}{E^3}$$\nFor any positive $E$, $AC''>0$ \u2014 confirming a **minimum**.\n\n**Final answer**: average cost is minimized at $E = \\dfrac{2}{\\sqrt3} \\approx 1.15$. (In practice, since a fractional number of engineers isn't directly meaningful, a firm would compare the average cost at $E=1$ and $E=2$ and choose whichever integer value gives the lower actual average cost \u2014 but the mathematically exact minimizing point of the continuous function is $E\\approx1.15$.)"}, {"cat": "Optimization: Extrema & Lagrangian", "q": "Highlight three principal advantages of the Lagrangean method over the substitution method for constrained optimization.", "hint": "Think about what happens when the constraint can't easily be solved for one variable, and what extra information the Lagrangian method provides.", "ans": "While both the **substitution method** (solve the constraint for one variable, plug it into the objective, then optimize as usual) and the **Lagrangean method** (introduce a multiplier $\\lambda$ and form an augmented function) can solve the same constrained optimization problems, the Lagrangean method has several practical advantages:\n\n1. **It works even when the constraint cannot easily be solved explicitly for one variable.** Some constraints are too complex, implicit, or nonlinear to isolate a single variable cleanly (e.g. $x^2y^3+xy=10$); the Lagrangean method sidesteps this entirely, since it never requires solving the constraint algebraically for one variable.\n\n2. **It generalizes cleanly to problems with several constraints and many variables**, simply by adding one multiplier per constraint \u2014 the underlying logic (form $\\mathcal{L}$, take partials, set to zero) stays the same regardless of how many variables or constraints are involved, whereas substitution becomes increasingly messy and error-prone as the number of constraints grows.\n\n3. **The multiplier $\\lambda$ itself carries valuable economic meaning** \u2014 it measures the *shadow price* of the constraint, i.e. approximately how much the optimal value of the objective function would change if the constraint were relaxed by one unit. The substitution method produces the same optimal solution values, but it does not naturally hand you this extra piece of economic information."}, {"cat": "Matrices & Determinants", "q": "Solve the system of equations using the matrix approach: $X_1+X_2-X_3=2$, $2X_1-X_2+X_3=3$, $3X_1+X_2+2X_3=2$. Find the coefficient matrix, its determinant, and the solution values.", "hint": "Write the coefficient matrix, find its determinant, then use Cramer's rule (replace each column with the constants in turn).", "ans": "**Step 1 \u2014 write the coefficient matrix $A$ and the constants vector $B$:**\n$$A = \\begin{bmatrix}1&1&-1\\\\2&-1&1\\\\3&1&2\\end{bmatrix} \\qquad B=\\begin{bmatrix}2\\\\3\\\\2\\end{bmatrix}$$\n\n**Step 2 \u2014 find $|A|$**, expanding along the first row:\n$$|A| = 1\\begin{vmatrix}-1&1\\\\1&2\\end{vmatrix} - 1\\begin{vmatrix}2&1\\\\3&2\\end{vmatrix} + (-1)\\begin{vmatrix}2&-1\\\\3&1\\end{vmatrix}$$\n$$= 1(-2-1) - 1(4-3) - 1(2-(-3)) = 1(-3)-1(1)-1(5) = -3-1-5=-9$$\n\n**Step 3 \u2014 use Cramer's rule for $X_1$**, replacing column 1 of $A$ with $B$:\n$$A_1 = \\begin{bmatrix}2&1&-1\\\\3&-1&1\\\\2&1&2\\end{bmatrix}$$\n$$|A_1| = 2(-2-1) - 1(6-2) -1(3-(-2)) = 2(-3)-1(4)-1(5) = -6-4-5=-15$$\n$$X_1 = \\frac{|A_1|}{|A|} = \\frac{-15}{-9} = \\frac53$$\n\n**Step 4 \u2014 find $X_2$**, replacing column 2 with $B$:\n$$A_2 = \\begin{bmatrix}1&2&-1\\\\2&3&1\\\\3&2&2\\end{bmatrix}$$\n$$|A_2| = 1(6-2) - 2(4-3) -1(4-9) = 1(4)-2(1)-1(-5) = 4-2+5=7$$\n$$X_2 = \\frac{|A_2|}{|A|} = \\frac{7}{-9} = -\\frac79$$\n\n**Step 5 \u2014 find $X_3$**, replacing column 3 with $B$:\n$$A_3 = \\begin{bmatrix}1&1&2\\\\2&-1&3\\\\3&1&2\\end{bmatrix}$$\n$$|A_3| = 1(-2-3) - 1(4-9) +2(2-(-3)) = 1(-5)-1(-5)+2(5) = -5+5+10=10$$\n$$X_3 = \\frac{|A_3|}{|A|} = \\frac{10}{-9} = -\\frac{10}{9}$$\n\n**Final answer**: $|A|=-9$, $X_1=\\dfrac53$, $X_2=-\\dfrac79$, $X_3=-\\dfrac{10}{9}$. (Check equation 2: $2\\left(\\frac53\\right)-\\left(-\\frac79\\right)+\\left(-\\frac{10}9\\right) = \\frac{10}3+\\frac79-\\frac{10}9 = \\frac{30}9-\\frac39 = \\frac{27}9=3$ \u2713, matching the right-hand side.)"}, {"cat": "Matrices & Determinants", "q": "Solve the following set of equations using elimination/Cramer's rule: $7A-B-C=0$, $10A-2B+C=8$, $6A+3B-2C=7$.", "hint": "Use equation (1) to express $C$ in terms of $A$ and $B$, then substitute into the other two equations to reduce to two unknowns.", "ans": "**Step 1 \u2014 use equation (1) to isolate $C$.** From $7A-B-C=0$:\n$$C = 7A-B$$\n\n**Step 2 \u2014 substitute this into equation (2)**, $10A-2B+C=8$:\n$$10A-2B+(7A-B) = 8 \\implies 17A-3B=8 \\quad\\text{...(2')}$$\n\n**Step 3 \u2014 substitute $C=7A-B$ into equation (3)**, $6A+3B-2C=7$:\n$$6A+3B-2(7A-B)=7 \\implies 6A+3B-14A+2B=7 \\implies -8A+5B=7 \\quad\\text{...(3')}$$\n\n**Step 4 \u2014 solve equations (2') and (3') simultaneously.** From (2'): $17A-3B=8 \\implies B = \\dfrac{17A-8}{3}$.\n\n**Step 5 \u2014 substitute this into (3'):**\n$$-8A + 5\\left(\\frac{17A-8}{3}\\right) = 7$$\nMultiply every term by 3 to clear the fraction:\n$$-24A + 5(17A-8) = 21 \\implies -24A+85A-40=21 \\implies 61A = 61 \\implies A=1$$\n\n**Step 6 \u2014 back-substitute to find $B$**: $B = \\dfrac{17(1)-8}{3} = \\dfrac{9}{3}=3$.\n\n**Step 7 \u2014 back-substitute to find $C$**: $C = 7(1)-3 = 4$.\n\n**Final answer**: $A=1$, $B=3$, $C=4$. (Check equation 3: $6(1)+3(3)-2(4) = 6+9-8=7$ \u2713, matching the right-hand side.)"}, {"cat": "Matrices & Determinants", "q": "Given $A=\\begin{bmatrix}1&1&1\\\\0&1&0\\\\0&0&1\\end{bmatrix}$: (i) find $A^{-1}$, (ii) show $AA^{-1}=I$.", "hint": "Think of what row operations undo \u2014 since $A$ maps $(x,y,z)$ to $(x+y+z,y,z)$, the inverse should map back the other way.", "ans": "**Step 1 \u2014 understand the structure.** This matrix represents the transformation $x' = x+y+z$, $y'=y$, $z'=z$ (reading each row as an equation). To find the inverse, we want to express $x,y,z$ back in terms of $x',y',z'$. Since $y=y'$ and $z=z'$ directly, and $x'=x+y+z=x+y'+z'$, we can rearrange to get $x = x'-y'-z'$.\n\n**Step 2 \u2014 write out the inverse matrix** based on this reasoning \u2014 each row represents how to recover the original variable from the primed ones:\n$$A^{-1} = \\begin{bmatrix}1&-1&-1\\\\0&1&0\\\\0&0&1\\end{bmatrix}$$\n\n**Step 3 \u2014 verify by direct multiplication, $AA^{-1}$**, computing each entry as a row of $A$ dotted with a column of $A^{-1}$:\n\nRow 1 of $A$ is $(1,1,1)$. Dot with column 1 of $A^{-1}$, $(1,0,0)$: $1(1)+1(0)+1(0)=1$. Dot with column 2, $(-1,1,0)$: $1(-1)+1(1)+1(0) = -1+1+0=0$. Dot with column 3, $(-1,0,1)$: $1(-1)+1(0)+1(1) = -1+0+1=0$.\n\nRow 2 of $A$ is $(0,1,0)$. Dot with column 1: $0$. Dot with column 2: $0(-1)+1(1)+0(0)=1$. Dot with column 3: $0$.\n\nRow 3 of $A$ is $(0,0,1)$. Dot with column 1: $0$. Dot with column 2: $0$. Dot with column 3: $0(-1)+0(0)+1(1)=1$.\n\n**Result:**\n$$AA^{-1} = \\begin{bmatrix}1&0&0\\\\0&1&0\\\\0&0&1\\end{bmatrix} = I$$\n\n**Verified.**"}, {"cat": "Matrices & Determinants", "q": "Given $A=\\begin{bmatrix}4&2\\\\9&6\\end{bmatrix}$ and scalars $k_1=2$, $k_2=5$, verify that $k_1A+k_2A=(k_1+k_2)A$.", "hint": "Compute both sides separately using scalar multiplication and matrix addition, then compare.", "ans": "**What this identity says.** This is the **distributive law of scalar multiplication over addition** applied to matrices \u2014 it says that multiplying a matrix by two scalars separately and adding the results gives the same thing as multiplying it once by the sum of the scalars. We verify by computing both sides independently.\n\n**Step 1 \u2014 compute the left-hand side, $k_1A+k_2A$.** First find $k_1A$: multiply every entry of $A$ by $2$:\n$$k_1A = 2\\begin{bmatrix}4&2\\\\9&6\\end{bmatrix} = \\begin{bmatrix}8&4\\\\18&12\\end{bmatrix}$$\nNext find $k_2A$: multiply every entry of $A$ by $5$:\n$$k_2A = 5\\begin{bmatrix}4&2\\\\9&6\\end{bmatrix} = \\begin{bmatrix}20&10\\\\45&30\\end{bmatrix}$$\nNow add these two matrices entry-by-entry:\n$$k_1A+k_2A = \\begin{bmatrix}8+20&4+10\\\\18+45&12+30\\end{bmatrix} = \\begin{bmatrix}28&14\\\\63&42\\end{bmatrix}$$\n\n**Step 2 \u2014 compute the right-hand side, $(k_1+k_2)A$.** First find $k_1+k_2 = 2+5=7$. Then multiply every entry of $A$ by $7$:\n$$(k_1+k_2)A = 7\\begin{bmatrix}4&2\\\\9&6\\end{bmatrix} = \\begin{bmatrix}28&14\\\\63&42\\end{bmatrix}$$\n\n**Comparison**: both sides give $\\begin{bmatrix}28&14\\\\63&42\\end{bmatrix}$ \u2014 **they match exactly, verifying the identity.**"}, {"cat": "Matrices & Determinants", "q": "Classify the following matrices by type: (i) $\\begin{bmatrix}5&0&0\\\\0&5&0\\\\0&0&5\\end{bmatrix}$ (ii) $\\begin{bmatrix}1&0&2\\\\0&0&0\\\\2&0&0\\end{bmatrix}$ (iii) $\\begin{bmatrix}0&1&2\\\\-1&0&-3\\\\-2&3&0\\end{bmatrix}$ (iv) $\\begin{bmatrix}4&6\\\\0&6\\end{bmatrix}$.", "hint": "Check: are all off-diagonal entries zero and diagonal entries equal? Is it symmetric ($A^T=A$)? Is it skew-symmetric ($A^T=-A$)? Are all entries below (or above) the diagonal zero?", "ans": "**(i) $\\begin{bmatrix}5&0&0\\\\0&5&0\\\\0&0&5\\end{bmatrix}$.** All off-diagonal entries are zero, and every diagonal entry equals the same value, $5$. This is a **scalar matrix** (a special diagonal matrix with equal diagonal entries \u2014 it behaves like the number $5$ multiplied by the identity matrix, $5I$).\n\n**(ii) $\\begin{bmatrix}1&0&2\\\\0&0&0\\\\2&0&0\\end{bmatrix}$.** Check the transpose: swapping rows and columns gives back exactly the same matrix (entry $(1,3)=2$ matches entry $(3,1)=2$; entry $(1,2)=0$ matches $(2,1)=0$; entry $(2,3)=0$ matches $(3,2)=0$). So $A^T=A$ \u2014 this is a **symmetric matrix**. (As a side note, its determinant is $0$, since the entire second row is zero, so it's also singular.)\n\n**(iii) $\\begin{bmatrix}0&1&2\\\\-1&0&-3\\\\-2&3&0\\end{bmatrix}$.** Every diagonal entry is $0$, and each off-diagonal pair is the exact negative of its mirror: $(1,2)=1$ and $(2,1)=-1$; $(1,3)=2$ and $(3,1)=-2$; $(2,3)=-3$ and $(3,2)=3$. So $A^T=-A$ \u2014 this is a **skew-symmetric matrix**.\n\n**(iv) $\\begin{bmatrix}4&6\\\\0&6\\end{bmatrix}$.** Every entry *below* the main diagonal is zero (here, just the single entry in position $(2,1)$), while entries on and above the diagonal can be anything. This is an **upper triangular matrix**."}, {"cat": "Matrices & Determinants", "q": "Find the spur (trace) and determinant of $M=\\begin{bmatrix}2&4&8&16\\\\0&4&8&16\\\\0&0&8&16\\\\0&0&0&16\\end{bmatrix}$ and of $M^T$.", "hint": "$M$ is upper triangular, so its determinant is just the product of the diagonal entries. Transpose never changes trace or determinant.", "ans": "**Step 1 \u2014 find the trace (spur) of $M$**, by summing the diagonal entries:\n$$\\text{tr}(M) = 2+4+8+16 = 30$$\n\n**Step 2 \u2014 find the determinant of $M$.** Since $M$ is an **upper triangular matrix** (every entry below the main diagonal is zero), there's a shortcut: the determinant of any triangular matrix is simply the **product of its diagonal entries** (this follows from repeated cofactor expansion along the first column, which at every step only has one non-zero entry \u2014 the diagonal one):\n$$|M| = 2\\times4\\times8\\times16 = 1024$$\n\n**Step 3 \u2014 find the trace and determinant of $M^T$ (the transpose of $M$).** Two general facts make this step immediate, without recomputing anything: transposing a matrix never changes its diagonal entries (the diagonal of $A^T$ is always identical to the diagonal of $A$, since transposing only swaps entries *off* the diagonal), so $\\text{tr}(M^T) = \\text{tr}(M)$; and the determinant of a matrix always equals the determinant of its transpose, $|M^T|=|M|$, as a general property of determinants.\n\n**Final answer**: $\\text{tr}(M)=\\text{tr}(M^T)=30$; $|M|=|M^T|=1024$."}, {"cat": "Matrices & Determinants", "q": "Given $A=\\begin{bmatrix}a&b&c\\\\b&c&a\\\\c&a&b\\end{bmatrix}$, determine the cofactor of each element in column 2 of $A$.", "hint": "The cofactor of an element is $(-1)^{i+j}$ times the determinant of the $2\\times2$ matrix left after deleting that entry's row and column.", "ans": "**Recall the cofactor formula.** For an entry $a_{ij}$ (row $i$, column $j$), its **cofactor** $C_{ij} = (-1)^{i+j}M_{ij}$, where $M_{ij}$ is the **minor** \u2014 the determinant of the smaller matrix left after deleting row $i$ and column $j$. The sign factor $(-1)^{i+j}$ alternates in a checkerboard pattern.\n\n**Column 2 has three entries**: $a_{12}=b$ (row 1), $a_{22}=c$ (row 2), $a_{32}=a$ (row 3). We find the cofactor of each.\n\n**Cofactor of $a_{12}=b$** (row 1, column 2). Delete row 1 and column 2, leaving $\\begin{bmatrix}b&a\\\\c&b\\end{bmatrix}$. Its determinant: $b(b)-a(c)=b^2-ac$. The sign factor is $(-1)^{1+2}=(-1)^3=-1$:\n$$C_{12} = -(b^2-ac) = ac-b^2$$\n\n**Cofactor of $a_{22}=c$** (row 2, column 2). Delete row 2 and column 2, leaving $\\begin{bmatrix}a&c\\\\c&b\\end{bmatrix}$. Its determinant: $a(b)-c(c)=ab-c^2$. The sign factor is $(-1)^{2+2}=(-1)^4=+1$:\n$$C_{22} = +(ab-c^2) = ab-c^2$$\n\n**Cofactor of $a_{32}=a$** (row 3, column 2). Delete row 3 and column 2, leaving $\\begin{bmatrix}a&c\\\\b&a\\end{bmatrix}$. Its determinant: $a(a)-c(b)=a^2-bc$. The sign factor is $(-1)^{3+2}=(-1)^5=-1$:\n$$C_{32} = -(a^2-bc) = bc-a^2$$\n\n**Final answer**: $C_{12}=ac-b^2$, $C_{22}=ab-c^2$, $C_{32}=bc-a^2$."}, {"cat": "Matrices & Determinants", "q": "With appropriate example, distinguish between symmetric and orthogonal matrices.", "hint": "Symmetric: $A^T=A$. Orthogonal: $AA^T=A^TA=I$. These describe different properties, though a matrix could satisfy neither, one, or (in rare special cases) both.", "ans": "**Symmetric matrix.** As covered earlier, a square matrix $A$ is **symmetric** if it equals its own transpose: $A^T=A$ \u2014 meaning entries mirror each other across the main diagonal. Example: $A=\\begin{bmatrix}1&2\\\\2&3\\end{bmatrix}$.\n\n**Orthogonal matrix.** A square matrix $A$ is **orthogonal** if its transpose equals its inverse, or equivalently, if $AA^T=A^TA=I$ (the identity matrix). Geometrically, orthogonal matrices represent pure rotations or reflections that preserve lengths and angles. Example: $A=\\begin{bmatrix}\\frac{1}{\\sqrt2}&\\frac{1}{\\sqrt2}\\\\-\\frac{1}{\\sqrt2}&\\frac{1}{\\sqrt2}\\end{bmatrix}$ (a rotation matrix).\n\n**How they differ**: symmetry is about the matrix looking the same after being \"flipped\" across its diagonal; orthogonality is about the matrix's rows/columns being mutually perpendicular unit vectors, such that multiplying by its own transpose produces the identity. A matrix can be symmetric without being orthogonal (like the first example above \u2014 check: $A A^T$ for that matrix does *not* give the identity), and a matrix can be orthogonal without being symmetric (like the rotation-matrix example, where $A^T\\neq A$ in general, unless the rotation angle happens to make it so). The identity matrix itself is a special case that is *both* symmetric and orthogonal simultaneously."}, {"cat": "Matrices & Determinants", "q": "If $A$ and $B$ are two orthogonal square matrices of the same order, prove that their product, $AB$, is also orthogonal.", "hint": "An orthogonal matrix satisfies $MM^T=I$. Use the rule for the transpose of a product, $(AB)^T=B^TA^T$, and the fact that $AA^T=I$, $BB^T=I$.", "ans": "**What we need to show**: that $(AB)(AB)^T = I$ (and equivalently $(AB)^T(AB)=I$), given that $A$ and $B$ are each individually orthogonal, meaning $AA^T=A^TA=I$ and $BB^T=B^TB=I$.\n\n**Step 1 \u2014 recall the transpose-of-a-product rule.** For any two matrices, $(AB)^T = B^TA^T$ \u2014 note the order reverses when you distribute the transpose across a product.\n\n**Step 2 \u2014 compute $(AB)(AB)^T$**, substituting this rule:\n$$(
